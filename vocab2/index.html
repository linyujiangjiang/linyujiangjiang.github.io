<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0e0b1a">
<title>听音拼写</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:#0e0b1a;color:#eef0ff;
  background-image:
    radial-gradient(1200px 620px at 50% -12%, #2c1f52 0%, rgba(44,31,82,0) 62%),
    radial-gradient(820px 520px at 112% 112%, #103c3a 0%, rgba(16,60,58,0) 58%),
    radial-gradient(600px 420px at -10% 78%, #22184a 0%, rgba(34,24,74,0) 60%);
  background-attachment:fixed;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{
  max-width:520px;margin:0 auto;position:relative;
  min-height:100vh;
  padding:calc(18px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
}
.hidden{display:none!important}

/* ---------- 首页 ---------- */
.home{flex:1;display:flex;flex-direction:column;justify-content:center;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero-ico{
  width:84px;height:84px;border-radius:28px;margin:0 auto 22px;
  display:flex;align-items:center;justify-content:center;font-size:40px;
  background:linear-gradient(150deg,rgba(124,92,255,.35),rgba(74,217,195,.28));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 18px 50px -18px rgba(124,92,255,.8),inset 0 1px 0 rgba(255,255,255,.12);
}
h1{font-size:30px;letter-spacing:.5px;margin:0 0 12px;text-align:center;font-weight:800}
.sub{text-align:center;color:#9aa1cc;font-size:14.5px;line-height:1.75;margin:0 0 26px}
.sub b{color:#5ee7c4;font-weight:700}
.stat-row{display:flex;gap:10px;margin-bottom:22px}
.stat{
  flex:1;text-align:center;padding:13px 6px;border-radius:16px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
}
.stat .n{font-size:21px;font-weight:800;color:#5ee7c4;line-height:1.2}
.stat .l{font-size:11.5px;color:#8d94bf;margin-top:4px;letter-spacing:.4px}
.btn{
  width:100%;padding:17px;border-radius:17px;border:none;font-size:17px;font-weight:700;
  font-family:inherit;cursor:pointer;transition:transform .1s ease,opacity .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(.977)}
.btn.primary{
  background:linear-gradient(135deg,#7c5cff 0%,#5ee7c4 100%);color:#0a0a12;
  box-shadow:0 16px 36px -14px rgba(124,92,255,.95);
}
.btn.ghost{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.13);color:#e2e4f7;font-weight:600}
.btn:disabled{opacity:.4}
.gap{height:11px}

/* ---------- 词表浏览 ---------- */
#btnBrowse{margin-top:11px}
.listhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.listtitle{font-size:12.5px;color:#8d94bf;letter-spacing:.5px}
.wcard{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.075);margin-bottom:9px;
}
.wcard .sw{
  flex:none;width:38px;height:38px;border-radius:50%;border:none;padding:0;cursor:pointer;
  background:linear-gradient(135deg,#7c5cff,#4ad9c3);color:#0d0a1f;
  display:flex;align-items:center;justify-content:center;transition:transform .1s;
}
.wcard .sw:active{transform:scale(.9)}
.wcard .sw svg{width:18px;height:18px;display:block}
.wcard .wt{flex:1;min-width:0}
.wcard .ww{font-size:16.5px;font-weight:750;letter-spacing:.3px}
.wcard .ww .wipa{font-size:11.5px;color:#8d94bf;font-weight:500;margin-left:5px;letter-spacing:0}
.wcard .wz{font-size:13px;color:#a8afd6;margin-top:3px;line-height:1.5}
.wcard .wz .wpos{color:#ffd479;font-weight:700;margin-right:5px}

/* ---------- 答题 ---------- */
.topbar{margin-bottom:16px}
.progress{height:5px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7c5cff,#5ee7c4);transition:width .35s cubic-bezier(.4,0,.2,1)}
.meta{display:flex;justify-content:space-between;margin-top:9px;font-size:12.5px;color:#8d94bf;letter-spacing:.3px}
.meta b{color:#dfe3ff;font-weight:700}
.card{
  background:rgba(255,255,255,.055);border:1.5px solid rgba(255,255,255,.09);
  border-radius:26px;padding:24px 20px 20px;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:0 24px 60px -24px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06);
  transition:border-color .25s ease,box-shadow .25s ease;
}
.card.ok{border-color:rgba(94,231,196,.7);box-shadow:0 0 0 1px rgba(94,231,196,.2),0 24px 60px -24px rgba(0,0,0,.85)}
.card.bad{border-color:rgba(255,110,132,.7);box-shadow:0 0 0 1px rgba(255,110,132,.2),0 24px 60px -24px rgba(0,0,0,.85)}

.speaker{
  display:flex;align-items:center;justify-content:center;
  width:118px;height:118px;border-radius:50%;border:none;margin:2px auto 0;
  background:linear-gradient(150deg,#a48bff,#4ad9c3);color:#0d0a1f;
  box-shadow:0 18px 44px -14px rgba(124,92,255,.9),inset 0 2px 0 rgba(255,255,255,.35);
  cursor:pointer;transition:transform .12s ease,width .2s ease,height .2s ease;
}
.speaker svg{width:54px;height:54px;display:block;transition:width .2s ease,height .2s ease}
.speaker:active{transform:scale(.93)}
.speaker.playing{animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{from{box-shadow:0 18px 44px -14px rgba(124,92,255,.9)}to{box-shadow:0 18px 62px -4px rgba(94,231,196,.95)}}
.tip{text-align:center;color:#8d94bf;font-size:12.5px;margin:11px 0 2px;display:flex;align-items:center;justify-content:center;gap:12px}
.chip{
  border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#bfc5e8;
  border-radius:99px;padding:6px 13px;font-size:12.5px;font-family:inherit;cursor:pointer;
}
.chip:active{background:rgba(94,231,196,.16)}
.chip:disabled{opacity:.45}
.peekbox{
  margin-top:14px;background:rgba(94,231,196,.075);border:1px solid rgba(94,231,196,.3);
  border-radius:15px;padding:14px 16px;animation:fade .22s ease;
}
.peekbox .pw{font-size:23px;font-weight:800;letter-spacing:.4px;color:#fff;word-break:break-word}
.peekbox .pw .pipa{font-size:12.5px;color:#9aa1cc;font-weight:500;margin-left:6px;letter-spacing:0}
.peekbox .pz{margin-top:7px;font-size:14.5px;color:#dfe3ff;line-height:1.65}
.peekbox .pz .pst{color:#ffd479;font-weight:700;margin-right:6px}
.card.judged .peekbox{display:none}

.field{margin-top:19px}
.field label{display:block;font-size:12.5px;color:#8d94bf;margin-bottom:8px;letter-spacing:.6px;font-weight:600}
.field label .dim{color:#5c6389;font-weight:400;letter-spacing:0}
input.inp{
  width:100%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);
  border-radius:15px;padding:14px 16px;color:#fff;font-size:19px;font-family:inherit;
  outline:none;transition:border-color .18s,background .18s;letter-spacing:.3px;
}
input.inp::placeholder{color:#5f6689;font-size:16px;letter-spacing:0}
input.inp:focus{border-color:rgba(94,231,196,.75);background:rgba(94,231,196,.07)}
input.inp:disabled{opacity:.72}

.pos{display:flex;gap:9px;flex-wrap:wrap}
.pos button{
  flex:1;min-width:62px;padding:13px 4px;border-radius:14px;
  border:1.5px solid rgba(255,255,255,.13);background:rgba(255,255,255,.045);
  color:#c3c9ec;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;
  transition:all .15s ease;
}
.pos button.on{
  background:linear-gradient(135deg,#7c5cff,#4ad9c3);color:#0a0a12;border-color:transparent;
  box-shadow:0 8px 24px -10px rgba(124,92,255,.95);
}
.pos button:disabled{opacity:.8}

.actions{margin-top:22px}
.actions .row{display:flex;gap:10px}
.actions .row .btn{padding:15px;font-size:15.5px}

/* 判分后收起输入区，一屏能看完判定和「下一题」 */
.card.judged .speaker{width:78px;height:78px}
.card.judged .speaker svg{width:36px;height:36px}
.card.judged .tip{margin:8px 0 0}
.card.judged .field{display:none}
.card.judged .actions{display:none}

/* 判定区 */
.verdict{margin-top:20px;padding-top:18px;border-top:1px dashed rgba(255,255,255,.13);animation:fade .3s ease}
.headline{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.headline.good{color:#5ee7c4}
.headline.mid{color:#ffcf6b}
.headline.bad{color:#ff8fa3}
.rv{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:14.5px;line-height:1.55}
.rv:last-of-type{border-bottom:none}
.rv .k{color:#7f87b5;width:40px;flex:none;padding-top:1px}
.rv .v{flex:1;word-break:break-word}
.rv .v b{color:#5ee7c4;font-weight:700}
.rv .v del{color:#ff8fa3;text-decoration:none;opacity:.85}
.rv .v .fix{color:#ffd479}
.rv .v .ipa{color:#9aa1cc;font-size:13px;margin-left:2px}
.answerbox{
  margin-top:14px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);
  border-radius:15px;padding:14px 16px;font-size:14.5px;line-height:1.7;color:#dfe3ff;
}
.answerbox .w{font-size:19px;font-weight:800;color:#fff;letter-spacing:.4px}
.answerbox .w .ipa{font-size:13.5px;color:#9aa1cc;font-weight:500}
.answerbox .p{color:#ffd479;font-weight:700;margin-left:6px;font-size:13.5px}
.answerbox .z{color:#c3c9ec;margin-top:3px}
.mini{display:inline-flex;align-items:center;gap:5px;margin-top:11px;padding:8px 14px;border-radius:99px;border:1.5px solid rgba(124,92,255,.55);background:rgba(124,92,255,.13);color:#cfc6ff;font-size:13px;font-family:inherit;font-weight:600;cursor:pointer}

/* ---------- 结果 ---------- */
.done{flex:1;display:flex;flex-direction:column;justify-content:center;animation:fade .4s ease}
.ring{width:150px;height:150px;margin:0 auto 18px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.ring::after{content:"";position:absolute;inset:13px;border-radius:50%;background:rgba(14,11,26,.82)}
.ring .pct,.ring .lb{position:relative;z-index:1}
.ring .pct{font-size:42px;font-weight:800;line-height:1;display:flex;align-items:baseline;justify-content:center}
.ring .pct small{font-size:18px;font-weight:700;opacity:.75;margin-left:1px}
.ring .pct small{font-size:19px;font-weight:700;opacity:.8}
.ring .lb{font-size:12px;color:#8d94bf;margin-top:5px;letter-spacing:1px}
.done-h{text-align:center;font-size:19px;font-weight:800;margin:0 0 6px}
.done-s{text-align:center;color:#9aa1cc;font-size:13.5px;margin:0 0 22px;line-height:1.7}
.wronglist{max-height:38vh;overflow-y:auto;margin:2px 0 20px;-webkit-overflow-scrolling:touch}
.wl{display:flex;justify-content:space-between;align-items:baseline;padding:11px 14px;border-radius:13px;background:rgba(255,255,255,.04);margin-bottom:7px;font-size:14.5px}
.wl .a{font-weight:700;letter-spacing:.3px}
.wl .b{color:#8d94bf;font-size:12.5px;text-align:right;margin-left:12px;flex:none;max-width:56%}
.footer-note{text-align:center;color:#5c6389;font-size:11.5px;margin-top:18px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ 首页 ============ -->
  <section class="home" id="screen-home">
    <div class="hero-ico">🎧</div>
    <h1>听音拼写</h1>
    <p class="sub">听发音 → 拼出单词 → 写词性和一个释义<br>一共 <b id="totalN">19</b> 个词</p>

    <div class="stat-row">
      <div class="stat"><div class="n" id="stMastered">0</div><div class="l">已掌握</div></div>
      <div class="stat"><div class="n" id="stWrong">0</div><div class="l">待攻克</div></div>
      <div class="stat"><div class="n" id="stRuns">0</div><div class="l">练过轮次</div></div>
    </div>

    <button class="btn primary" id="btnStart">开始听写</button>
    <div class="gap"></div>
    <button class="btn ghost hidden" id="btnWrongOnly"><span id="wrongOnlyLabel">只练待攻克的词</span></button>
    <button class="btn ghost" id="btnBrowse">📖 翻一遍词表</button>

    <p class="footer-note" id="homeNote">第一次点喇叭时如果没有声音，<br>再点一下就好。</p>
  </section>

  <!-- ============ 词表 ============ -->
  <section id="screen-list" class="hidden">
    <div class="listhead">
      <button class="chip" id="btnListBack">← 返回</button>
      <span class="listtitle" id="listCount"></span>
    </div>
    <div id="wordList"></div>
  </section>

  <!-- ============ 答题 ============ -->
  <section id="screen-quiz" class="hidden">
    <div class="topbar">
      <div class="progress"><i id="bar"></i></div>
      <div class="meta"><span id="lblIndex">1 / 19</span><span id="lblScore">对 <b>0</b></span></div>
    </div>

    <div class="card" id="card">
      <button class="speaker" id="btnSpeak" aria-label="播放发音">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.06A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
      </button>
      <div class="tip">
        <span>点喇叭再听</span>
        <button class="chip" id="btnSlow">🐢 慢速</button>
        <button class="chip" id="btnHint">👁 看答案</button>
      </div>

      <div class="peekbox hidden" id="hintBox"></div>

      <div class="field">
        <label for="inpSpell">拼写</label>
        <input class="inp" id="inpSpell" type="text" inputmode="latin" autocapitalize="none"
               autocorrect="off" spellcheck="false" autocomplete="off" enterkeyhint="next"
               placeholder="听到的那个单词">
      </div>

      <div class="field">
        <label>词性 <span class="dim">（可多选）</span></label>
        <div class="pos" id="posRow"></div>
      </div>

      <div class="field">
        <label for="inpZh">写一个中文释义</label>
        <input class="inp" id="inpZh" type="text" autocomplete="off" enterkeyhint="done"
               placeholder="想到哪个写哪个">
      </div>

      <div class="actions" id="actions">
        <button class="btn primary" id="btnSubmit">提交</button>
      </div>

      <div class="verdict hidden" id="verdict"></div>
    </div>
  </section>

  <!-- ============ 结果 ============ -->
  <section class="done hidden" id="screen-done">
    <div class="ring" id="ring">
      <div class="pct" id="finalPct">0<small>%</small></div>
      <div class="lb">正确率</div>
    </div>
    <h2 class="done-h" id="doneTitle">这一轮结束</h2>
    <p class="done-s" id="doneSub"></p>
    <div class="wronglist" id="wrongList"></div>
    <button class="btn primary" id="btnAgain">再来一轮</button>
    <div class="gap"></div>
    <button class="btn ghost" id="btnBackHome">回首页</button>
  </section>

</div>

qqqqq//tUxKoDwAABpAAAACAAADSAAAAEqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//tUxKoDwAABpAAAACAAADSAAAAEqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq"}};
var POS_LIST = ["n.", "v.", "adj.", "adv."];

var SAVE_KEY = "vocab_dictation_v1";
var store = {};
try { store = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}") || {}; } catch (e) { store = {}; }
function saveStore() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(store)); } catch (e) {} }
function rec(w) {
  if (!store[w]) store[w] = { r: 0, w: 0 };
  return store[w];
}

/* ---------- 音频 ---------- */
var audioEl = null;
var YD = "https://dict.youdao.com/dictvoice?type=2&audio=";

function srcOf(word) {
  var pack = AUDIO[word];
  if (pack && pack.normal) return pack.normal;
  // 兜底：内嵌音频缺失时走在线发音（美音）
  return YD + encodeURIComponent(word);
}

function playWord(word, slow) {
  try {
    var src = srcOf(word);
    if (!src) return;
    if (!audioEl) audioEl = new Audio();
    var sp = document.getElementById("btnSpeak");
    audioEl.pause();
    audioEl.src = src;
    var rate = slow ? 0.72 : 1;
    try { audioEl.playbackRate = rate; } catch (e) {}
    var p = audioEl.play();
    if (p && p.then) {
      sp.classList.add("playing");
      p.catch(function () {
        // 有些内核不吃内嵌 data 音频，退回在线美音
        var alt = YD + encodeURIComponent(word);
        if (audioEl.src.indexOf("dict.youdao.com") < 0) {
          audioEl.src = alt;
          try { audioEl.playbackRate = rate; } catch (e) {}
          audioEl.play().catch(function () {});
        }
      });
    }
    audioEl.onended = function () { sp.classList.remove("playing"); };
    setTimeout(function () { sp.classList.remove("playing"); }, 2600);
  } catch (e) {}
}

/* ---------- 状态 ---------- */
var queue = [], qi = 0, score = 0, roundResults = [], cur = null;
var chosenPos = {}, locked = false, zhFixed = false, lastGiveUp = false, peeked = false;

var $ = function (id) { return document.getElementById(id); };
function show(id) {
  ["screen-home", "screen-quiz", "screen-done", "screen-list"].forEach(function (s) {
    $(s).classList.toggle("hidden", s !== id);
  });
  window.scrollTo(0, 0);
}

function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function masteredCount() {
  return WORDS.filter(function (x) { return (store[x.w] && store[x.w].r || 0) >= 1; }).length;
}
function wrongCount() {
  return WORDS.filter(function (x) { return store[x.w] && store[x.w].w > 0; }).length;
}

function refreshHome() {
  $("totalN").textContent = WORDS.length;
  $("stMastered").textContent = masteredCount();
  $("stWrong").textContent = wrongCount();
  $("stRuns").textContent = (store.__runs || 0);
  var n = wrongCount();
  var b = $("btnWrongOnly");
  if (n > 0) {
    b.classList.remove("hidden");
    $("wrongOnlyLabel").textContent = "只练待攻克的 " + n + " 个词";
  } else {
    b.classList.add("hidden");
  }
}

var SPEAKER_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.06A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>';

function renderList() {
  var el = $("wordList");
  el.innerHTML = "";
  WORDS.forEach(function (item) {
    var d = document.createElement("div");
    d.className = "wcard";
    d.innerHTML = '<button class="sw" aria-label="读音">' + SPEAKER_SVG + "</button>" +
      '<div class="wt"><div class="ww">' + escapeHtml(item.w) +
        '<span class="wipa">' + escapeHtml(item.ipa) + "</span></div>" +
      '<div class="wz"><span class="wpos">' + escapeHtml(item.pos.join(" ")) + "</span>" +
        escapeHtml(item.zh) + "</div></div>";
    d.querySelector(".sw").onclick = function () { playWord(item.w, false); };
    el.appendChild(d);
  });
  $("listCount").textContent = WORDS.length + " 个词";
}

/* ---------- 一轮 ---------- */
function startRound(list) {
  queue = shuffle(list);
  qi = 0; score = 0; roundResults = [];
  store.__runs = (store.__runs || 0) + 1;
  saveStore();
  show("screen-quiz");
  renderQ();
}

function renderQ() {
  cur = queue[qi];
  locked = false; zhFixed = false;
  chosenPos = {};
  peeked = false;

  $("card").classList.remove("ok", "bad", "judged");
  $("verdict").classList.add("hidden");
  $("verdict").innerHTML = "";
  $("actions").classList.remove("hidden");
  $("hintBox").classList.add("hidden");
  $("hintBox").innerHTML = "";
  var hb = $("btnHint");
  hb.disabled = false;
  hb.textContent = "👁 看答案";

  var total = queue.length;
  $("bar").style.width = ((qi) / total * 100) + "%";
  $("lblIndex").textContent = (qi + 1) + " / " + total;
  $("lblScore").innerHTML = "对 <b>" + score + "</b>";

  var sp = $("inpSpell");
  sp.value = ""; sp.disabled = false; sp.style.borderColor = "";
  var zh = $("inpZh");
  zh.value = ""; zh.disabled = false;
  $("btnSubmit").disabled = false;

  var row = $("posRow");
  row.innerHTML = "";
  POS_LIST.forEach(function (p) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = p;
    b.onclick = function () {
      if (locked) return;
      if (chosenPos[p]) { delete chosenPos[p]; b.classList.remove("on"); }
      else { chosenPos[p] = 1; b.classList.add("on"); }
    };
    row.appendChild(b);
  });

  playWord(cur.w, false);
  setTimeout(function () { try { sp.focus({ preventScroll: true }); } catch (e) {} }, 260);
}

/* ---------- 看答案（可反复开合，不影响判分） ---------- */
function togglePeek() {
  if (locked) return;
  peeked = !peeked;
  var box = $("hintBox");
  var b = $("btnHint");
  if (peeked) {
    box.innerHTML =
      '<div class="pw">' + escapeHtml(cur.w) +
        '<span class="pipa">' + escapeHtml(cur.ipa) + "</span></div>" +
      '<div class="pz"><span class="pst">' + escapeHtml(cur.pos.join(" ")) + "</span>" +
        escapeHtml(cur.zh) + "</div>";
    box.classList.remove("hidden");
    b.textContent = "🙈 收起";
  } else {
    box.innerHTML = "";
    box.classList.add("hidden");
    b.textContent = "👁 看答案";
  }
}

/* ---------- 判定 ---------- */
function norm(s) { return (s || "").toLowerCase().replace(/[\s\-_]/g, ""); }

function zhMatch(input, word) {
  var t = (input || "").replace(/[\s，,。.；;、\/·（）()"\u3000]/g, "");
  if (!t) return false;
  if (t.length < 2) return false;
  return word.keys.some(function (k) {
    return t.indexOf(k) >= 0 || (t.length >= 2 && k.indexOf(t) >= 0);
  });
}

function posMatch(word) {
  var a = Object.keys(chosenPos).sort().join(",");
  var b = word.pos.slice().sort().join(",");
  return a === b;
}

function submit(giveUp) {
  if (locked) return;
  var spellRaw = $("inpSpell").value;
  var zhRaw = $("inpZh").value;

  if (!giveUp) {
    if (!spellRaw.trim()) { shake($("inpSpell")); return; }
    if (Object.keys(chosenPos).length === 0) { shake($("posRow")); return; }
    if (!zhRaw.trim()) { shake($("inpZh")); return; }
  }

  locked = true;
  lastGiveUp = !!giveUp;
  var okSpell = !giveUp && norm(spellRaw) === norm(cur.w);
  var okPos = !giveUp && posMatch(cur);
  var okZh = !giveUp && zhMatch(zhRaw, cur);

  var perfect = okSpell && okPos && okZh;
  if (perfect) score++;

  var r = rec(cur.w);
  if (perfect) { r.r++; } else { r.w++; }
  saveStore();

  roundResults.push({ w: cur.w, ok: perfect });

  $("inpSpell").disabled = true;
  $("inpZh").disabled = true;
  $("btnSubmit").disabled = true;
  $("actions").classList.add("hidden");

  $("card").classList.add(perfect ? "ok" : "bad");
  $("card").classList.add("judged");
  peeked = false;
  $("hintBox").classList.add("hidden");
  $("hintBox").innerHTML = "";
  $("btnHint").disabled = true;
  $("btnHint").textContent = "👁 看答案";
  $("lblScore").innerHTML = "对 <b>" + score + "</b>";

  renderVerdict(okSpell, okPos, okZh, spellRaw, zhRaw);
}

function shake(el) {
  var d = el.classList.contains("pos") ? el : el;
  d.animate(
    [{ transform: "translateX(0)" }, { transform: "translateX(-6px)" },
     { transform: "translateX(6px)" }, { transform: "translateX(0)" }],
    { duration: 260 }
  );
}

function renderVerdict(okSpell, okPos, okZh, spellRaw, zhRaw) {
  var v = $("verdict");
  var got = [okSpell, okPos, okZh].filter(Boolean).length;
  var head, cls;
  if (got === 3) { head = "全对 ✓"; cls = "good"; }
  else if (got === 2) { head = "差一点"; cls = "mid"; }
  else if (got === 1) { head = "再记一下"; cls = "mid"; }
  else { head = "这题没过"; cls = "bad"; }

  var h = "";
  h += '<div class="headline ' + cls + '">' + head + "</div>";

  h += '<div class="rv"><div class="k">拼写</div><div class="v">';
  if (okSpell) h += "<b>" + cur.w + "</b>";
  else h += "<del>" + (spellRaw ? escapeHtml(spellRaw) : "（空）") + "</del> → <b>" + cur.w + "</b>";
  h += "</div></div>";

  h += '<div class="rv"><div class="k">词性</div><div class="v">';
  var chosenTxt = Object.keys(chosenPos).length ? Object.keys(chosenPos).join(" ") : "（未选）";
  if (okPos) h += "<b>" + cur.pos.join(" ") + "</b>";
  else h += "<del>" + escapeHtml(chosenTxt) + "</del> → <b>" + cur.pos.join(" ") + "</b>";
  h += "</div></div>";

  h += '<div class="rv"><div class="k">释义</div><div class="v">';
  if (okZh) h += "<b>" + escapeHtml(zhRaw) + "</b>";
  else h += "<del>" + (zhRaw ? escapeHtml(zhRaw) : "（空）") + "</del> → <span class=\"fix\">" + escapeHtml(cur.zh) + "</span>";
  h += "</div></div>";

  h += '<div class="answerbox">'
    + '<div class="w">' + cur.w + ' <span class="ipa">' + cur.ipa + '</span>'
    + '<span class="p">' + cur.pos.join(" ") + "</span></div>"
    + '<div class="z">' + escapeHtml(cur.zh) + "</div>"
    + "</div>";

  if (!okZh && !lastGiveUp) {
    h += '<button class="mini" id="btnIWasRight">其实我答对了 ✓</button>';
  }

  h += '<div class="gap"></div>';
  h += '<button class="btn primary" id="btnNext">' + (qi + 1 >= queue.length ? "看结果" : "下一题") + "</button>";

  v.innerHTML = h;
  v.classList.remove("hidden");

  $("btnNext").onclick = nextQ;
  var iwr = $("btnIWasRight");
  if (iwr) {
    iwr.onclick = function () {
      iwr.remove();
      var r = rec(cur.w);
      r.w = Math.max(0, r.w - 1);
      r.r = (r.r || 0) + 1;
      saveStore();
      score++;
      $("lblScore").innerHTML = "对 <b>" + score + "</b>";
      $("card").classList.remove("bad");
      $("card").classList.add("ok");
      var last = roundResults[roundResults.length - 1];
      if (last) last.ok = true;
      var hl = v.querySelector(".headline");
      if (hl) { hl.textContent = "算你答对了 ✓"; hl.className = "headline good"; }
    };
  }
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function nextQ() {
  qi++;
  if (qi >= queue.length) { showDone(); return; }
  renderQ();
}

/* ---------- 结果页 ---------- */
function showDone() {
  var total = queue.length;
  var pct = total ? Math.round(score / total * 100) : 0;
  $("finalPct").innerHTML = pct + "<small>%</small>";
  $("ring").style.background =
    "conic-gradient(#5ee7c4 0deg " + (pct * 3.6) + "deg, rgba(255,255,255,.12) " + (pct * 3.6) + "deg 360deg)";

  var wrongs = roundResults.filter(function (x) { return !x.ok; }).map(function (x) { return x.w; });
  var t = "这一轮结束";
  if (pct === 100) t = "全对，漂亮 🎉";
  else if (pct >= 80) t = "稳，就差一点";
  else if (pct >= 60) t = "有进步空间";
  else if (pct >= 30) t = "这几个再记一遍就行";
  else t = "别急，多听两遍再来";
  $("doneTitle").textContent = t;

  $("doneSub").innerHTML = "这轮答对 <b style=\"color:#5ee7c4\">" + score + "</b> / " + total
    + (wrongs.length ? "，下面这些再练一遍" : "，全部拿下");

  var list = $("wrongList");
  list.innerHTML = "";
  var items = wrongs || [];
  items.forEach(function (w) {
    var item = null;
    for (var i = 0; i < WORDS.length; i++) if (WORDS[i].w === w) item = WORDS[i];
    if (!item) return;
    var d = document.createElement("div");
    d.className = "wl";
    d.innerHTML = '<span class="a">' + escapeHtml(item.w) + "</span>"
      + '<span class="b">' + item.pos.join(" ") + " · " + escapeHtml(item.zh) + "</span>";
    list.appendChild(d);
  });
  list.classList.toggle("hidden", items.length === 0);

  $("btnAgain").onclick = function () {
    var again = wrongs.length
      ? WORDS.filter(function (x) { return wrongs.indexOf(x.w) >= 0; })
      : WORDS;
    startRound(again);
  };
  $("btnBackHome").onclick = function () { refreshHome(); show("screen-home"); };

  show("screen-done");
}

/* ---------- 事件 ---------- */
$("btnStart").onclick = function () { startRound(WORDS); };
$("btnWrongOnly").onclick = function () {
  var list = WORDS.filter(function (x) { return store[x.w] && store[x.w].w > 0; });
  if (list.length) startRound(list);
};
$("btnBrowse").onclick = function () { renderList(); show("screen-list"); };
$("btnListBack").onclick = function () { refreshHome(); show("screen-home"); };

$("btnSpeak").onclick = function () { playWord(cur.w, false); };
$("btnSlow").onclick = function () { playWord(cur.w, true); };
$("btnHint").onclick = togglePeek;

$("inpSpell").addEventListener("input", function () {
  var el = this;
  var v = el.value.toLowerCase().replace(/[^a-z' ]/g, "");
  if (v !== el.value) el.value = v;
});

$("inpSpell").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); $("inpZh").focus(); }
});
$("inpZh").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); submit(false); }
});

$("btnSubmit").onclick = function () { submit(false); };

document.addEventListener("visibilitychange", function () {
  if (document.hidden && audioEl) { try { audioEl.pause(); } catch (e) {} }
});

/* iOS 微信里第一次的播放必须发生在点击的同一个事件里，
   开始按钮 → startRound → renderQ → playWord 是同步链路，所以第一题能出声。 */

refreshHome();
show("screen-home");
</script>
