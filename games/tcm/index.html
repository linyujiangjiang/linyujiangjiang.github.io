<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>杏林问诊 · 选一个版本</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#14100b;
    background-image:radial-gradient(ellipse at 50% 0%,#2a2016 0%,#14100b 62%);
    color:#e8dcc2;
    font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif;
    display:flex;align-items:center;justify-content:center;
    padding:28px 18px;min-height:100%;
    -webkit-text-size-adjust:100%;
  }
  .wrap{width:100%;max-width:760px;text-align:center}
  h1{font-size:44px;font-weight:normal;letter-spacing:.34em;color:#f2e6c8;
     text-indent:.34em;text-shadow:0 3px 0 rgba(0,0,0,.5)}
  .sub{margin-top:12px;font-size:15px;letter-spacing:.24em;color:#8d7c62}
  .cards{display:flex;gap:20px;margin-top:38px;justify-content:center;flex-wrap:wrap}
  .card{
    flex:1 1 300px;max-width:340px;text-decoration:none;color:inherit;
    padding:26px 22px 22px;
    background:linear-gradient(178deg,#f5eed9 0%,#ece0c2 46%,#dfd0ac 100%);
    border:3px solid #8b7350;
    box-shadow:inset 0 0 0 3px rgba(255,250,235,.6),0 14px 34px rgba(0,0,0,.55);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .card:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 3px rgba(255,250,235,.75),0 20px 40px rgba(0,0,0,.62)}
  .card b{display:block;font-size:29px;font-weight:normal;letter-spacing:.2em;color:#a83024}
  .card i{display:block;margin-top:12px;font-style:normal;font-size:15px;
    line-height:1.7;color:#5a4a32}
  .card span{display:inline-block;margin-top:16px;font-size:13px;letter-spacing:.1em;
    color:#8b7350;border-top:1px solid rgba(139,115,80,.35);padding-top:10px}
  .foot{margin-top:34px;font-size:14px;line-height:1.9;color:#7a6a51;letter-spacing:.06em}
  .foot em{font-style:normal;color:#c9a25c}
  @media (max-width:560px){
    h1{font-size:32px;letter-spacing:.24em;text-indent:.24em}
    .sub{font-size:13px}
    .cards{gap:14px;margin-top:26px}
    .card{padding:20px 16px 18px}
    .card b{font-size:24px}
    .card i{font-size:14px}
    .foot{font-size:13px;margin-top:24px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>杏林问诊</h1>
    <div class="sub">四 诊 辨 证 · v 1 . 1</div>

    <div class="cards">
      <a class="card" href="pc/index.html">
        <b>电 脑 版</b>
        <i>横屏 1920×1080，鼠标悬停能看到病人身上哪儿能点。<br>适合坐在电脑前慢慢看。</i>
        <span>v1.1 · pc</span>
      </a>
      <a class="card" href="m/index.html">
        <b>手 机 版</b>
        <i>手机竖着拿，整个画面自动转 90°，把手机转过来就能正着看。<br>手指点哪儿都行。</i>
        <span>v1.1 · mobile</span>
      </a>
    </div>

    <div class="foot">
      两个版本的存档<em>各自独立</em>，互不影响。<br>
      手机上建议用手机版；电脑上打开手机版会转得很别扭。
    </div>
  </div>
</body>
</html>
