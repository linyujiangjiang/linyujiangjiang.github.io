<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>溟的音色试听 · 第二轮</title>
<style>
  :root{--ink:#14120f;--gold:#d6b26e;--paper:#efe9dd;--dim:#9a9082;}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#2a241c 0%,var(--ink) 55%);color:var(--paper);font-family:"KaiTi","STKaiti","Songti SC",serif;padding:48px 20px 64px;display:flex;flex-direction:column;align-items:center;}
  h1{font-size:clamp(26px,5vw,40px);letter-spacing:.16em;color:var(--gold);font-weight:400;margin:0 0 8px;}
  .sub{color:var(--dim);letter-spacing:.2em;font-size:13px;margin-bottom:30px;}
  .list{width:min(660px,100%);display:flex;flex-direction:column;gap:12px;}
  .item{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid rgba(214,178,110,.22);border-radius:12px;background:rgba(255,255,255,.03);}
  .meta{flex:1;min-width:0;}
  .name{font-size:16px;letter-spacing:.08em;}
  .tag{font-size:12px;color:var(--dim);margin-top:3px;letter-spacing:.05em;}
  audio{width:210px;flex:0 0 210px;}
  @media(max-width:560px){.item{flex-direction:column;align-items:flex-start;}audio{width:100%;flex:1 1 auto;}}
  .tip{margin-top:30px;color:#6f675c;font-size:12.5px;line-height:2;text-align:center;letter-spacing:.08em;}
</style>
</head>
<body>
  <h1>第二轮 · 十 个声音</h1>
  <div class="sub">同一句话 · 都往软和甜里挑</div>
  <div class="list">
    <div class="item"><div class="meta"><div class="name">晓晓 · 原味</div><div class="tag">女 · 温柔，最自然</div></div><audio controls preload="none" src="./01_xiaoxiao.mp3"></audio></div>
    <div class="item"><div class="meta"><div class="name">晓晓 · 很软</div><div class="tag">女 · 慢一点、低一点，最软</div></div><audio controls preload="none" src="./02_xiaoxiao_soft.mp3"></audio></div>
    <div class="item"><div class="meta"><div class="name">晓晓 · 甜</div><div class="tag">女 · 快一点、高一点</div></div><audio controls preload="none" src="./03_xiaoxiao_sweet.mp3"></audio></div>
    <div class="item"><div class="meta"><div class="name">晓伊 · 活泼</div><div class="tag">女 · 轻快</div></div><audio controls preload="none" src="./04_xiaoyi.mp3"></audio></div>
    <div class="item"><div class="meta"><div class="name">晓伊 · 软萌</div><div class="tag">女 · 低一点、慢一点</div></div><audio controls preload="none" src="./05_xiaoyi_soft.mp3"></audio></div>
    <div class="item"><div class="meta"><div class="name">小北 · 东北</div><div class="tag">女 · 活泼接地气</div></div><audio controls preload="none" src="./06_xiaobei.mp3"></audio></div>
    <div class="item"><div class="meta"><div class="name">小北 · 软</div><div class="tag">女 · 东北，但压软了</div></div><audio controls preload="none" src="./07_xiaobei_soft.mp3"></audio></div>
    <div class="item"><div class="meta"><div class="name">晓臻 · 台湾</div><div class="tag">女 · 软糯</div></div><audio controls preload="none" src="./08_hsiaochen.mp3"></audio></div>
    <div class="item"><div class="meta"><div class="name">晓雨 · 台湾甜</div><div class="tag">女 · 更甜</div></div><audio controls preload="none" src="./09_hsiaoyu.mp3"></audio></div>
    <div class="item"><div class="meta"><div class="name">晓妮 · 陕西</div><div class="tag">女 · 中原口音，意外可爱</div></div><audio controls preload="none" src="./10_xiaoni.mp3"></audio></div>
  </div>
  <div class="tip">挑一个，或者说「软过了 / 还想要再甜一点」，我调参数再试</div>
</body>
</html>
