<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>藏象 · 同脏相消</title>
<style>
  :root{
    --paper:#f7f0df;
    --paper2:#efe4cb;
    --ink:#2b2620;
    --ink2:#5d5447;
    --ink3:#8d8271;
    --cinnabar:#b2372a;
    --cinnabar-l:#d15a45;
    --gold:#b39458;
    --jade:#4e6e5d;
    --line:rgba(140,112,66,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,"SimSun",serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 640px at 50% -10%, #fdf8ec 0%, rgba(253,248,236,0) 62%),
      radial-gradient(900px 520px at 12% 108%, rgba(186,158,106,.20), transparent 62%),
      repeating-linear-gradient(0deg, rgba(150,120,72,.05) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, rgba(150,120,72,.035) 0 1px, transparent 1px 24px),
      #eee3cd;
    min-height:100%;
    overflow-x:hidden;
  }
  /* ---------- 顶栏 ---------- */
  #hud{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:18px;
    padding:10px 22px;
    background:linear-gradient(180deg,rgba(250,244,230,.96),rgba(247,238,219,.92));
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(4px);
  }
  .brand{display:flex;align-items:center;gap:10px}
  .seal-logo{
    width:34px;height:34px;flex:none;
    display:grid;place-items:center;
    background:var(--cinnabar);color:#fbf3e2;
    font-size:19px;font-weight:700;letter-spacing:0;
    border-radius:2px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .brand .t{font-size:17px;letter-spacing:.28em;color:var(--ink)}
  .brand .s{font-size:11px;letter-spacing:.22em;color:var(--ink3);margin-top:2px}
  .stats{display:flex;align-items:center;gap:16px;margin-left:auto;font-size:13px;color:var(--ink2);letter-spacing:.06em}
  .stat b{font-size:16px;color:var(--ink);font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
  .combo{min-width:60px;transition:.2s}
  .combo.hot{color:var(--cinnabar);text-shadow:0 0 10px rgba(178,55,42,.35)}
  .clock{font-variant-numeric:tabular-nums;font-size:18px;color:var(--jade);letter-spacing:.04em}
  .clock.warn{color:var(--cinnabar);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.45}}
  #hud .btn-mini{
    font-family:inherit;font-size:12px;letter-spacing:.1em;
    padding:6px 12px;border:1px solid var(--line);background:transparent;
    color:var(--ink2);border-radius:2px;cursor:pointer;transition:.15s;
  }
  #hud .btn-mini:hover{border-color:var(--cinnabar);color:var(--cinnabar)}

  /* ---------- 主区 ---------- */
  #main{
    display:grid;
    grid-template-columns:minmax(0,1fr) 236px;
    gap:26px;
    max-width:1240px;
    margin:0 auto;
    padding:26px 22px 40px;
    align-items:start;
    align-content:center;
    min-height:calc(100vh - 67px);
  }
  #board{
    position:relative;
    display:grid;
    grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));
    gap:10px;
    padding:16px;
    background:linear-gradient(180deg,rgba(255,251,240,.72),rgba(250,243,226,.55));
    border:1px solid var(--line);
    border-radius:3px;
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 10px 30px rgba(110,84,44,.08);
  }
  .tile{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    min-height:clamp(82px, 10.5vh, 106px);
    padding:14px 8px 12px;
    font-family:inherit;
    font-size:clamp(13px,1.55vw,17px);
    line-height:1.45;letter-spacing:.07em;text-align:center;
    color:var(--ink);
    background:linear-gradient(180deg,#fffaf0,#f5ecd7);
    border:1px solid #cfbe98;
    border-radius:2px;
    box-shadow:0 1px 0 #fff inset, 0 2px 4px rgba(96,72,38,.10);
    cursor:pointer;
    transition:transform .13s ease, box-shadow .13s ease, border-color .13s, background .18s, opacity .3s;
    animation:tilein .4s both;
    user-select:none;
  }
  .tile::before{
    content:"";position:absolute;left:26%;right:26%;top:7px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(178,55,42,.38),transparent);
  }
  .tile .txt{display:block}
  .tile .txt small{font-size:.66em;opacity:.66;letter-spacing:0}
  .tile[data-len="7"]{font-size:clamp(12px,1.34vw,14px);letter-spacing:.02em}
  .tile[data-len="8"]{font-size:clamp(11px,1.24vw,13px);letter-spacing:.02em}
  .tile[data-len="9"]{font-size:clamp(11px,1.22vw,14px);letter-spacing:.02em}
  .tile:hover{transform:translateY(-2px);box-shadow:0 1px 0 #fff inset,0 7px 16px rgba(96,72,38,.18);border-color:#c0ac82}
  .tile:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px}
  .tile.sel{
    border-color:var(--cinnabar);
    box-shadow:0 0 0 2px rgba(178,55,42,.22), 0 8px 18px rgba(96,72,38,.18);
    transform:translateY(-3px);
    background:linear-gradient(180deg,#fff7ea,#f8ead8);
  }
  .tile.sel::after{
    content:"";position:absolute;inset:3px;border:1px solid rgba(178,55,42,.28);border-radius:1px;pointer-events:none;
  }
  .tile.bad{animation:shake .38s ease}
  .tile.ok{
    background:linear-gradient(180deg,#c74734,#a9301f);
    border-color:#8d2416;
    color:#fdf3e2;
    animation:okpop .42s ease forwards;
  }
  .tile.ok::before{background:rgba(255,240,220,.4)}
  .tile.gone{opacity:0;transform:scale(.7);pointer-events:none;border-style:dashed;border-color:rgba(150,120,72,.28);background:transparent;box-shadow:none}
  .tile.gone .txt{opacity:0}
  .tile.hint{animation:hintpulse .9s ease 2}
  /* 屌炸天：90 块挤一屏 */
  #board.tight{gap:7px;padding:12px}
  #board.tight .tile{
    min-height:58px;padding:6px 3px;
    font-size:11.5px;letter-spacing:0;line-height:1.28;
  }
  #board.tight .tile::before{left:30%;right:30%;top:5px}
  #board.tight .tile[data-len="7"]{font-size:10px}
  #board.tight .tile[data-len="8"]{font-size:9.5px}
  #board.tight .tile .txt small{font-size:.62em}
  @keyframes tilein{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @keyframes okpop{0%{transform:scale(1)}35%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    15%{transform:translateX(-7px)}
    30%{transform:translateX(6px)}
    45%{transform:translateX(-5px)}
    60%{transform:translateX(4px)}
    75%{transform:translateX(-2px)}
  }
  @keyframes hintpulse{
    0%,100%{box-shadow:0 0 0 0 rgba(78,110,93,0)}
    50%{box-shadow:0 0 0 3px rgba(78,110,93,.45),0 0 18px rgba(78,110,93,.35)}
  }
  .seal-pop{
    position:absolute;z-index:5;pointer-events:none;
    width:42px;height:42px;margin:-21px 0 0 -21px;
    display:grid;place-items:center;
    background:var(--cinnabar);color:#fdf3e2;
    font-size:22px;font-weight:700;
    border-radius:2px;
    box-shadow:0 4px 12px rgba(140,40,26,.4);
    animation:seal .85s ease forwards;
  }
  @keyframes seal{
    0%{opacity:0;transform:scale(1.6) rotate(-8deg)}
    25%{opacity:1;transform:scale(1) rotate(-3deg)}
    70%{opacity:1;transform:translateY(-10px) scale(1) rotate(-3deg)}
    100%{opacity:0;transform:translateY(-42px) scale(.9) rotate(-3deg)}
  }
  .score-pop{
    position:absolute;z-index:5;pointer-events:none;
    font-size:18px;font-weight:600;color:var(--cinnabar);
    text-shadow:0 1px 0 #fff;
    animation:floatup .9s ease forwards;
  }
  @keyframes floatup{
    0%{opacity:0;transform:translate(-50%,-40%)}
    20%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-190%)}
  }

  /* ---------- 侧栏 ---------- */
  #side{display:flex;flex-direction:column;gap:14px;position:sticky;top:78px}
  .card{
    background:linear-gradient(180deg,rgba(255,251,240,.8),rgba(249,241,224,.6));
    border:1px solid var(--line);border-radius:3px;
    padding:14px 16px;
  }
  .card h2{
    font-size:12px;font-weight:600;letter-spacing:.3em;color:var(--ink3);
    margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .card h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .zang{
    display:flex;align-items:center;gap:9px;
    padding:7px 0;border-bottom:1px dashed rgba(150,120,72,.22);
    transition:.2s;
  }
  .zang:last-child{border-bottom:0}
  .zang .dot{
    width:22px;height:22px;flex:none;border-radius:50%;
    display:grid;place-items:center;
    font-size:12px;color:#fdf6e8;background:#b0a084;
    transition:.25s;
  }
  .zang .dot.done{background:var(--cinnabar);box-shadow:0 0 10px rgba(178,55,42,.4)}
  .zang .zn{font-size:14px;letter-spacing:.14em}
  .zang .zn small{display:block;font-size:10px;color:var(--ink3);letter-spacing:.1em;margin-top:1px}
  .zang .zp{margin-left:auto;font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .zang .zp b{color:var(--ink);font-weight:600}
  .zang.flash{background:rgba(178,55,42,.06);border-radius:2px}

  .rule{font-size:12px;line-height:1.85;color:var(--ink2);letter-spacing:.02em}
  .rule b{color:var(--cinnabar);font-weight:600}
  #hintBtn{
    width:100%;margin-top:4px;
    font-family:inherit;font-size:13px;letter-spacing:.22em;
    padding:9px;cursor:pointer;
    background:transparent;color:var(--jade);
    border:1px solid rgba(78,110,93,.45);border-radius:2px;
    transition:.15s;
  }
  #hintBtn:hover:not(:disabled){background:rgba(78,110,93,.08)}
  #hintBtn:disabled{opacity:.4;cursor:default}

  /* ---------- 开始界面（全屏） ---------- */
  #titleScreen{
    position:fixed;inset:0;z-index:40;
    display:flex;flex-wrap:wrap;
    align-items:center;justify-content:center;
    gap:clamp(28px,7vw,120px);
    padding:clamp(24px,5vw,64px);
    overflow:auto;
    background:
      radial-gradient(1100px 700px at 32% 8%, #fdf8ec 0%, rgba(253,248,236,0) 58%),
      radial-gradient(820px 620px at 82% 92%, rgba(186,158,106,.2), transparent 62%),
      radial-gradient(620px 520px at 6% 18%, rgba(96,74,42,.07), transparent 66%),
      radial-gradient(700px 560px at 92% 72%, rgba(96,74,42,.055), transparent 66%),
      radial-gradient(560px 460px at 10% 86%, rgba(78,110,93,.07), transparent 60%),
      repeating-linear-gradient(0deg, rgba(150,120,72,.05) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, rgba(150,120,72,.04) 0 1px, transparent 1px 26px),
      #efe5d0;
  }
  #titleScreen::before{
    content:"";position:absolute;inset:clamp(14px,2.4vw,30px);
    border:1px solid rgba(178,55,42,.22);pointer-events:none;
  }
  #titleScreen.hidden{display:none}
  #titleScreen::after{
    content:"";position:absolute;inset:calc(clamp(14px,2.4vw,30px) + 8px);
    border:1px solid rgba(120,95,55,.13);pointer-events:none;
  }
  .ts-head{display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;z-index:1}
  .ts-seal{
    width:clamp(44px,4.4vw,58px);height:clamp(44px,4.4vw,58px);
    display:grid;place-items:center;
    background:var(--cinnabar);color:#fdf3e2;
    font-size:clamp(22px,2.2vw,29px);font-weight:700;
    border-radius:2px;
    box-shadow:0 10px 26px rgba(140,40,26,.24), inset 0 0 0 1px rgba(255,255,255,.22);
  }
  .ts-title{
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:clamp(58px,10.2vw,124px);
    letter-spacing:.06em;font-weight:600;line-height:.98;
    color:var(--ink);margin:0;
    text-shadow:0 1px 0 rgba(255,255,255,.55);
  }
  .ts-sub{font-size:12.5px;letter-spacing:.46em;color:var(--ink3);margin:0}
  .ts-menu{
    display:flex;flex-direction:column;
    width:clamp(238px,27vw,330px);
    border-top:1px solid rgba(178,55,42,.2);
    position:relative;z-index:1;
  }
  .ts-menu .menu-item{padding:15px 12px}
  .ts-menu .menu-item .num{
    font-size:12px;color:var(--cinnabar);opacity:.5;
    letter-spacing:0;width:20px;flex:none;font-weight:600;
  }
  .ts-menu .menu-item:hover:not(:disabled) .num{opacity:1}
  .ts-foot{
    position:absolute;left:0;right:0;bottom:clamp(26px,4.6vh,48px);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    font-size:11px;letter-spacing:.26em;color:var(--ink3);
    pointer-events:none;
  }
  .ts-five{display:flex;gap:11px}
  .ts-five i{width:9px;height:9px;border-radius:50%;display:block}
  .ts-five i:nth-child(1){background:#4e7d63}
  .ts-five i:nth-child(2){background:#b2372a}
  .ts-five i:nth-child(3){background:#c9a227}
  .ts-five i:nth-child(4){background:#eae2cf;box-shadow:0 0 0 1px rgba(120,95,55,.45)}
  .ts-five i:nth-child(5){background:#2b2620}
  .ts-rule{width:44px;height:1px;background:rgba(178,55,42,.26)}
  .ts-quote{
    position:absolute;top:50%;transform:translateY(-50%);
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:clamp(10px,0.95vw,13px);
    letter-spacing:.34em;line-height:2.1;
    color:rgba(110,88,52,.46);
    pointer-events:none;user-select:none;
  }
  .ts-quote.left{left:clamp(34px,5.2vw,96px)}
  .ts-quote.right{right:clamp(34px,5.2vw,96px);color:rgba(178,55,42,.4)}
  @media (max-width:760px){
    #titleScreen{flex-direction:column;justify-content:flex-start;padding-top:9vh;gap:24px}
    .ts-head{gap:12px}
    .ts-title{font-size:clamp(50px,17vw,82px)}
    .ts-menu{width:min(310px,86vw)}
    .ts-foot{bottom:16px}
    .ts-quote{display:none}
  }

  /* ---------- 作者的话：滚动字幕 ---------- */
  #authorScreen{
    position:fixed;inset:0;z-index:45;overflow:hidden;
    background:
      radial-gradient(1100px 700px at 50% 0%, #fdf8ec 0%, rgba(253,248,236,0) 60%),
      repeating-linear-gradient(0deg, rgba(150,120,72,.05) 0 1px, transparent 1px 26px),
      #efe5d0;
  }
  #authorScreen::before{
    content:"";position:absolute;inset:clamp(14px,2.4vw,30px);
    border:1px solid rgba(178,55,42,.2);pointer-events:none;z-index:3;
  }
  #authorScreen.hidden{display:none}
  .as-viewport{
    position:absolute;inset:0;overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 76%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 76%,transparent 100%);
  }
  .as-track{position:absolute;left:0;right:0;top:0;will-change:transform}
  .as-inner{
    max-width:920px;margin:0 auto;padding:0 26px;
    text-align:center;
    font-family:"LXGW WenKai","Kaiti SC","KaiTi","STKaiti","Songti SC",serif;
  }
  .as-eyebrow{font-size:12px;letter-spacing:.5em;color:var(--cinnabar);margin-bottom:14px}
  .as-inner h1{
    font-size:clamp(42px,6.4vw,70px);
    letter-spacing:.34em;font-weight:400;margin:0 0 38px;color:var(--ink);
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  .as-body p{
    font-size:clamp(18px,2.15vw,24px);
    line-height:2.2;color:var(--ink);margin:0 0 26px;
    text-indent:2em;text-align:left;letter-spacing:.04em;
    text-wrap:pretty;
  }
  .as-sign{
    text-align:right;font-size:clamp(16px,1.9vw,21px);
    color:var(--cinnabar);letter-spacing:.22em;margin:34px 0 0;
  }
  .as-actions{
    position:absolute;left:0;right:0;bottom:0;z-index:4;
    display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
    padding:62px 24px 34px;
    background:linear-gradient(180deg,rgba(239,229,208,0) 0%,rgba(239,229,208,.92) 42%,rgba(239,229,208,.99) 100%);
  }

  /* ---------- 手机版（?mobile=1） ---------- */
  html.m #hud{padding:8px 10px;gap:9px}
  html.m .brand .s{display:none}
  html.m .stats{gap:9px;font-size:11px}
  html.m .clock{font-size:15px}
  html.m #main{padding:12px 10px 26px;gap:14px;min-height:0}
  html.m #board{gap:7px;padding:10px}
  html.m .tile{min-height:70px;padding:10px 4px;font-size:14px;letter-spacing:.03em}
  html.m .tile[data-len="7"]{font-size:12.5px}
  html.m .tile[data-len="8"]{font-size:11.5px}
  html.m #side{flex-direction:column;gap:10px;position:static}
  html.m .card{padding:11px 12px}
  html.m .menu-item{padding:15px 10px;font-size:16.5px}
  html.m #titleScreen{padding-top:6vh;gap:22px;flex-direction:column;justify-content:flex-start}
  html.m .ts-title{font-size:clamp(46px,16vw,74px)}
  html.m .ts-seal{width:46px;height:46px;font-size:23px}
  html.m .ts-menu{width:min(320px,88vw)}
  html.m .panel{padding:20px 16px 18px;max-height:calc(100vh - 24px)}
  html.m .panel h1{font-size:22px}
  html.m .as-inner h1{font-size:38px}
  html.m .as-body p{font-size:16px;line-height:2;margin-bottom:18px}
  html.m .as-actions{padding:40px 14px 22px}
  html.m .as-actions .btn{padding:12px 18px;font-size:14px;letter-spacing:.12em}
  html.m .btn{padding:12px 20px;font-size:14.5px}
  html.m .preview-grid{grid-template-columns:1fr 1fr}
  html.m .recite-grid{grid-template-columns:1fr 1fr}
  html.m .setting-row{flex-wrap:wrap;gap:10px}
  html.m .setting-row .btn{margin-left:0}
  html.m #titleScreen .ts-quote{display:none}

  /* ---------- 遮罩 ---------- */
  #overlay{
    position:fixed;inset:0;z-index:50;
    display:grid;place-items:center;
    padding:24px;
    background:rgba(240,232,214,.82);
    backdrop-filter:blur(3px);
    animation:fade .28s ease;
  }
  #overlay.hidden{display:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .panel{
    width:min(760px,100%);
    max-height:calc(100vh - 48px);
    overflow:auto;
    background:linear-gradient(180deg,#fdf8ec,#f7eed9);
    border:1px solid #c9b68c;
    border-radius:3px;
    box-shadow:0 24px 70px rgba(84,62,30,.28), 0 1px 0 #fff inset;
    padding:30px 34px 26px;
    animation:rise .32s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .panel .eyebrow{font-size:11px;letter-spacing:.4em;color:var(--cinnabar);margin-bottom:8px}
  .panel h1{font-size:26px;letter-spacing:.3em;font-weight:600;margin-bottom:6px}
  .panel .sub{font-size:13px;color:var(--ink3);letter-spacing:.1em;line-height:1.8;margin-bottom:18px}
  .panel p{font-size:13.5px;line-height:2;color:var(--ink2)}
  .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
  .btn{
    font-family:inherit;font-size:15px;letter-spacing:.26em;
    padding:11px 26px 11px 30px;
    background:var(--cinnabar);color:#fdf4e4;
    border:1px solid #95261a;border-radius:2px;cursor:pointer;
    box-shadow:0 2px 0 rgba(120,40,28,.3);
    transition:.16s;
  }
  .btn:hover{background:#c24532;transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--cinnabar);border-color:rgba(178,55,42,.5);box-shadow:none}
  .btn.ghost:hover{background:rgba(178,55,42,.07)}
  .btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
  .btn.hell{
    background:linear-gradient(180deg,#8a2418,#6a180e);
    border-color:#561108;
    color:#f7dfb8;
    letter-spacing:.34em;
    box-shadow:0 2px 0 rgba(60,14,8,.45), 0 0 22px rgba(140,36,24,.18);
  }
  .btn.hell:hover{background:linear-gradient(180deg,#a12c1e,#7c1d10);transform:translateY(-1px)}

  .preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin:16px 0 4px}
  .pv{
    border:1px solid rgba(150,120,72,.3);border-radius:2px;
    background:rgba(255,252,244,.6);
    padding:10px 12px;
  }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function sample(arr,n){
  const pool = arr.slice(); const out=[];
  while(out.length<n && pool.length){ out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
  return out;
}
function fmtTime(sec){
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m>0 ? `${m}:${String(s).padStart(2,'0')}` : `${s}s`;
}
function fmtClock(sec){

    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  beep(freq, dur, type='sine', gain=0.06, when=0){
    if(!this.on) return;
    const ctx = this.ensure(); if(!ctx) return;
    const t = ctx.currentTime + when;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain * volume, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+dur+0.02);
  },
  tap(){ this.beep(760, .05, 'triangle', .035); },
  ui(){ this.beep(1040, .035, 'triangle', .026); this.beep(1560, .045, 'sine', .012, .009); },

    this.master.gain.setValueAtTime(0.0001, t);
    this.master.gain.exponentialRampToValueAtTime(Math.max(0.0002, 0.95 * volume), t + 1.6);
    this.timer = setInterval(()=>this.tick(), 45);
  },

  tick(){
    if(!this.on || !this.ctx || !this.cfg) return;
    const spb = 60 / this.cfg.bpm;
    while(this.nextTime < this.ctx.currentTime + 0.3){
      const beat = this.cfg.bars[this.step % this.cfg.bars.length];
      for(const n of beat) this.note(n[0], this.nextTime, n[1] * spb, n[2], n[3]);
      this.nextTime += spb;
      this.step++;
    }
  },

  note(name, t, dur, type, gain){
    const f = NOTE_FREQ[name];
    if(!f) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'triangle';
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(this.master);
    if(this.delay) g.connect(this.delay);
    o.start(t); o.stop(t + dur + 0.1);
  },

  setVolume(){
    if(!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setTargetAtTime(Math.max(0.0001, 0.95 * volume), t, 0.15);
  },

  stop(quick){
    this.on = false;
    if(this.timer){ clearInterval(this.timer); this.timer = null; }
    if(!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setValueAtTime(Math.max(0.0001, this.master.gain.value), t);
    this.master.gain.exponentialRampToValueAtTime(0.0001, t + (quick ? 0.12 : 1.1));
  }
};

/* ================= 背景音乐（B 站曲目，本地 m4a） ================= */
const AUDIO = {
  els: {}, cur: null,
  rate(){ return Math.min(1, volume * 0.5); },
  pack(url){
    if(!this.els[url]){
      const a = new Audio(url);
      a.preload = 'auto';
      a.volume = this.rate();
      a.addEventListener('timeupdate', ()=>{
        if(a.currentTime > 115){ try{ a.currentTime = 0.2; }catch(e){} }
      });
      this.els[url] = a;
    }
    return this.els[url];
  },
  play(name){
    const url = name === 'author' ? 'bgm/author.m4a' : 'bgm/bgm.m4a';
    Object.keys(this.els).forEach(u=>{ if(u !== url) this.els[u].pause(); });
    const a = this.pack(url);
    this.cur = a;
    a.volume = this.rate();
    const p = a.play();
    if(p && p.catch) p.catch(()=>{});
  },
  stop(){ Object.keys(this.els).forEach(u=>this.els[u].pause()); },
  setVolume(){ Object.keys(this.els).forEach(u=>{ this.els[u].volume = this.rate(); }); }
};

/* ================= 关卡准备 ================= */
function configFor(mode, idx){
  if(mode === 'hell') return HELL;
  if(mode === 'zen') return ZEN;
  return LEVELS[idx];
}

function prepare(cfg){
  S.cfg = cfg;
  S.zangs = cfg.zangs;
  S.byZang = {};
  S.cleared = {};
  cfg.zangs.forEach(k=>{
    if(cfg.all)          S.byZang[k] = ZANG[k].terms.slice();
    else if(cfg.random)  S.byZang[k] = sample(ZANG[k].terms, cfg.take[k]);
    else                 S.byZang[k] = takeTerms(S.levelIdx, k);
    S.cleared[k] = 0;
  });
  const arr = [];
  cfg.zangs.forEach(k=> S.byZang[k].forEach(term => arr.push({ term, zang:k, gone:false, el:null })));
  S.tiles = shuffle(arr);
  S.total = S.tiles.length / 2;
  S.done = 0; S.score = 0; S.combo = 0; S.maxCombo = 0; S.miss = 0;
  S.first = -1; S.locked = true; S.running = false;
  S.hints = cfg.hell ? 5 : 3;
  S.time = cfg.time; S.timeMax = cfg.time; S.elapsed = 0;
}

function renderBoard(){
  const narrow = window.innerWidth < 620 || document.documentElement.classList.contains('m');
  const cols = narrow ? Math.min(S.cfg.cols, 4) : S.cfg.cols;
  boardEl.style.setProperty('--cols', cols);
  boardEl.classList.toggle('tight', !!S.cfg.hell);
  boardEl.innerHTML = '';
  S.tiles.forEach((t,i)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tile';
    b.dataset.i = i;
    b.dataset.zang = t.zang;
    const note = t.term.match(/^(.+?)（(.+)）$/);
    b.dataset.len = note
      ? note[1].length + Math.round(note[2].length * 0.66)
      : t.term.length;
    b.innerHTML = note
      ? `<span class="txt">${note[1]}<small>（${note[2]}）</small></span>`
      : `<span class="txt">${t.term}</span>`;
    b.style.animationDelay = Math.min(i * 14, 420) + 'ms';
    boardEl.appendChild(b);
    t.el = b;
  });
}

function renderZangList(){
  zangList.innerHTML = '';

/* ================= HUD ================= */
function updateHUD(){
  hudLevelWrap.innerHTML = S.mode === 'hell' ? '<b>终局</b>'
    : S.mode === 'zen' ? '<b>禅</b>修'
    : `第<b>${S.levelIdx+1}</b>关`;
  hudProg.textContent = `${S.done}/${S.total}`;
  hudScore.textContent = S.score;
  hudCombo.textContent = S.combo >= 2 ? `连击 ×${S.combo}` : '连击 —';
  hudCombo.classList.toggle('hot', S.combo >= 3);
  updateClock();
}
function updateClock(){
  if(S.mode === 'zen'){ hudClock.textContent = '∞'; hudClock.classList.remove('warn'); return; }
  if(S.mode === 'hell'){ hudClock.textContent = fmtClock(S.elapsed); hudClock.classList.remove('warn'); return; }
  hudClock.textContent = fmtTime(S.time);
  hudClock.classList.toggle('warn', S.time <= 15);
}
function updateZangCard(k){
  const row = zangList.querySelector(`.zang[data-zang="${k}"]`);
  if(!row) return;
  const n = S.cleared[k];
  row.querySelector('.zp b').textContent = n;
  const dot = row.querySelector('.dot');
  if(n >= S.byZang[k].length / 2) dot.classList.add('done');
  row.classList.add('flash');
  setTimeout(()=>row.classList.remove('flash'), 420);
}

/* ================= 计时 ================= */
function startTimer(){
  stopTimer();
  if(S.mode === 'zen') return;
  S.timerId = setInterval(()=>{
    if(!S.running) return;
    if(S.mode === 'hell'){ S.elapsed += 0.1; updateClock(); return; }
    S.time = Math.max(0, S.time - 0.1);
    updateClock();
    if(S.time <= 0){ endGame(false); }
  }, 100);
}
function stopTimer(){ if(S.timerId){ clearInterval(S.timerId); S.timerId = null; } }

/* ================= 点击 ================= */
boardEl.addEventListener('click', e=>{
  const b = e.target.closest('.tile');
  if(!b) return;
  const i = Number(b.dataset.i);
  tap(i);
});

function tap(i){
  if(!S.running || S.locked) return;
  const t = S.tiles[i];
  if(!t || t.gone) return;

  if(S.first === i){
    t.el.classList.remove('sel');
    S.first = -1;
    SFX.tap();
    return;
  }
  if(S.first === -1){
    S.first = i;
    t.el.classList.add('sel');
    SFX.tap();
    return;
  }
  const a = S.tiles[S.first];
  const ai = S.first;
  S.first = -1;
  if(a.zang === t.zang) resolve(ai, i);
  else reject(ai, i);
}

function resolve(i,j){
  S.locked = true;
  const a = S.tiles[i], b = S.tiles[j];
  a.gone = b.gone = true;

  S.combo++;
  S.maxCombo = Math.max(S.maxCombo, S.combo);
  const gain = 100 * Math.min(S.combo, 5);
  S.score += gain;
  S.done++;
  S.cleared[a.zang]++;

  const ae = a.el, be = b.el;
  ae.classList.remove('sel'); be.classList.remove('sel');
  ae.classList.add('ok'); be.classList.add('ok');
  sealAt(ae, ZANG[a.zang].name);
  floatScore(ae, '+'+gain);
  SFX.good(S.combo);

  updateHUD();
  updateZangCard(a.zang);

  setTimeout(()=>{
    ae.classList.add('gone'); be.classList.add('gone');
    ae.disabled = true; be.disabled = true;
  }, 380);
  setTimeout(()=>{
    S.locked = false;
    if(S.done >= S.total) endGame(true);
  }, 470);
}

function reject(i,j){
  S.locked = true;
  const a = S.tiles[i], b = S.tiles[j];
  a.el.classList.remove('sel'); b.el.classList.remove('sel');
  a.el.classList.add('bad'); b.el.classList.add('bad');
  S.combo = 0;
  S.miss++;
  if(S.mode !== 'zen' && S.mode !== 'hell') S.time = Math.max(0, S.time - 5);
  SFX.bad();
  updateHUD();
  setTimeout(()=>{
    a.el.classList.remove('bad'); b.el.classList.remove('bad');
    S.locked = false;
    if(S.mode === 'level' && S.time <= 0) endGame(false);
  }, 430);
}

function sealAt(tileEl, name){

  d.className = 'seal-pop';

  d.style.top  = (r.top  - br.top  + r.height/2) + 'px';

  setTimeout(()=>d.remove(), 900);
}
function floatScore(tileEl, text){

  const br = boardEl.getBoundingClientRect();

  d.style.top  = (r.top  - br.top  + 6) + 'px';

  setTimeout(()=>d.remove(), 950);
}

/* ================= 提示 ================= */
hintBtn.addEventListener('click', ()=>{
  if(!S.running || S.hints <= 0 || S.locked) return;
  const groups = {};
  S.tiles.forEach((t,i)=>{ if(!t.gone){ (groups[t.zang] = groups[t.zang] || []).push(i); } });
  const pair = Object.values(groups).find(g=>g.length>=2);
  if(!pair) return;
  const [i,j] = shuffle(pair.slice()).slice(0,2);
  S.hints--;
  hintBtn.textContent = S.hints > 0 ? `提示 ×${S.hints}` : '提示已用完';
  if(S.hints <= 0) hintBtn.disabled = true;
  [i,j].forEach(k=>{
    const el = S.tiles[k].el;
    el.classList.add('hint');
    setTimeout(()=>el.classList.remove('hint'), 1900);
  });
});

/* ================= 结束 ================= */
function endGame(win){
  if(!S.running) return;
  S.running = false;
  S.locked = true;
  stopTimer();

  if(!win){
    SFX.fail();
    showResult(false);
    return;
  }

  SFX.win();

  if(S.mode === 'hell'){
    const prev = Number(localStorage.getItem('zx.hellBest') || 0);
    const isRecord = !prev || S.elapsed < prev;
    if(isRecord) localStorage.setItem('zx.hellBest', String(S.elapsed));
    showHellResult(isRecord);
    return;
  }

  if(S.mode === 'level'){
    S.score += Math.round(S.time) * 5;
    saveBest();
    if(S.levelIdx >= LEVELS.length - 1){
      clearSave();
      unlockHell();
      showAuthor();
    } else {
      writeSave(S.levelIdx + 1, S.score);
      showResult(true);
    }
    return;
  }

  showResult(true);   // zen
}

function saveBest(){
  if(S.mode === 'hell') return;
  try{
    const key = 'zx.best';
    const prev = JSON.parse(localStorage.getItem(key) || '{}');
    const best = Math.max(prev.best || 0, S.score);
    const lv = Math.max(prev.level || 0, S.mode === 'level' ? S.levelIdx : 0);
    localStorage.setItem(key, JSON.stringify({ best, level: lv }));
  }catch(e){}
}

  }).join('');
}

    <div class="ts-quote left">《素问·五脏别论》<br>五脏者，所以藏<br>精神血气魂魄者也</div>
    <div class="ts-quote right">藏象何如？</div>
    <div class="ts-head">
      <div class="ts-seal">藏</div>
      <h1 class="ts-title">藏象</h1>
      <p class="ts-sub">同脏 · 相消</p>
    </div>
    <nav class="ts-menu">
      <button class="menu-item" data-act="play"><span class="num">壹</span>闯关模式</button>
      <button class="menu-item" data-act="continue" ${save ? '' : 'disabled'}><span class="num">贰</span>继续游戏<small>${save ? `第 ${save.level + 1} 关` : '还没有存档'}</small></button>
      <button class="menu-item" data-act="hell" ${unlocked ? '' : 'disabled'}><span class="num">叁</span>屌炸天模式<small>${unlocked ? (hellBest ? '最好 ' + fmtClock(hellBest) : '九十个词，一次全清') : '通关基础四关后解锁'}</small></button>
      <button class="menu-item" data-act="recite"><span class="num">肆</span>背诵模式<small>九十个词</small></button>
      <button class="menu-item" data-act="settings"><span class="num">伍</span>设置</button>
      <button class="menu-item" data-act="exit"><span class="num">陆</span>退出游戏</button>
    </nav>
    <div class="ts-foot">
      <div class="ts-five"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="ts-rule"></div>
      <span>${best.best ? '最高分 ' + best.best : '四关 · 九十个词'} · 林希夏</span>
    </div>
  `;
  titleScreen.classList.remove('hidden');
  titleScreen.querySelectorAll('.menu-item').forEach(btn=>{
    btn.onclick = ()=>{
      const act = btn.dataset.act;
      if(act === 'play') startLevel(0, 'level');
      else if(act === 'continue'){ const s = loadSave(); if(s) startLevel(s.level, 'level'); }
      else if(act === 'hell') startLevel(0, 'hell');
      else if(act === 'recite') showRecite();
      else if(act === 'settings') showSettings();
      else if(act === 'exit') showExit();
    };
  });
}

let loadToken = 0;
function showLoading(done){
  authorScreen.classList.add('hidden');
  titleScreen.classList.add('hidden');
  AUDIO.stop();
  AUDIO.play('menu');
  const token = ++loadToken;
  overlay.classList.remove('hidden');
  panel.dataset.state = 'loading';
  panel.innerHTML = `
    <div class="loading">
      <div class="seal-loader">藏</div>
      <div class="loading-bar"><i></i></div>
      <p class="tip">${pickTip()}</p>
    </div>
  `;
  setTimeout(()=>{ if(token === loadToken) done(); }, 1850);
}

function showRecite(){
  authorScreen.classList.add('hidden');
  titleScreen.classList.add('hidden');
  AUDIO.stop();
  const cards = Object.keys(ZANG).map(k=>{
    const items = ZANG[k].terms.map(t => `<li>${t}</li>`).join('');
    return `<div class="r"><h3>${ZANG[k].name}<small>${ZANG[k].hint}</small></h3><ul>${items}</ul></div>`;
  }).join('');
  panel.classList.add('wide');
  panel.innerHTML = `
    <div class="eyebrow">RECITE</div>
    <h1>背诵</h1>
    <p class="sub">九十个词，按脏腑平铺。看一眼，再回去闯。</p>
    <div class="recite-grid">${cards}</div>
    <div class="btns">
      <button class="btn ghost" id="backTitle">返回</button>
    </div>
  `;
  overlay.classList.remove('hidden');
  panel.dataset.state = 'recite';
  $('backTitle').onclick = ()=> showTitle();
}

function showSettings(){
  authorScreen.classList.add('hidden');
  titleScreen.classList.add('hidden');
  AUDIO.stop();
  const unlocked = isHellUnlocked();
  const save = loadSave();
  panel.classList.remove('wide');
  panel.innerHTML = `
    <div class="eyebrow">SETTINGS</div>
    <h1>设置</h1>
    <div class="setting-row">
      <div><b>音量</b><small>音效与背景音乐</small></div>
      <input type="range" id="volRange" min="0" max="100" step="1" value="${Math.round(volume * 100)}">
      <span class="vol-val" id="volVal">${Math.round(volume * 100)}</span>
    </div>
    <div class="setting-row">
      <div><b>清空存档</b><small>${save ? `现在存档在第 ${save.level + 1} 关` : '现在没有存档'}</small></div>
      <button class="btn ghost" id="clearBtn" ${save ? '' : 'disabled'}>清空</button>
    </div>
    <div class="setting-row">
      <div><b>解锁屌炸天</b><small>${unlocked ? '已解锁' : '正常玩法：通关基础四关后自动解锁'}</small></div>
      <button class="btn ghost" id="unlockBtn" ${unlocked ? 'disabled' : ''}>${unlocked ? '已解锁' : '解锁'}</button>
    </div>
    <div class="btns">
      <button class="btn ghost" id="backTitle">返回</button>
    </div>
  `;
  overlay.classList.remove('hidden');
  panel.dataset.state = 'settings';
  $('backTitle').onclick = ()=> showTitle();
  const vr = $('volRange');
  if(vr){
    vr.oninput = ()=>{
      volume = Math.max(0, Math.min(1, Number(vr.value) / 100));
      try{ localStorage.setItem('zx.vol', String(volume)); }catch(e){}
      AUDIO.setVolume();
      const vv = $('volVal'); if(vv) vv.textContent = vr.value;
    };
  }
  const clearBtn = $('clearBtn');
  if(clearBtn) clearBtn.onclick = ()=>{
    if(!confirm('清空存档？关卡进度会回到第一关。')) return;
    clearSave();
    showSettings();
  };
  const unlockBtn = $('unlockBtn');
  if(unlockBtn && !unlocked) unlockBtn.onclick = ()=>{ unlockHell(); showSettings(); };
}

function showExit(){
  authorScreen.classList.add('hidden');
  titleScreen.classList.add('hidden');
  AUDIO.stop();
  panel.classList.remove('wide');
  panel.innerHTML = `
    <div class="bye">
      <h1>再 见</h1>
      <p class="sub">记得回来认这几个词。</p>
      <div class="btns" style="justify-content:center">
        <button class="btn ghost" id="backTitle">回到标题</button>
      </div>
    </div>
  `;
  overlay.classList.remove('hidden');
  panel.dataset.state = 'exit';
  $('backTitle').onclick = ()=> showTitle();
}

function startLevel(idx, mode){
  panel.classList.remove('wide');
  S.mode = mode || 'level';
  S.levelIdx = Math.max(0, idx|0);
  prepare(configFor(S.mode, S.levelIdx));
  if(location.search.includes('selftest')){ showPreview(); return; }
  showLoading(()=> showPreview());
}

/* ================= 杂项 ================= */
$('btnRestart').addEventListener('click', ()=>{
  if(!S.cfg) return;
  if(S.running && !confirm('重新开始本关？计时会重新算。')) return;
  startLevel(S.levelIdx, S.mode);
});

$('btnQuit').addEventListener('click', ()=>{
  if(S.running || S.done > 0){ if(!confirm('回首页？本关进度不保留。')) return; }
  showTitle();
});

/* 按键音：所有按钮与菜单项 */
document.addEventListener('pointerdown', (e)=>{
  const el = e.target.closest('.btn, .menu-item');
  if(el && !el.disabled) SFX.ui();
});
/* 作者的话字体：页面加载后异步拉一份，不挡首屏 */
window.addEventListener('load', ()=> setTimeout(ensureAuthorFont, 700));

window.addEventListener('resize', ()=>{
  if(!S.running) return;
  const narrow = window.innerWidth < 620 || document.documentElement.classList.contains('m');
  const cols = narrow ? Math.min(S.cfg.cols, 4) : S.cfg.cols;
  boardEl.style.setProperty('--cols', cols);
});

// 调试/截图用：?stage=2 直接进第 2 关
(function boot(){
  const q = new URLSearchParams(location.search);
  const sc = q.get('screen');
  if(sc === 'title'){ showTitle(); return; }
  if(sc === 'loading'){ showLoading(()=>{}); return; }
  if(sc === 'author'){ window.__authorStill = 1; showAuthor(); return; }
  if(sc === 'recite'){ showRecite(); return; }
  if(sc === 'settings'){ showSettings(); return; }
  if(sc === 'exit'){ showExit(); return; }
  if(sc === 'hellresult'){
    S.mode = 'hell'; S.elapsed = 487; S.miss = 3; S.maxCombo = 9; S.done = 45; S.total = 45;
    showHellResult(true); return;
  }
  if(q.get('selftest')){ setTimeout(runSelfTest, 60); return; }
  if(q.get('preview')){
    S.mode = 'level'; S.levelIdx = 0;
    prepare(LEVELS[0]);
    showPreview();
    return;
  }
  if(q.get('hell')){
    S.mode = 'hell'; S.levelIdx = 0;
    prepare(HELL);
    renderBoard(); renderZangList(); updateHUD();
    S.locked = true; S.running = false;
    overlay.classList.add('hidden');
    return;
  }
  if(q.get('result')){
    S.mode = 'level'; S.levelIdx = 0;
    prepare(LEVELS[0]);
    showPreview();
    document.querySelector('#goBtn').click();
    [0,1,2,3,4,5].forEach(i=>{ if(S.tiles[i]) S.tiles[i].gone = true; });
    S.score = 640; S.maxCombo = 4; S.done = 3; S.cleared[S.tiles[0].zang] = 2; S.time = 62;
    document.querySelectorAll('.tile').forEach((el,i)=>{ if(S.tiles[i].gone) el.classList.add('gone'); });
    endGame(true);
    return;
  }
  const st = q.get('stage');
  if(st){
    const n = Math.max(0, Math.min(LEVELS.length-1, parseInt(st,10)||0));
    S.mode = 'level'; S.levelIdx = n;
    prepare(configFor('level', n));
    renderBoard(); renderZangList(); updateHUD();
    S.locked = true; S.running = false;
    overlay.classList.add('hidden');
    return;
  }
  showTitle();
})();

/* ================= 页内自测（?selftest=1） ================= */
async function runSelfTest(){
  const log = [];
  const wait = ms => new Promise(r=>setTimeout(r,ms));
  const clickEl = el => el.dispatchEvent(new MouseEvent('click', { bubbles:true }));

  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#f7f0df;padding:34px 44px;font:15px/1.9 ui-monospace,Consolas,monospace;white-space:pre-wrap;color:#2b2620;overflow:auto';
  document.body.appendChild(box);
  const render = (status) => {
    const fails = log.filter(l => l.startsWith('FAIL') || l.startsWith('EXCEPTION')).length;
    box.textContent = 'SELFTEST  ' + status + (fails ? '  (' + fails + ' FAILED)' : '') + '\n' + '-'.repeat(56) + '\n' + log.join('\n');
  };
  const ok = (name, cond, extra='') => {
    log.push((cond?'PASS':'FAIL') + '  ' + name + (extra?'   ['+extra+']':''));
    render('RUNNING');
  };

  try{
    // 1. 开局与预习
    startLevel(0, 'level');
    ok('预习列出 5 个脏腑', document.querySelectorAll('.pv').length === 5, 'pv=' + document.querySelectorAll('.pv').length);
    document.querySelector('#goBtn').click();

    const tiles = [...document.querySelectorAll('.tile')];
    ok('第 1 关 10 块', tiles.length === 10, 'n=' + tiles.length);
    ok('进入棋盘后标题屏隐藏', titleScreen.classList.contains('hidden'));
    const by = {};
    tiles.forEach(t => (by[t.dataset.zang] = by[t.dataset.zang] || []).push(t));
    ok('每脏 2 块（偶数）', Object.values(by).every(a => a.length === 2), Object.entries(by).map(([k,a])=>k+':'+a.length).join(' '));
    ok('计时已启动', S.running === true && S.time > 0, 'time=' + S.time.toFixed(1));

    // 2. 真实点击一配对
    const z1 = Object.keys(by)[0];
    const [t1, t2] = by[z1];
    clickEl(t1);
    ok('点击后选中', t1.classList.contains('sel') && S.first === +t1.dataset.i);
    clickEl(t2);
    ok('同脏消除', S.done === 1 && S.score === 100 && S.cleared[z1] === 1,
       `done=${S.done} score=${S.score} cleared=${S.cleared[z1]}`);
    ok('连击计数', S.combo === 1);

    // 3. 错配：扣时间 + 断连击
    S.locked = false;
    const left = S.tiles.filter(t => !t.gone);
    const a0 = left[0];
    const b0 = left.find(t => t.zang !== a0.zang);
    const t0 = S.time;
    clickEl(a0.el); clickEl(b0.el);
    ok('错配扣 5 秒', S.time <= t0 - 4.8 && S.time >= t0 - 5.2, `${t0.toFixed(1)} -> ${S.time.toFixed(1)}`);
    ok('错配断连击', S.combo === 0);
    ok('错点计数', S.miss === 1, 'miss=' + S.miss);

    // 4. 清空棋盘（走真实点击路径）
    S.locked = false;
    for(let g = 0; g < 40; g++){
      const rest = S.tiles.filter(t => !t.gone);
      if(!rest.length) break;
      const z = rest[0].zang;
      const same = rest.filter(t => t.zang === z);
      if(same.length < 2){ ok('残留无法配对', false, 'zang=' + z); break; }
      S.locked = false;
      clickEl(same[0].el);
      clickEl(same[1].el);
      S.locked = false;
    }
    ok('全部消完', S.done === S.total, `done=${S.done}/${S.total}`);

    // 5. 等结算弹出（轮询而非死等）
    for(let i = 0; i < 50 && panel.dataset.state !== 'result'; i++) await wait(40);
    ok('自动弹出结算', panel.dataset.state === 'result', 'h1=' + (document.querySelector('#panel h1')?.textContent || ''));
    const review = document.querySelectorAll('.review .r').length;
    ok('结算列出脏腑复习', review === 5, 'cards=' + review);

    // 6. 下一关
    const nextBtn = document.querySelector('#nextBtn');
    ok('有下一关按钮', !!nextBtn);
    if(nextBtn){ nextBtn.click(); }
    ok('进入第 2 关预习', (document.querySelector('#panel h1')?.textContent || '').includes('第 2 关'));

    // 7. 最终布局检查
    document.querySelector('#goBtn').click();
    const r = document.querySelector('#board').getBoundingClientRect();
    ok('新棋盘已渲染', r.height > 100, 'h=' + Math.round(r.height));
    ok('第 2 关 20 块', document.querySelectorAll('.tile').length === 20, 'n=' + document.querySelectorAll('.tile').length);
    ok('第 2 关计时 130s', Math.abs(S.time - 130) < 0.3, 'time=' + S.time.toFixed(1));
    // 8. 菜单与各页面
    showTitle();
    ok('标题页 6 个菜单项', document.querySelectorAll('.menu-item').length === 6, 'n=' + document.querySelectorAll('.menu-item').length);
    ok('标题屏铺满', !titleScreen.classList.contains('hidden') && titleScreen.offsetHeight > 400);
    showAuthor();
    ok('作者的话有「星辰大海」', (document.querySelector('#toTitle')?.textContent || '').includes('星辰大海'));
    ok('作者的话有「去闯屌炸天」', (document.querySelector('#toHell')?.textContent || '').includes('屌炸天'));
    showRecite();
    ok('背诵平铺 90 个词', document.querySelectorAll('.recite-grid li').length === 90, 'n=' + document.querySelectorAll('.recite-grid li').length);
    showSettings();
    ok('设置有「清空存档」', !!document.querySelector('#clearBtn'));
    ok('设置有「解锁屌炸天」', !!document.querySelector('#unlockBtn'));
    showTitle();
    ok('能回到标题页', !titleScreen.classList.contains('hidden') && overlay.classList.contains('hidden'));
    ok('无 JS 异常', true);
  }catch(e){
    log.push('EXCEPTION  ' + (e && e.stack || e));
  }
  render('DONE');
}
</script>
