  <title>阴阳 · 黑白粒子 1.12</title>
  <style>
﻿/* ---------------------------------------------------------------
   黑白粒子 · 场景
   舞台用中性灰，让黑色和白色粒子都能被看清
--------------------------------------------------------------- */

:root {
  --ink: #17171d;
  --panel: rgba(255, 255, 255, 0.16);
  --panel-line: rgba(255, 255, 255, 0.38);
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  overscroll-behavior: none;
}

body {
  margin: 0;
  overflow: hidden;
  color: var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  background:
    radial-gradient(circle at 30% 26%, #bcbcc5 0%, #9b9ba6 42%, #6d6d78 100%);
}

#stage {
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}

/* ------------------------------ HUD ------------------------------ */

.hud {
  position: fixed;
  top: calc(22px + env(safe-area-inset-top, 0px));
  left: calc(22px + env(safe-area-inset-left, 0px));
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 16px;
  border-radius: 14px;
  border: 1px solid var(--panel-line);
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(20, 20, 32, 0.14);
  user-select: none;
  pointer-events: none;
}

.hud__item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  letter-spacing: 0.04em;
}

.hud__item .label {
  opacity: 0.72;
}

.hud__item .value {
  min-width: 2.2ch;
  font-size: 17px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex: none;
}

.hud__item--black .dot {
  background: linear-gradient(145deg, #4a4a56, #08080c 55%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
}

.hud__item--white .dot {
  background: linear-gradient(145deg, #ffffff, #d3d3de 80%);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.16);
}

.hud__meta {
  padding-left: 16px;
  border-left: 1px solid rgba(23, 23, 29, 0.16);
  font-size: 12px;
  letter-spacing: 0.06em;
  white-space: nowrap;
}

.hud__meta #total-count {
  opacity: 0.55;
}

.hud__meta .sep {
  margin: 0 6px;
  opacity: 0.5;
}

/* 阴阳状态：平衡时用一点暖金色点亮 */
#balance {
  font-weight: 600;
  letter-spacing: 0.1em;
  color: #4a4a55;
  transition: color 0.7s ease;
}

#balance.is-balanced {
  color: #8a6410;
}

#balance.is-over {
  color: #8a3a2c;
}

#balance.is-separated {
  color: #b04a3a;
  letter-spacing: 0.14em;
}

#balance.is-deficiency {
  color: #5b4a70;
  letter-spacing: 0.08em;
}

/* ---------------------- 阴阳离决 ---------------------- */

.ending {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(circle at 50% 42%, rgba(10, 10, 16, 0.5), rgba(10, 10, 16, 0.84));
  -webkit-backdrop-filter: blur(7px);
  backdrop-filter: blur(7px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.9s ease, visibility 0s linear 0.9s;
}

.ending.is-visible {
  opacity: 1;
  visibility: visible;
  transition: opacity 0.9s ease;
}

.ending__card {
  width: min(420px, 100%);
  padding: 40px 36px 34px;
  text-align: center;
  border-radius: 22px;
  border: 1px solid rgba(233, 197, 106, 0.26);
  background: rgba(22, 22, 30, 0.74);
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
  transform: translateY(10px);
  transition: transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.ending.is-visible .ending__card {
  transform: translateY(0);
}

.ending__mark {
  font-size: 26px;
  line-height: 1;
  color: #e9c56a;
  opacity: 0.55;
}

.ending__title {
  margin: 14px 0 8px;
  font-family: "Songti SC", "Noto Serif SC", "STSong", "SimSun", serif;
  font-size: 44px;
  font-weight: 600;
  letter-spacing: 0.3em;
  text-indent: 0.3em;
  color: #e9c56a;
}

.ending__counts {
  margin: 0 0 18px;
  font-size: 11px;
  letter-spacing: 0.22em;
  color: rgba(240, 233, 218, 0.45);
  font-variant-numeric: tabular-nums;
}

.ending__text {
  margin: 0 0 30px;
  font-size: 13px;
  line-height: 1.95;
  letter-spacing: 0.06em;
  color: rgba(243, 239, 230, 0.66);
}

.ending__btn {
  appearance: none;
  padding: 11px 32px;
  border-radius: 999px;
  border: 1px solid rgba(233, 197, 106, 0.5);
  background: rgba(233, 197, 106, 0.08);
  color: #f0d493;
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 0.26em;
  text-indent: 0.26em;
  cursor: pointer;
  transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
}

.ending__btn:hover,
.ending__btn:focus-visible {
  background: rgba(233, 197, 106, 0.18);
  border-color: rgba(233, 197, 106, 0.9);
  transform: translateY(-1px);
  outline: none;
}

/* ---------------------- 证候词条 ---------------------- */

.states {
  position: fixed;
  top: calc(22px + env(safe-area-inset-top, 0px));
  right: calc(22px + env(safe-area-inset-right, 0px));
  z-index: 7;
  display: flex;
  align-items: stretch;
  gap: 12px;
  max-width: min(380px, calc(100vw - 44px));
  padding: 11px 14px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.38);
  background: rgba(255, 255, 255, 0.16);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(20, 20, 32, 0.14);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px);
  transition: opacity 0.35s ease, transform 0.35s ease, visibility 0s linear 0.35s;
  pointer-events: none;
  user-select: none;
}

.states.is-visible {
  opacity: 1;
  visibility: visible;
  transform: none;
  transition: opacity 0.35s ease, transform 0.35s ease;
}

.states__group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.states__head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: #34343e;
  opacity: 0.7;
}

.states__dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.states__group--yin .states__dot {
  background: #13131a;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
}

.states__group--yang .states__dot {
  background: #fbfbfe;
  box-shadow: inset 0 0 0 1px rgba(19, 19, 26, 0.35);
}

.states__list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-width: 150px;
}

.states__empty {
  font-size: 12px;
  line-height: 1;
  color: rgba(28, 28, 38, 0.32);
}

.states__divider {
  width: 1px;
  margin: 2px 0;
  background: rgba(23, 23, 29, 0.14);
}

.tag {
  position: relative;
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.55);
  background: rgba(255, 255, 255, 0.34);
  color: #1c1c24;
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.1em;
  cursor: help;
  outline: none;
  animation: tag-in 0.3s ease both;
  transition: background 0.25s ease, transform 0.25s ease;
}

.tag:hover,
.tag:focus-visible {
  background: rgba(255, 255, 255, 0.55);
  transform: translateY(-1px);
}

.tag__tip {
  position: absolute;
  top: calc(100% + 8px);
  right: -6px;
  width: max-content;
  max-width: 210px;
  padding: 9px 12px;
  border-radius: 10px;
  background: rgba(26, 26, 34, 0.93);
  color: #f1f1f4;
  font-size: 12px;
  line-height: 1.7;
  letter-spacing: 0.02em;
  text-align: left;
  white-space: normal;
  opacity: 0;
  transform: translateY(-5px);
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  box-shadow: 0 14px 36px rgba(8, 8, 16, 0.3);
  z-index: 8;
}

.tag:hover .tag__tip,
.tag:focus .tag__tip {
  opacity: 1;
  transform: translateY(0);
}

@keyframes tag-in {
  from {
    opacity: 0;
    transform: translateY(-4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ---------------------- 底部：阴阳关系 ---------------------- */

.laws {
  position: fixed;
  left: 50%;
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 9px;
  width: fit-content;
  max-width: calc(100vw - 18px);
  z-index: 6;
}

/* 人体词条：只有开了「人体」才出现 */
.laws .law--body {
  display: none;
  border-color: rgba(150, 116, 64, 0.4);
  background: rgba(255, 248, 234, 0.3);
}

.laws.is-human .law--body {
  display: inline-flex;
}

.law {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.34);
  background: rgba(255, 255, 255, 0.14);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 24px rgba(20, 20, 32, 0.12);
  color: #2c2c34;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.16em;
  cursor: pointer;
  outline: none;
  user-select: none;
  -webkit-appearance: none;
  appearance: none;
  transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease,
    color 0.25s ease, border-color 0.25s ease;
}

.law:hover,
.law:focus-visible {
  background: rgba(255, 255, 255, 0.24);
  box-shadow: 0 10px 30px rgba(20, 20, 32, 0.16);
  transform: translateY(-1px);
}

.law:active {
  transform: translateY(0) scale(0.98);
}

.law__icon {
  font-size: 15px;
  line-height: 1;
  opacity: 0.9;
  transition: opacity 0.25s ease;
}

/* 已关闭的定律：整条退成灰，标签划掉，图标空掉 */
.law.is-off {
  color: rgba(44, 44, 52, 0.42);
  border-color: rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.06);
  box-shadow: none;
}

.law.is-off .law__label {
  text-decoration: line-through;
  text-decoration-thickness: 1px;
  text-decoration-color: rgba(44, 44, 52, 0.5);
}

.law.is-off .law__icon {
  opacity: 0.28;
}

.law.is-off:hover,
.law.is-off:focus-visible {
  color: rgba(44, 44, 52, 0.62);
  background: rgba(255, 255, 255, 0.14);
}

.law__tip {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 12px);
  width: min(288px, calc(100vw - 40px));
  padding: 12px 15px 13px;
  border-radius: 12px;
  background: rgba(26, 26, 34, 0.92);
  color: #f1f1f4;
  font-size: 12px;
  line-height: 1.75;
  letter-spacing: 0.02em;
  text-align: left;
  opacity: 0;
  transform: translate(-50%, 6px);
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  box-shadow: 0 16px 40px rgba(8, 8, 16, 0.28);
}

.law__tip::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 100%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: rgba(26, 26, 34, 0.92);
}

.law__tip strong {
  display: block;
  margin-bottom: 4px;
  font-size: 11px;
  letter-spacing: 0.18em;
  color: #e8c46a;
}

.law__act {
  display: block;
  margin-top: 8px;
  padding-top: 7px;
  border-top: 1px solid rgba(255, 255, 255, 0.14);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: rgba(232, 196, 106, 0.82);
}

.law.is-off .law__act {
  color: rgba(232, 196, 106, 0.5);
}

.law:hover .law__tip,
.law:focus .law__tip,
.law.is-open .law__tip,
.law:focus-within .law__tip {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ---------------------- 调摄（补泻）面板 ---------------------- */

.control {
  position: fixed;
  left: calc(22px + env(safe-area-inset-left, 0px));
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  z-index: 7;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  width: 236px;
  padding: 10px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.36);
  background: rgba(255, 255, 255, 0.16);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(20, 20, 32, 0.14);
  user-select: none;
}

.control__title {
  grid-column: 1 / -1;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 0 2px 1px;
  font-size: 11px;
  letter-spacing: 0.24em;
  color: rgba(52, 52, 62, 0.62);
}

.control__head-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

.control__help {
  width: 17px;
  height: 17px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid rgba(44, 44, 52, 0.32);
  background: rgba(255, 255, 255, 0.5);
  color: #34343e;
  font-family: inherit;
  font-size: 10px;
  line-height: 1;
  letter-spacing: 0;
  text-indent: 0;
  cursor: pointer;
  outline: none;
  transition: background 0.2s ease;
}

.control__help:hover,
.control__help:focus-visible {
  background: rgba(255, 255, 255, 0.85);
}

.control__rate {
  font-size: 11px;
  letter-spacing: 0.08em;
  font-variant-numeric: tabular-nums;
  color: #6b5210;
  opacity: 0.85;
}

.control__btn {
  padding: 7px 0;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.55);
  background: rgba(255, 255, 255, 0.3);
  color: #22222a;
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 0.14em;
  text-indent: 0.14em;
  cursor: pointer;
  outline: none;
  transition: background 0.2s ease, transform 0.12s ease, box-shadow 0.2s ease;
}

.control__btn:hover,
.control__btn:focus-visible {
  background: rgba(255, 255, 255, 0.52);
  box-shadow: 0 6px 16px rgba(20, 20, 32, 0.1);
}

.control__btn:active {
  transform: scale(0.96);
}

.control__btn--drain {
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 255, 255, 0.4);
  color: #4a4a54;
}

.control__pause {
  grid-column: span 2;
  padding: 7px 0;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.45);
  background: rgba(255, 255, 255, 0.22);
  color: #2c2c34;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.2em;
  text-indent: 0.2em;
  cursor: pointer;
  outline: none;
  transition: background 0.2s ease, transform 0.12s ease, box-shadow 0.2s ease;
}

.control__pause:hover,
.control__pause:focus-visible {
  background: rgba(255, 255, 255, 0.38);
  box-shadow: 0 6px 16px rgba(20, 20, 32, 0.1);
}

.control__pause.is-active {
  background: rgba(233, 197, 106, 0.32);
  border-color: rgba(233, 197, 106, 0.7);
  color: #6b5210;
  font-weight: 600;
}

/* 减速 / 加速：夹在时停两侧的小方按钮 */
.control__btn--speed {
  font-size: 12px;
  letter-spacing: 0.08em;
  text-indent: 0.08em;
  color: #3a3a44;
}

.control__btn:disabled {
  opacity: 0.3;
  cursor: default;
  box-shadow: none;
  transform: none;
}

/* 食 / 息 / 静养：人的日用 */
.control__btn--eat {
  border-color: rgba(150, 116, 64, 0.45);
  background: rgba(226, 205, 168, 0.4);
  color: #5c4a26;
}

.control__btn--breath {
  border-color: rgba(96, 118, 140, 0.42);
  background: rgba(206, 219, 232, 0.42);
  color: #33455a;
}

.control__btn--eat:hover,
.control__btn--eat:focus-visible {
  background: rgba(226, 205, 168, 0.62);
}

.control__btn--breath:hover,
.control__btn--breath:focus-visible {
  background: rgba(206, 219, 232, 0.64);
}

/* 人体总开关：关闭时下面那几组都不出现 */
.body-only {
  display: none;
}

.control.is-human .body-only {
  display: block;
}

/* 视图切换：粒子 / 色块 */
.control__view {
  grid-column: span 2;
  padding: 7px 0;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.42);
  background: rgba(255, 255, 255, 0.1);
  color: #5a5a64;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-indent: 0.16em;
  cursor: pointer;
  outline: none;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}

.control__view:hover,
.control__view:focus-visible {
  background: rgba(255, 255, 255, 0.26);
}

.control__view.is-on {
  border-color: rgba(96, 118, 140, 0.55);
  background: rgba(120, 140, 165, 0.3);
  color: #2b394a;
  font-weight: 600;
}
.control__human {
  grid-column: 1 / -1;
  position: relative;
  padding: 7px 0;
  border-radius: 999px;
  border: 1px dashed rgba(120, 96, 60, 0.5);
  background: rgba(255, 255, 255, 0.16);
  color: #5c4a26;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.2em;
  text-indent: 0.2em;
  cursor: pointer;
  outline: none;
  transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

.control__human:hover,
.control__human:focus-visible {
  background: rgba(255, 255, 255, 0.3);
}

.control__human.is-on {
  border-style: solid;
  border-color: rgba(214, 150, 60, 0.65);
  background: rgba(228, 172, 82, 0.26);
  color: #6b4a10;
  font-weight: 600;
}

/* 悬停说明：生命活动的收支数值都写在这里 */
.control__tip {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 10px);
  z-index: 10;
  width: min(304px, calc(100vw - 48px));
  padding: 11px 14px 12px;
  border-radius: 11px;
  background: rgba(26, 26, 34, 0.94);
  color: #f1f1f4;
  font-size: 11.5px;
  font-weight: 400;
  line-height: 1.75;
  letter-spacing: 0.02em;
  text-align: left;
  text-indent: 0;
  opacity: 0;
  transform: translate(-50%, 6px);
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  box-shadow: 0 16px 40px rgba(8, 8, 16, 0.28);
}

.control__tip::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 100%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: rgba(26, 26, 34, 0.94);
}

.control__tip strong {
  display: block;
  margin-bottom: 4px;
  font-size: 11px;
  letter-spacing: 0.18em;
  color: #e8c46a;
}

.control__human:hover .control__tip,
.control__human:focus-visible .control__tip {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* 外感：手点召邪 */
.control__omen {
  grid-column: span 2;
  padding: 7px 0;
  border-radius: 10px;
  border: 1px solid rgba(214, 150, 60, 0.55);
  background: rgba(228, 172, 82, 0.2);
  color: #6b4a10;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.2em;
  text-indent: 0.2em;
  cursor: pointer;
  outline: none;
  transition: background 0.2s ease, transform 0.12s ease, box-shadow 0.2s ease;
}

.control__omen:hover,
.control__omen:focus-visible {
  background: rgba(228, 172, 82, 0.34);
  box-shadow: 0 6px 16px rgba(120, 80, 10, 0.14);
}

.control__omen:active {
  transform: scale(0.96);
}

.control__omen:disabled,
.control__auto:disabled {
  opacity: 0.35;
  cursor: default;
  box-shadow: none;
  transform: none;
}

/* 自动 / 手动：外感是否自然发生 */
.control__auto {
  grid-column: span 2;
  padding: 7px 0;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.42);
  background: rgba(255, 255, 255, 0.12);
  color: #6a6a74;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-indent: 0.16em;
  cursor: pointer;
  outline: none;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease,
    transform 0.12s ease;
}

.control__auto:hover,
.control__auto:focus-visible {
  background: rgba(255, 255, 255, 0.26);
}

.control__auto:active {
  transform: scale(0.96);
}

.control__auto.is-on {
  border-color: rgba(214, 150, 60, 0.55);
  background: rgba(228, 172, 82, 0.26);
  color: #6b4a10;
}

.control__auto.is-on:hover,
.control__auto.is-on:focus-visible {

--------------------------------------------------------------- */

  // ---------------------------------------------------------------
  // 粒子外观：统一大小，预渲染一次
  // ---------------------------------------------------------------
  function buildSprite(kind, radius) {
    var isBlack = kind === 'black';
    var pad = 7;
    var size = (radius + pad) * 2;
    var px = Math.max(2, Math.round(size * dpr));

    var c = document.createElement('canvas');
    c.width = px;
    c.height = px;
    var g = c.getContext('2d');
    g.scale(px / size, px / size);

    var cx = size / 2;
    var cy = size / 2;

    // 落影，给一点体积感
    g.save();
    g.shadowColor = isBlack ? 'rgba(0, 0, 0, 0.44)' : 'rgba(18, 18, 30, 0.40)';
    g.shadowBlur = radius * 0.95;
    g.shadowOffsetY = radius * 0.22;
    g.beginPath();
    g.arc(cx, cy, radius, 0, Math.PI * 2);
    g.fillStyle = isBlack ? '#08080c' : '#f7f7fb';
    g.fill();
    g.restore();

    // 球面渐变
    var body = g.createRadialGradient(
      cx - radius * 0.34, cy - radius * 0.38, radius * 0.1,
      cx, cy, radius * 1.02
    );
    if (isBlack) {
      body.addColorStop(0, '#575764');
      body.addColorStop(0.45, '#1a1a21');
      body.addColorStop(1, '#000003');
    } else {
      body.addColorStop(0, '#ffffff');
      body.addColorStop(0.58, '#f3f3f8');
      body.addColorStop(1, '#c6c6d4');
    }
    g.beginPath();
    g.arc(cx, cy, radius, 0, Math.PI * 2);
    g.fillStyle = body;
    g.fill();

    // 边缘细线
    g.beginPath();
    g.arc(cx, cy, radius - 0.35, 0, Math.PI * 2);
    g.lineWidth = 0.7;
    g.strokeStyle = isBlack ? 'rgba(255, 255, 255, 0.10)' : 'rgba(255, 255, 255, 0.8)';
    g.stroke();

    // 高光
    g.beginPath();
    g.ellipse(
      cx - radius * 0.30, cy - radius * 0.36,
      radius * 0.30, radius * 0.19, -0.6, 0, Math.PI * 2
    );
    g.fillStyle = isBlack ? 'rgba(255, 255, 255, 0.16)' : 'rgba(255, 255, 255, 0.92)';
    g.fill();

    return { canvas: c, size: size };
  }

  function buildSprites() {
    sprites.black = buildSprite('black', CONFIG.radius);
    sprites.white = buildSprite('white', CONFIG.radius);
  }

  // ---------------------------------------------------------------
  // 粒子
  // ---------------------------------------------------------------
  function createParticle(kind) {
    return {
      kind: kind,
      radius: CONFIG.radius,
      x: 0,
      y: 0,
      age: 0,                   // 只用于出生淡入
      dying: false,             // 是否正在消散（被对方"带走"了）
      dyingTime: 0,
      fastFade: false,          // 手动减粒子时用更快的淡出
      angle: rand(0, Math.PI * 2),
      speed: rand(CONFIG.speed[0], CONFIG.speed[1]),
      alpha: 0
    };
  }

  // 淡入 / 淡出 —— 只改透明度，不改大小
  function updateAlpha(p) {
    var a = 1;
    if (p.age < CONFIG.fadeIn) a = p.age / CONFIG.fadeIn;
    if (p.dying) {
      var span = p.fastFade ? 0.4 : CONFIG.fadeOut;
      var b = Math.max(0, 1 - p.dyingTime / span);
      if (b < a) a = b;
    }
    p.alpha = a;
  }

  function isFreeSpot(x, y, r) {
    var limitX = Math.max(r, W - r);
    var limitY = Math.max(r, H - r);
    if (x < r || x > limitX || y < r || y > limitY) return false;
    for (var i = 0; i < particles.length; i++) {
      var q = particles[i];
      var dx = q.x - x;
      var dy = q.y - y;
      var min = q.radius + r + CONFIG.spawnGap;
      if (dx * dx + dy * dy < min * min) return false;
    }
    return true;
  }

  function spawn(kind) {
    var p = createParticle(kind);
    var r = p.radius;
    var limitX = Math.max(r, W - r);
    var limitY = Math.max(r, H - r);

    for (var i = 0; i < CONFIG.maxSpawnTry; i++) {
      p.x = rand(r, limitX);
      p.y = rand(r, limitY);
      if (isFreeSpot(p.x, p.y, r)) break;
    }

    updateAlpha(p);
    particles.push(p);
  }

  // 场上所有粒子（含正在消散的）
  function countKinds() {
    var black = 0;
    for (var i = 0; i < particles.length; i++) {
      if (particles[i].kind === 'black') black++;
    }
    return { black: black, white: particles.length - black, total: particles.length };
  }

  // 真正"存在"的粒子（不含正在消散的），离决判定用它
  function countAlive() {
    var black = 0;
    var white = 0;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (p.dying) continue;
      if (p.kind === 'black') black++;
      else white++;
    }
    return { black: black, white: white };
  }

  // 把某个"活着"的粒子标记为消散中
  function killOne(kind) {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (!p.dying && p.kind === kind) {
        p.dying = true;
        p.dyingTime = 0;
        updateAlpha(p);
        return true;
      }
    }
    return false;
  }

  function birthWeight(kind, alive) {
    if (lawsOff.zihe) return kind === 'black' ? alive.black : alive.white;
    return kind === 'black' ? alive.white : alive.black;
  }

        spawn(kind);

    } else if (n < 0) {

    ui.tutStep.textContent = (i + 1) + ' / ' + TUTORIAL.length;
    ui.tutTitle.textContent = s.title;
    ui.tutText.textContent = s.text;
    ui.tutNext.textContent = i === TUTORIAL.length - 1 ? '开始玩' : '下一步';
  }

  function nextTutorial() {
    if (!tutorial.on) return;
    var next = tutorial.step + 1;
    if (next >= TUTORIAL.length) {
      endTutorial();
      return;
    }
    showTutorialStep(next);
  }

  function endTutorial() {
    if (!tutorial.on) return;
    tutorial.on = false;
    for (var i = 0; i < TUT_KEYS.length; i++) lawsOff[TUT_KEYS[i]] = false;
    paintAllLaws();

    ui.laws.classList.remove('is-locked');
    ui.tut.classList.remove('is-visible');
    ui.tut.setAttribute('aria-hidden', 'true');

    ui.pauseBtn.disabled = false;
    setSpeed(speedStep);
    updateActions();

    try { localStorage.setItem('yinyang-tut-done', '1'); } catch (e) {}
  }

  // 速度档位：夹在时停两侧的减速 / 加速，到头就禁用
  function setSpeed(step) {
    speedStep = Math.max(0, Math.min(SPEED_STEPS.length - 1, step));
    simSpeed = SPEED_STEPS[speedStep];
    ui.rate.textContent = '×' + simSpeed;
    ui.slower.disabled = speedStep === 0;
    ui.faster.disabled = speedStep === SPEED_STEPS.length - 1;
  }

  // 外感自动 / 手动
  function syncAuto() {
    ui.autoBtn.classList.toggle('is-on', eventAuto);
    ui.autoBtn.setAttribute('aria-pressed', eventAuto ? 'true' : 'false');
    ui.autoBtn.textContent = eventAuto ? '自动 · 开' : '手动 · 关';
  }

  function toggleAuto() {
    eventAuto = !eventAuto;
    if (eventAuto) eventNext = rand(CONFIG.omenGap[0], CONFIG.omenGap[1]);
    syncAuto();
  }

  // 消长状态：看最近约 15 秒里阴阳各自是增是减
  function updateTrend(dt, counts) {
    if (state !== 'running' || lawsOff.xiaozhang) {
      ui.trend.classList.add('is-hidden');
      return;
    }

    trendClock += dt;
    if (trendClock >= 1.5) {
      trendClock -= 1.5;
      trendHist.push({ black: counts.black, white: counts.white });
      if (trendHist.length > 10) trendHist.shift();
    }

    if (trendHist.length < 10) {
      ui.trend.classList.add('is-hidden');
      return;
    }
    ui.trend.classList.remove('is-hidden');

    var dY = counts.white - trendHist[0].white;
    var dI = counts.black - trendHist[0].black;
    var text;
    if (dY >= 2 && dI <= -2) text = '阳长阴消';
    else if (dI >= 2 && dY <= -2) text = '阴长阳消';
    else if (dY >= 2 && dI >= 2) text = '阴阳皆长';
    else if (dY <= -2 && dI <= -2) text = '阴阳皆消';
    else text = '消长持平';
    if (ui.trend.textContent !== text) ui.trend.textContent = text;
  }

  function seedInitial() {
    particles.length = 0;
    var half = Math.floor(CONFIG.targetTotal / 2);
    for (var c = 0; c < 2; c++) {
      var kind = c === 0 ? 'black' : 'white';
      for (var i = 0; i < half; i++) {
        spawn(kind);
        // 初始粒子直接是"已长成"的状态，页面一打开就能看见
        var p = particles[particles.length - 1];
        p.age = CONFIG.fadeIn;
        updateAlpha(p);
      }
    }
  }

  // ---------------------------------------------------------------
  // 离决 / 重新开始
  // ---------------------------------------------------------------
  function showEnding(counts) {
    endingShown = true;
    if (counts.black === 0) {
      ending.text.textContent = '阴已归零，孤阳不生。天地失其和，此谓阴阳离决。';
      ending.counts.textContent = '阴 0 · 阳 ' + counts.white;
    } else {
      ending.text.textContent = '阳已归零，孤阴不长。天地失其和，此谓阴阳离决。';
      ending.counts.textContent = '阴 ' + counts.black + ' · 阳 0';
    }
    ending.screen.classList.add('is-visible');
    ending.screen.setAttribute('aria-hidden', 'false');
  }

  function restart() {
    ending.screen.classList.remove('is-visible');
    ending.screen.setAttribute('aria-hidden', 'true');
    endingShown = false;
    state = 'running';
    particles.length = 0;
    birthAcc.black = 0;
    birthAcc.white = 0;
    birthNeed.black = 1;
    birthNeed.white = 1;
    deathAcc = 0;
    deathNeed = 1;
    convertCd = 0;
    bannerTime = 0;
    trendHist = [];
    trendClock = 0;
    eventNext = rand(CONFIG.omenGap[0], CONFIG.omenGap[1]);
    omenTime = 0;
    lifeNext = rand(CONFIG.lifeGap[0], CONFIG.lifeGap[1]);
    eatCd = 0;
    breathCd = 0;
    ui.banner.classList.remove('is-visible');
    omen.card.classList.remove('is-visible');
    omen.card.setAttribute('aria-hidden', 'true');
    seedInitial();
    lastHud = { black: -1, white: -1, total: -1, balance: '', cls: null };
    updateHud(countKinds());
  }

  // 手动加粒子：按钮一次加 5 个（上限 400，防止点太多卡）
  function addParticles(kind, n) {
    if (state !== 'running') return;
    for (var i = 0; i < n; i++) {
      if (particles.length >= 400) break;
      spawn(kind);
    }
  }

  // 手动减粒子：标记为消散，让它们淡出
  function removeParticles(kind, n) {
    if (state !== 'running') return;
    var removed = 0;
    for (var i = 0; i < particles.length && removed < n; i++) {
      var p = particles[i];
      if (p.dying || p.kind !== kind) continue;
      p.dying = true;
      p.dyingTime = 0;
      p.fastFade = true;
      updateAlpha(p);
      removed++;
    }
  }

  // 时停：粒子继续漂，但生灭、转化都停下
  function togglePause() {
    paused = !paused;
    ui.pauseBtn.classList.toggle('is-active', paused);
    ui.pauseBtn.textContent = paused ? '继续' : '时停';
    ui.pauseBtn.title = paused ? '继续：恢复生灭' : '时停：粒子照常运动，生灭暂停';
  }

  // 预览用：按 D 直接让"阴"散尽，立刻看离决界面（正式玩法里自然归零才触发）
  function previewEnding() {
    if (state !== 'running') return;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (p.kind === 'black' && !p.dying) {
        p.dying = true;
        p.dyingTime = 0;
      }
    }
  }

  // ---------------------------------------------------------------
  // 尺寸
  // ---------------------------------------------------------------
  function resize() {
    var nextDpr = Math.min(window.devicePixelRatio || 1, CONFIG.dprCap);
    var dprChanged = nextDpr !== dpr;
    dpr = nextDpr;

    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var r = p.radius;
      if (p.x < r) p.x = r;
      if (p.x > W - r) p.x = Math.max(r, W - r);
      if (p.y < r) p.y = r;
      if (p.y > H - r) p.y = Math.max(H - r, r);
    }

    if (dprChanged) buildSprites();
  }

  // ---------------------------------------------------------------
  // 更新
  // ---------------------------------------------------------------
  function update(dt) {
    var i, p;

    var counts = countKinds();
    var alive = countAlive();

    // 0) 离决判定：任一方"存在"的数量归零，就停下生灭
    if (state === 'running' && (alive.black === 0 || alive.white === 0)) {
      state = 'separated';
      birthAcc.black = 0;
      birthAcc.white = 0;
      deathAcc = 0;
    }

    // 1) 变老 / 淡出
    for (i = particles.length - 1; i >= 0; i--) {
      p = particles[i];
      p.age += dt;

      if (p.dying) {
        p.dyingTime += dt;
        var span = p.fastFade ? 0.4 : CONFIG.fadeOut;
        if (p.dyingTime >= span) {
          particles.splice(i, 1);
          continue;
        }
      }
      updateAlpha(p);
    }

    // 2) 消亡事件（对立制约）
    //    每个粒子每秒的消散概率 = 对方数量 × 制约系数（线性）
    //    按 hazard 加权随机挑一个粒子，两次事件的间隔在 jitter 范围内浮动
    //    关掉这条律：粒子不再因对方的存在而消散（只增不减）
    if (!paused && state === 'running' && !lawsOff.zhizhi) {
      var deathRate = 0;
      for (i = 0; i < particles.length; i++) {
        p = particles[i];
        if (p.dying) continue;
        var opp = p.kind === 'black' ? alive.white : alive.black;
        deathRate += CONFIG.restraint * opp;
      }

      // 收尾加速：剩十几个时，r·b·w 每秒才死掉一个，离决要等太久。
      // 总数很少时整体放大消亡权重（总率与挑选权重必须同乘一个系数，
      // 否则随机数会落在空处，挑不到粒子，等于空转）
      var accel = 1;
      var fewest = alive.black + alive.white;
      if (fewest > 0 && fewest <= 22 && deathRate > 0 && deathRate < 0.8) {
        accel = 0.8 / deathRate;
      }
      deathRate *= accel;

      deathAcc += deathRate * dt;
      while (deathAcc >= deathNeed) {
        var pick = Math.random() * deathRate;
        var chosen = null;
        for (i = 0; i < particles.length; i++) {
          p = particles[i];
          if (p.dying) continue;
          var opp2 = p.kind === 'black' ? alive.white : alive.black;
          pick -= CONFIG.restraint * opp2 * accel;
          if (pick <= 0) { chosen = p; break; }
        }
        if (!chosen) { deathAcc = 0; break; }

        chosen.dying = true;
        chosen.dyingTime = 0;
        updateAlpha(chosen);

        deathAcc -= deathNeed;
        deathNeed = rand(CONFIG.jitter[0], CONFIG.jitter[1]);
      }
    }

    // 2) 随机游走
    var speedMax = CONFIG.speed[1] * CONFIG.speedDrift;
    for (i = 0; i < particles.length; i++) {
      p = particles[i];

      p.angle += gauss() * CONFIG.wander * dt;
      p.speed += gauss() * 6 * dt;
      if (p.speed < CONFIG.speed[0]) p.speed = CONFIG.speed[0];
      if (p.speed > speedMax) p.speed = speedMax;

      p.x += Math.cos(p.angle) * p.speed * dt;
      p.y += Math.sin(p.angle) * p.speed * dt;

      var m = p.radius;
      if (p.x < m) {
        p.x = m;
        p.angle = Math.PI - p.angle;
        p.speed *= CONFIG.bounceDamping;
      } else if (p.x > W - m) {
        p.x = W - m;
        p.angle = Math.PI - p.angle;
        p.speed *= CONFIG.bounceDamping;
      }
      if (p.y < m) {
        p.y = m;
        p.angle = -p.angle;
        p.speed *= CONFIG.bounceDamping;
      } else if (p.y > H - m) {
        p.y = H - m;
        p.angle = -p.angle;
        p.speed *= CONFIG.bounceDamping;
      }
    }

    // 4) 生成事件（互藏互用）
    //    生成速率 = 对方数量² × 生成系数；和消亡用同一个指数，
    //    于是每边各自收敛到 generate/restraint，总数自然停在那个水平
    //    关掉这条律：不再新生，只灭不生
    if (!paused && state === 'running' && !lawsOff.huzang &&
        particles.length < CONFIG.maxTotal) {
      counts = countKinds();
      alive = countAlive();

      // 关掉阴阳互损：总数到两虚线附近就换一套系数，缺口越大补得越快，
      // 让总数停在 weakTotal 上下，不再一路虚下去，也就走不到"双方都 < 50"
      var gcoef = CONFIG.generate;
      if (lawsOff.husun && counts.total < CONFIG.weakTotal) {
        var gap = CONFIG.weakTotal - counts.total;
        gcoef = CONFIG.restraint * (1 + Math.min(1, gap / 16));
      }

      var inBlack = birthWeight('black', alive);
      var inWhite = birthWeight('white', alive);

      birthAcc.black += gcoef * inBlack * inBlack * dt;
      birthAcc.white += gcoef * inWhite * inWhite * dt;

      // 谁欠得更多（累计量 / 本次所需）就先补谁，避免总是阴优先
      var ready = [];
      if (birthAcc.black >= birthNeed.black) ready.push('black');
      if (birthAcc.white >= birthNeed.white) ready.push('white');
      ready.sort(function (a, b) {
        return birthAcc[b] / birthNeed[b] - birthAcc[a] / birthNeed[a];
      });

      var n = Math.min(ready.length, CONFIG.maxSpawnPerFrame);
      for (i = 0; i < n; i++) {
        var kind = ready[i];
        spawn(kind);
        birthAcc[kind] -= birthNeed[kind];
        birthNeed[kind] = rand(CONFIG.jitter[0], CONFIG.jitter[1]);
      }
    }

    // 5) 转化（物极必反）：一方极盛，开始向对方转化
    //    重阴必阳 / 重阳必阴 —— 比例悬殊到 2:1 就算"极"
    //    关掉这条律：不再物极必反
    if (!paused && state === 'running' && !lawsOff.zhuanhua) {
      convertCd -= dt;
      var hi = Math.max(alive.black, alive.white);
      var lo = Math.min(alive.black, alive.white);

      if (convertCd <= 0 && lo >= 2 && hi >= lo * CONFIG.conversionRatio) {
        var from = alive.black > alive.white ? 'black' : 'white';
        var to = from === 'black' ? 'white' : 'black';
        var convertN = Math.max(1, Math.min(3, Math.round(hi / 20)));

        for (i = 0; i < convertN; i++) {
          if (!killOne(from)) break;
          spawn(to);
        }

        showBanner(from === 'black' ? '重阴必阳' : '重阳必阴');
        convertCd = CONFIG.conversionCooldown;
      }
    }

    // 6) 外感六淫：自然发生（关掉后只能手点）
    if (humanOn && eventAuto && !paused && state === 'running') {
      eventNext -= dt;
      if (eventNext <= 0) {
        triggerOmen();
        eventNext = rand(CONFIG.omenGap[0], CONFIG.omenGap[1]);
      }
    }

    // 7) 生命活动：形体日用，阴阳俱耗（关了「日用」这条即静养）
    //    吃饭、呼吸是补，日常活动是耗；一耗一补，阴阳才有"收支"
    if (humanOn && !lawsOff.riyong && !paused && state === 'running') {
      lifeNext -= dt;
      if (lifeNext <= 0) {
        changeKind('black', -CONFIG.lifeCost);
        changeKind('white', -CONFIG.lifeCost);
        lifeNext = rand(CONFIG.lifeGap[0], CONFIG.lifeGap[1]);
      }
    }

    // 4) 等最后几个粒子淡完，再揭开"阴阳离决"
    if (state === 'separated' && !endingShown) {
      var left = countKinds();
      if (left.black === 0 || left.white === 0) showEnding(left);
    }
  }

  // ---------------------------------------------------------------
  // 绘制
  // ---------------------------------------------------------------
  function draw(counts) {
    ctx.clearRect(0, 0, W, H);

    if (viewMode === 'block') {
      drawBlock(counts);
      return;
    }

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (p.alpha <= 0.02) continue;
      var sprite = sprites[p.kind];
      var s = sprite.size;
      ctx.globalAlpha = p.alpha;
      ctx.drawImage(sprite.canvas, p.x - s / 2, p.y - s / 2, s, s);
    }

    ctx.globalAlpha = 1;
  }

  // 色块模式：一张阴阳图，黑鱼的面积就是阴的多少
  //
  // 几何：分界点沿竖直直径偏移 d，上半段小圆半径 (R+d)/2、下半段 (R-d)/2，
  // 于是黑鱼面积 = πR²(0.5 - d/R)，与 d 成线性 —— 反解 d = R(0.5 - p阴) 即可
  // 精确对上比例，50:50 时正好是标准太极。
  function drawBlock(counts) {
    var total = counts.total;
    var pBlack = total > 0 ? counts.black / total : 0.5;

    var narrow = W < 720;
    var R = Math.min(W, H) * (narrow ? 0.26 : 0.3);
    var cx = narrow ? W * 0.64 : W / 2;
    var cy = narrow ? H * 0.53 : H / 2;

    var d = R * (0.5 - pBlack);
    var r1 = (R + d) / 2;
    var r2 = (R - d) / 2;
    var cy1 = cy + (d - R) / 2;
    var cy2 = cy + (d + R) / 2;

    // 白鱼打底
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = '#f8f8fb';
    ctx.fill();

    // 黑鱼：左半大圆 + 下小圆 - 上小圆
    ctx.beginPath();
    ctx.moveTo(cx, cy - R);
    ctx.arc(cx, cy, R, -Math.PI / 2, Math.PI / 2, true);
    ctx.arc(cx, cy2, r2, Math.PI / 2, -Math.PI / 2, true);
    ctx.arc(cx, cy1, r1, Math.PI / 2, Math.PI * 1.5, false);
    ctx.closePath();
    ctx.fillStyle = '#08080c';
    ctx.fill();

    // 鱼眼：白鱼里一点黑，黑鱼里一点白
    ctx.beginPath();
    ctx.arc(cx, cy1, Math.max(2, r1 * 0.33), 0, Math.PI * 2);
    ctx.fillStyle = '#08080c';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy2, Math.max(2, r2 * 0.33), 0, Math.PI * 2);
    ctx.fillStyle = '#f8f8fb';
    ctx.fill();

    // 外圈
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(20, 20, 30, 0.3)';
    ctx.stroke();

    // 比例
    var pctI = Math.round(pBlack * 100);
    ctx.font = '13px "Songti SC", "Noto Serif SC", "STSong", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(28, 28, 36, 0.68)';
    ctx.fillText('阴 ' + pctI + '%  ·  阳 ' + (100 - pctI) + '%', cx, cy + R + 26);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  // ---------------------------------------------------------------
  // HUD
  // ---------------------------------------------------------------
  function updateHud(counts) {
    if (counts.black !== lastHud.black) {
      ui.black.textContent = counts.black;
      lastHud.black = counts.black;
    }
    if (counts.white !== lastHud.white) {
      ui.white.textContent = counts.white;
      lastHud.white = counts.white;
    }
    if (counts.total !== lastHud.total) {
      ui.total.textContent = '共 ' + counts.total;
      lastHud.total = counts.total;
    }

    var balance, cls;
    if (state === 'separated') {
      balance = '阴阳离决';
      cls = 'is-separated';
    } else if (counts.black < 50 && counts.white < 50) {
      // 互根互用失常：一方虚损不能助长另一方，累及对方亦虚
      balance = '阴阳两虚';
      if (counts.black !== counts.white) {
        balance += counts.white < counts.black ? ' · 阳损及阴' : ' · 阴损及阳';
      }
      cls = 'is-deficiency';
    } else if (counts.total > 0) {
      // 平衡也按占比判断：两边各占一半附近才算平衡
      var pY = counts.white / counts.total;
      if (Math.abs(pY - 0.5) <= 0.045) {
        balance = '阴阳平衡';
        cls = 'is-balanced';
      } else {
        var major = pY > 0.5 ? '阳' : '阴';
        var pct = Math.round((pY > 0.5 ? pY : 1 - pY) * 100);
        balance = '阴阳失衡 · ' + major + '占 ' + pct + '%';
        cls = 'is-over';
      }
    }

    if (balance !== lastHud.balance) {
      ui.balance.textContent = balance;
      lastHud.balance = balance;
    }
    if (cls !== lastHud.cls) {
      ui.balance.classList.toggle('is-balanced', cls === 'is-balanced');
      ui.balance.classList.toggle('is-over', cls === 'is-over');
      ui.balance.classList.toggle('is-separated', cls === 'is-separated');
      ui.balance.classList.toggle('is-deficiency', cls === 'is-deficiency');
      lastHud.cls = cls;
    }
  }

  // ---------------------------------------------------------------
  // 证候词条：右上角分区显示，阴归阴、阳归阳，可同时出现多条
  // ---------------------------------------------------------------
  var lastTagSig = '';

  function conditions(counts) {
    var yang = counts.white;   // 阳
    var yin = counts.black;    // 阴
    var yinTags = [];
    var yangTags = [];
    var total = yin + yang;
    if (total <= 0) return { yin: yinTags, yang: yangTags };

    // 全部按"占比"判断，和总数无关：50 / 50 的场子里，130 和 60 的总数一视同仁
    var pY = yang / total;    // 阳的占比
    var pI = yin / total;     // 阴的占比
    var SHENG = 0.5455;       // 过半有余 → 盛
    var XU = 0.4545;          // 不足一半 → 虚
    var SHUAI = 0.3636;       // 不足四成 → 衰

    // —— 阴区 ——
    if (pI > SHENG) {
      yinTags.push({ key: 'yin-sheng', label: '阴盛', side: 'yin', tip: '阴盛：阴的占比超过 54.5%，相对偏盛。' });
    } else if (pI < SHUAI) {
      yinTags.push({ key: 'yin-shuai', label: '阴衰', side: 'yin', tip: '阴衰：阴的占比低于 36.4%，相对衰微。' });
    } else if (pI < XU) {
      yinTags.push({ key: 'yin-xu', label: '阴虚', side: 'yin', tip: '阴虚：阴的占比低于 45.5%，相对偏虚。' });
    }

    // —— 阳区 ——
    if (pY > SHENG) {
      yangTags.push({ key: 'yang-sheng', label: '阳盛', side: 'yang', tip: '阳盛：阳的占比超过 54.5%，相对偏盛。' });
    } else if (pY < SHUAI) {
      yangTags.push({ key: 'yang-shuai', label: '阳衰', side: 'yang', tip: '阳衰：阳的占比低于 36.4%，相对衰微。' });
    } else if (pY < XU) {
      yangTags.push({ key: 'yang-xu', label: '阳虚', side: 'yang', tip: '阳虚：阳的占比低于 45.5%，相对偏虚。' });
    }

    // 阴虚则阳亢：阴的占比不足，阳相对失制 → 阳区
    if (pI < XU) {
      yangTags.push({ key: 'yang-kang', label: '阳亢', side: 'yang', tip: '阴虚则阳亢：阴的占比不足，阳失所制而上亢。' });
    }

    // 阳虚则阴盛：阳的占比不足，阴相对失制 → 阴区（与"阴盛"重名时只留一条解释）
    if (pY < XU) {
      for (var i = yinTags.length - 1; i >= 0; i--) {
        if (yinTags[i].key === 'yin-sheng') yinTags.splice(i, 1);
      }
      yinTags.push({ key: 'yin-sheng-yangxu', label: '阴盛', side: 'yin', tip: '阳虚则阴盛：阳的占比不足，阴失所制而偏盛。' });
    }

    // 阴盛则阳病：阴的占比过半 → 阳区
    if (pI > SHENG) {
      yangTags.push({ key: 'yang-bing', label: '阳病', side: 'yang', tip: '阴盛则阳病：阴的占比过半，阳受其制而为病。' });
    }

    // 阳盛则阴病：阳的占比过半 → 阴区
    if (pY > SHENG) {
      yinTags.push({ key: 'yin-bing', label: '阴病', side: 'yin', tip: '阳盛则阴病：阳的占比过半，阴受其制而为病。' });
    }

    return { yin: yinTags, yang: yangTags };
  }

  function makeChip(t) {
    var chip = document.createElement('span');
    chip.className = 'tag tag--' + t.side;
    chip.tabIndex = 0;

    var label = document.createElement('span');
    label.className = 'tag__label';
    label.textContent = t.label;

    var tip = document.createElement('span');
    tip.className = 'tag__tip';
    tip.textContent = t.tip;

    chip.appendChild(label);
    chip.appendChild(tip);
    return chip;
  }

  function makeGroup(label, side, list) {
    var group = document.createElement('div');
    group.className = 'states__group states__group--' + side;

    var head = document.createElement('div');
    head.className = 'states__head';

    var dot = document.createElement('span');
    dot.className = 'states__dot';

    var name = document.createElement('span');
    name.textContent = label;

    head.appendChild(dot);
    head.appendChild(name);

    var body = document.createElement('div');
    body.className = 'states__list';

    if (!list.length) {
      var empty = document.createElement('span');
      empty.className = 'states__empty';
      empty.textContent = '—';
      body.appendChild(empty);
    } else {
      for (var i = 0; i < list.length; i++) body.appendChild(makeChip(list[i]));
    }

    group.appendChild(head);
    group.appendChild(body);
    return group;
  }

  function renderTags(groups) {
    var sig = '';
    for (var i = 0; i < groups.yin.length; i++) sig += groups.yin[i].key + ',';
    sig += '|';
    for (var j = 0; j < groups.yang.length; j++) sig += groups.yang[j].key + ',';
    if (sig === lastTagSig) return;
    lastTagSig = sig;

    var total = groups.yin.length + groups.yang.length;
    ui.tags.classList.toggle('is-visible', total > 0);
    ui.tags.setAttribute('aria-hidden', total ? 'false' : 'true');

    while (ui.tags.firstChild) ui.tags.removeChild(ui.tags.firstChild);
    if (!total) return;

    // 两个分区始终都画出来，空的一侧用"—"，让"阴归阴、阳归阳"一目了然
    ui.tags.appendChild(makeGroup('阴', 'yin', groups.yin));
    var divider = document.createElement('div');
    divider.className = 'states__divider';
    ui.tags.appendChild(divider);
    ui.tags.appendChild(makeGroup('阳', 'yang', groups.yang));
  }

  // ---------------------------------------------------------------
  // 主循环
  // ---------------------------------------------------------------
  var lastTime = 0;

  function frame(now) {
    if (!lastTime) lastTime = now;
    var dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.05) dt = 0.05;

    update(dt * simSpeed);

    var counts = countKinds();
    draw(counts);
    updateHud(counts);

    // 教程按真实时间推进，免得被加速带飞
    if (tutorial.on) {
      tutorial.time -= dt;
      if (tutorial.time <= 0) nextTutorial();
    }

    renderTags(state === 'separated' ? { yin: [], yang: [] } : conditions(counts));
    updateTrend(dt * simSpeed, counts);

    if (bannerTime > 0) {
      bannerTime -= dt;
      if (bannerTime <= 0) ui.banner.classList.remove('is-visible');
    }

    if (omenTime > 0) {
      omenTime -= dt;
      if (omenTime <= 0) {
        omen.card.classList.remove('is-visible');
        omen.card.setAttribute('aria-hidden', 'true');
      }
    }

    // 食 / 息的冷却走真实时间，加速时也不会变成狂点
    if (eatCd > 0) eatCd -= dt;
    if (breathCd > 0) breathCd -= dt;
    updateActions();

    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------
  // 启动
  // ---------------------------------------------------------------
  function start() {
    dpr = -1;
    resize();
    seedInitial();
    updateHud(countKinds());

    ending.button.addEventListener('click', restart);
    ui.addYin.addEventListener('click', function () { addParticles('black', 5); });
    ui.addYang.addEventListener('click', function () { addParticles('white', 5); });
    ui.subYin.addEventListener('click', function () { removeParticles('black', 5); });
    ui.subYang.addEventListener('click', function () { removeParticles('white', 5); });
    ui.pauseBtn.addEventListener('click', togglePause);
    ui.slower.addEventListener('click', function () { setSpeed(speedStep - 1); });
    ui.faster.addEventListener('click', function () { setSpeed(speedStep + 1); });
    ui.omenBtn.addEventListener('click', triggerOmen);
    ui.autoBtn.addEventListener('click', toggleAuto);
    ui.eat.addEventListener('click', eat);
    ui.breath.addEventListener('click', breathe);
    ui.humanBtn.addEventListener('click', toggleHuman);
    ui.viewParticles.addEventListener('click', function () { setView('particles'); });
    ui.viewBlock.addEventListener('click', function () { setView('block'); });
    ui.tutStart.addEventListener('click', startTutorial);
    ui.tutNext.addEventListener('click', nextTutorial);
    ui.tutSkip.addEventListener('click', endTutorial);
    setSpeed(speedStep);
    syncAuto();
    setView(viewMode);
    updateActions();

    // 底部六律：点一下关掉，再点恢复（button 原生支持 Enter / Space）
    lawEls = document.querySelectorAll('.law');
    for (var li = 0; li < lawEls.length; li++) {
      (function (el) {
        var key = el.getAttribute('data-law');
        if (!(key in lawsOff)) return;
        el.addEventListener('click', function () {
          toggleLaw(key, el);
          el.blur();
        });
      })(lawEls[li]);
    }
    document.addEventListener('keydown', function (e) {
      if (e.shiftKey && (e.key === 'D' || e.key === 'd')) previewEnding();
    });

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () {
      setTimeout(resize, 120);
    });

    // 第一次来，先把教程走一遍
    var tutSeen = false;
    try { tutSeen = localStorage.getItem('yinyang-tut-done') === '1'; } catch (e) {}
    if (!tutSeen) setTimeout(startTutorial, 700);

    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();

  </script>
</body>
</html>
