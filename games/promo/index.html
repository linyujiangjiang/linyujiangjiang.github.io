<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>岐黄问道 · 宣传片预览</title>
<style>
  :root{--ink:#14120f;--gold:#d6b26e;--paper:#efe9dd;--dim:#9a9082;}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 12%,#2a241c 0%,var(--ink) 58%);color:var(--paper);font-family:"KaiTi","STKaiti","Songti SC",serif;display:flex;flex-direction:column;align-items:center;padding:48px 20px 60px;}
  h1{font-size:clamp(28px,5vw,42px);letter-spacing:.16em;color:var(--gold);font-weight:400;margin:0 0 8px;}
  .sub{color:var(--dim);letter-spacing:.24em;font-size:13px;margin-bottom:32px;}
  video{width:min(420px,88vw);border-radius:14px;border:1px solid rgba(214,178,110,.3);box-shadow:0 24px 60px rgba(0,0,0,.55);background:#000;}
  .meta{margin-top:26px;color:var(--dim);font-size:13px;line-height:2;text-align:center;}
  a{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(214,178,110,.4);}
  .tag{display:inline-block;margin:0 4px;padding:1px 10px;border:1px solid rgba(214,178,110,.3);border-radius:20px;font-size:12px;color:#b9ad99;}
</style>
</head>
<body>
  <h1>岐黄问道</h1>
  <div class="sub">宣传片 · 预览版</div>
  <video src="./preview.mp4" controls playsinline preload="metadata"></video>
  <div class="meta">
    <span class="tag">80 秒</span><span class="tag">竖屏</span><span class="tag">配音 + 字幕</span><br>
    这是 540p 预览版，原片 1080p 在 B站 发布<br>
    <a href="../">→ 去玩两个游戏</a>
  </div>
</body>
</html>
