<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b0d10" />
<title>岐黄问道 · 中医典籍背诵闯关</title>
<style>
:root{
  --gold:#c9a86a;
  --gold-2:#efdcae;
  --gold-3:#8f7442;
  --ink:#e9e2d4;
  --ink-dim:#9a9384;
  --ink-faint:#6d6759;
  --red:#a8342a;
  --jade:#7aa593;
  --line:rgba(201,168,106,.20);
  --line-strong:rgba(201,168,106,.48);
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun","Microsoft YaHei",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{height:100%}
body{
  min-height:100dvh;color:var(--ink);font-family:var(--serif);
  background:#0b0d10;-webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:.02em;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(1100px 780px at 74% -14%, rgba(201,168,106,.14), transparent 62%),
    radial-gradient(900px 720px at 4% 108%, rgba(146,52,36,.17), transparent 60%),
    radial-gradient(760px 620px at 102% 102%, rgba(74,104,90,.10), transparent 60%),
    linear-gradient(168deg,#0c0e11 0%,#12100c 54%,#090a0c 100%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.30;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>");
}
#app{
  position:relative;width:100%;max-width:760px;margin:0 auto;min-height:100dvh;
  padding:clamp(20px,4vw,40px) clamp(16px,4.4vw,36px) calc(30px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
}
.screen{display:none;flex-direction:column;flex:1;animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.screen.active{display:flex}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.corner{position:fixed;width:26px;height:26px;border:1px solid rgba(201,168,106,.28);pointer-events:none;z-index:1}
.corner.tl{top:14px;left:14px;border-right:0;border-bottom:0}
.corner.tr{top:14px;right:14px;border-left:0;border-bottom:0}
.corner.bl{bottom:14px;left:14px;border-right:0;border-top:0}
.corner.br{bottom:14px;right:14px;border-left:0;border-top:0}

/* ---------- 首页 ---------- */
.hero{padding-top:clamp(6px,3vh,30px);text-align:center}
.seal{
  display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;margin-bottom:16px;
  border:1px solid rgba(168,52,42,.62);border-radius:7px;
  color:#d3554a;font-size:13px;font-weight:700;line-height:1.15;letter-spacing:.14em;
  writing-mode:vertical-rl;text-orientation:upright;
  box-shadow:0 0 26px rgba(168,52,42,.16), inset 0 0 14px rgba(168,52,42,.10);
}
.hero h1{
  margin:0;font-size:clamp(34px,8.4vw,56px);font-weight:700;
  letter-spacing:.26em;text-indent:.26em;line-height:1.1;
  background:linear-gradient(178deg,#f6ecd4 0%,#dcc394 42%,#a8863f 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 18px rgba(201,168,106,.22));
}
.hero .sub{margin:12px 0 0;color:var(--ink-dim);font-size:clamp(11px,3vw,13px);letter-spacing:.32em;text-indent:.32em}
.hero .rule{width:min(280px,64%);height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,rgba(201,168,106,.55),transparent);position:relative}
.hero .rule::after{content:"";position:absolute;left:50%;top:-3px;width:7px;height:7px;margin-left:-3.5px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 12px rgba(201,168,106,.7)}

/* 模式切换 */
.tabs{
  display:flex;gap:6px;margin:clamp(20px,3.4vh,30px) 0 18px;padding:5px;
  border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.022);
}
.tabs button{
  flex:1;background:none;border:0;color:var(--ink-dim);font-family:inherit;
  font-size:12.5px;letter-spacing:.2em;text-indent:.2em;padding:11px 0;border-radius:9px;
  cursor:pointer;transition:.3s;
}
.tabs button.on{
  background:linear-gradient(160deg,rgba(201,168,106,.18),rgba(201,168,106,.06));
  color:var(--gold-2);box-shadow:inset 0 0 0 1px rgba(201,168,106,.28);
}
.panel{display:none;flex-direction:column;gap:13px}
.panel.on{display:flex;animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.panelHint{margin:0 0 6px;color:var(--ink-faint);font-size:12px;letter-spacing:.06em;line-height:1.9}

/* 关卡卡 */
.levels{display:flex;flex-direction:column;gap:13px}
.level{
  position:relative;display:block;padding:18px 21px 15px;
  border:1px solid var(--line);border-radius:15px;
  background:linear-gradient(150deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  cursor:pointer;overflow:hidden;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s,box-shadow .35s,background .35s;
  animation:rise .6s cubic-bezier(.2,.7,.2,1) both;
}
.level:nth-child(2){animation-delay:.06s}
.level:nth-child(3){animation-delay:.12s}
.level::before{content:"";position:absolute;left:0;top:16%;bottom:16%;width:2px;background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:.55;transition:opacity .35s}
.level:hover{transform:translateY(-3px);border-color:var(--line-strong);
  box-shadow:0 18px 44px -22px rgba(201,168,106,.42), 0 0 0 1px rgba(201,168,106,.06) inset;
  background:linear-gradient(150deg,rgba(201,168,106,.10),rgba(255,255,255,.012));}
.level:hover::before{opacity:1}
.level .head{display:flex;align-items:center;gap:12px}
.level .num{flex:0 0 auto;font-size:10.5px;letter-spacing:.16em;color:var(--gold-3);border:1px solid rgba(201,168,106,.32);border-radius:5px;padding:3px 7px;line-height:1.25;white-space:nowrap}
.level h3{margin:0;flex:1;min-width:0;font-size:clamp(17px,4.4vw,21px);font-weight:700;letter-spacing:.16em;color:#efe6d2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.level .tag{flex:0 0 auto;margin-left:6px;color:var(--gold);font-size:11px;letter-spacing:.18em;opacity:.9;white-space:nowrap}
.level .meta{margin:9px 0 0;color:var(--ink-faint);font-size:clamp(11px,2.9vw,12.3px);letter-spacing:.06em;line-height:1.75}
.level .meta em{font-style:normal;color:var(--gold-3)}
.level .stars{display:flex;gap:5px;margin-top:10px}
.level .stars i{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--gold-3);display:block}
.level .stars i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 9px rgba(201,168,106,.65)}
.level.locked{cursor:not-allowed;opacity:.42;filter:saturate(.5)}
.level.locked:hover{transform:none;box-shadow:none;border-color:var(--line);background:linear-gradient(150deg,rgba(255,255,255,.045),rgba(255,255,255,.012))}
.level.locked .tag{color:var(--ink-faint)}

/* ---------- 背诵 ---------- */
.segs{display:flex;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.segs button{
  flex:1;min-width:86px;background:none;border:1px solid var(--line);border-radius:9px;
  color:var(--ink-dim);font-family:inherit;font-size:12px;letter-spacing:.16em;padding:9px 6px;
  cursor:pointer;transition:.3s;
}
.segs button.on{border-color:rgba(201,168,106,.55);color:var(--gold-2);background:rgba(201,168,106,.10)}
.memEra{
  display:flex;align-items:center;gap:10px;margin:22px 0 9px;
  font-size:10.5px;letter-spacing:.3em;color:var(--gold-3);
}
.memEra::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(201,168,106,.28),transparent)}
.memEra:first-child{margin-top:6px}
.memItem{
  padding:13px 16px;border:1px solid var(--line);border-radius:11px;
  background:rgba(255,255,255,.02);margin-bottom:9px;line-height:1.7;
}
.memItem .b{font-size:clamp(14px,3.7vw,15.5px);color:#efe6d2;letter-spacing:.05em;font-weight:700}
.memItem .p{margin-top:4px;font-size:12px;color:var(--gold-3);letter-spacing:.06em}
.memItem .s{margin-top:6px;font-size:12.5px;color:var(--ink-dim);letter-spacing:.02em}
.memItem .z{margin-top:5px;font-size:11.5px;color:var(--ink-faint)}

.foot{margin-top:auto;padding-top:30px;text-align:center;color:var(--ink-faint);font-size:11px;letter-spacing:.18em;line-height:2}
.foot button{background:none;border:0;color:var(--ink-faint);font-family:inherit;font-size:11px;letter-spacing:.18em;cursor:pointer;padding:4px 8px;border-bottom:1px solid transparent}
.foot button:hover{opacity:1;border-bottom-color:rgba(201,168,106,.35);color:var(--gold-3)}

/* ---------- 游戏屏 ---------- */
#screen-play,#screen-drill{gap:0}
.hud{display:flex;align-items:center;gap:12px;padding:2px 0 12px}
.hud .back{
  background:none;border:1px solid var(--line);border-radius:9px;color:var(--ink-dim);
  font-family:inherit;font-size:13px;padding:7px 11px;cursor:pointer;letter-spacing:.1em;transition:.3s;
}
.hud .back:hover{color:var(--gold-2);border-color:var(--line-strong)}
.hud .stage{flex:1;min-width:0}
.hud .stage b{display:block;font-size:14px;letter-spacing:.18em;font-weight:700;color:#e6dcc7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .stage span{display:block;margin-top:3px;font-size:10.5px;letter-spacing:.2em;color:var(--ink-faint)}
.hearts{display:flex;gap:7px}
.hearts i{width:9px;height:9px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 10px rgba(201,168,106,.6);transition:.4s}
.hearts i.lost{background:transparent;border:1px solid rgba(201,168,106,.22);box-shadow:none;transform:rotate(45deg) scale(.8)}
.dscore{font-size:11px;letter-spacing:.16em;color:var(--gold-3);white-space:nowrap}
.bar{height:1px;background:rgba(201,168,106,.13);border-radius:2px;overflow:hidden;margin-bottom:clamp(16px,3.4vh,28px)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-3),var(--gold-2));transition:width .6s cubic-bezier(.2,.7,.2,1);box-shadow:0 0 10px rgba(201,168,106,.6)}

.qbox{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:clamp(30px,9vh,110px);animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.qtag{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:10.5px;letter-spacing:.28em;color:var(--gold-3);margin-bottom:13px}
.qtag::before{content:"";width:16px;height:1px;background:var(--gold-3)}
.qtitle{margin:0 0 6px;font-size:clamp(17px,4.4vw,21px);line-height:1.7;font-weight:700;letter-spacing:.05em;color:#efe6d2}
.qdesc{margin:0 0 18px;color:var(--ink-dim);font-size:12.5px;letter-spacing:.06em;line-height:1.8}

.opt{
  position:relative;text-align:center;padding:13px 10px;
  border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.022);
  color:#e2d9c7;font-size:clamp(12.5px,3.3vw,14.5px);line-height:1.5;letter-spacing:.03em;
  cursor:pointer;transition:border-color .25s,background .25s,color .25s,box-shadow .25s;
  min-height:52px;display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;
}
.opt:hover{border-color:rgba(201,168,106,.4);background:rgba(201,168,106,.055)}
.opt.sel{border-color:var(--gold);background:rgba(201,168,106,.13);color:var(--gold-2);box-shadow:0 0 22px -6px rgba(201,168,106,.5)}
.opt.done{color:var(--gold-2);border-color:rgba(201,168,106,.55);background:rgba(201,168,106,.075);opacity:.92}
.opt.done::after{content:"";position:absolute;right:9px;top:9px;width:5px;height:5px;transform:rotate(45deg);background:var(--gold)}
.opt.bad{border-color:rgba(168,52,42,.8);background:rgba(168,52,42,.12);color:#e5a49c}
.opt.ok{border-color:rgba(122,165,147,.75);background:rgba(122,165,147,.13);color:#cfe6da}

/* 连线 */
.matchwrap{position:relative;display:flex;flex-direction:column;justify-content:center;padding:6px 0;margin-top:6px}
.matchgrid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:11px clamp(24px,6.4vw,60px)}
.matchgrid svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.matchgrid svg path{
  fill:none;stroke:var(--gold);stroke-width:1.4;stroke-dasharray:600;stroke-dashoffset:600;
  animation:draw .55s ease forwards;filter:drop-shadow(0 0 5px rgba(201,168,106,.55));
}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* 排序 */
.seqwrap{display:flex;flex-direction:column;gap:16px;justify-content:center;margin-top:6px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.slot{
  min-height:50px;border:1px dashed rgba(201,168,106,.26);border-radius:11px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  color:var(--ink-faint);font-size:12px;letter-spacing:.12em;transition:.3s;padding:8px 6px;text-align:center;
}
.slot .n{color:var(--gold-3);font-size:10px}
.slot.filled{border-style:solid;border-color:rgba(201,168,106,.5);background:rgba(201,168,106,.08);color:#e8dfcb;cursor:pointer}
.slot.filled:hover{background:rgba(201,168,106,.14)}
.pool{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* 填空 */
.fillwrap{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;padding:8px 0;margin-top:6px}
.fillline{font-size:clamp(15px,4.1vw,19px);line-height:2;text-align:center;color:#e9e1cf;letter-spacing:.04em}
.fillline u{display:inline-block;min-width:104px;border-bottom:1px solid rgba(201,168,106,.5);text-decoration:none;margin:0 6px}
#fillInput{
  width:min(330px,84%);padding:13px 16px;text-align:center;
  background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:11px;
  color:var(--gold-2);font-family:inherit;font-size:17px;letter-spacing:.16em;outline:none;transition:.3s;
}
#fillInput:focus{border-color:var(--gold);box-shadow:0 0 24px -6px rgba(201,168,106,.5);background:rgba(201,168,106,.06)}
#fillInput::placeholder{color:var(--ink-faint);letter-spacing:.08em;font-size:13px}
.btn{
  font-family:inherit;font-size:13px;letter-spacing:.24em;text-indent:.24em;padding:12px 24px;border-radius:11px;cursor:pointer;
  border:1px solid var(--line-strong);color:var(--gold-2);
  background:linear-gradient(160deg,rgba(201,168,106,.16),rgba(201,168,106,.04));transition:.3s;
}
.btn:hover{background:linear-gradient(160deg,rgba(201,168,106,.28),rgba(201,168,106,.08));box-shadow:0 0 26px -8px rgba(201,168,106,.7)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink-dim)}
.btn.ghost:hover{color:var(--gold-2);border-color:var(--line-strong);box-shadow:none}
.btn.mini{font-size:11.5px;padding:8px 14px;letter-spacing:.14em;text-indent:.14em}

/* 选择 */
.choices{display:flex;flex-direction:column;gap:10px;justify-content:center;margin-top:14px}
.choices .opt{justify-content:flex-start;text-align:left;padding:14px 16px;min-height:54px}
.choices .opt .k{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1px solid rgba(201,168,106,.35);display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--gold-3);margin-right:12px;transition:.25s}
.choices .opt.sel .k{border-color:var(--gold);color:var(--gold-2)}

/* 训练 */
.hintRow{display:flex;align-items:center;gap:12px;margin:14px 0 2px;flex-wrap:wrap}
.hintText{color:var(--gold-3);font-size:12px;letter-spacing:.06em;line-height:1.7;animation:rise .35s both}

/* 反馈 */
.toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  max-width:min(560px,90vw);padding:13px 20px;border-radius:12px;border:1px solid var(--line-strong);
  background:rgba(14,13,10,.94);backdrop-filter:blur(10px);
  color:#e9e1cf;font-size:13px;line-height:1.75;letter-spacing:.03em;text-align:center;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.9);
  opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.7,.2,1);z-index:40;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{border-color:rgba(122,165,147,.6)}
.toast.bad{border-color:rgba(168,52,42,.7)}
.toast b{color:var(--gold-2);font-weight:700}

/* 开卷过场 */
.veil{
  position:fixed;inset:0;z-index:100;pointer-events:none;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 46%, #17130d 0%, #08090b 72%);transition:opacity .65s ease;
}
.veil.out{opacity:0}
.veil-in{text-align:center}
.veil-in span{display:block;font-size:11px;letter-spacing:.52em;text-indent:.52em;color:var(--gold-3);margin-bottom:16px}
.veil-in b{
  display:block;font-size:clamp(28px,7.6vw,42px);font-weight:700;letter-spacing:.3em;text-indent:.3em;
  background:linear-gradient(178deg,#f6ecd4,#d5b981 55%,#8f7442);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 20px rgba(201,168,106,.25));
}
.veil-in i{display:block;width:56px;height:1px;margin:20px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* 确认弹层 */
.modal{
  position:fixed;inset:0;z-index:200;background:rgba(4,4,6,.78);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.modal.on{opacity:1;pointer-events:auto}
.modalBox{
  width:100%;max-width:340px;border:1px solid var(--line-strong);border-radius:14px;
  background:linear-gradient(160deg,#171310,#0f0d0a);padding:22px 20px;text-align:center;
  box-shadow:0 30px 80px -30px #000;
}
.modalBox p{margin:0 0 18px;color:#e2d8c4;font-size:13.5px;line-height:1.9;letter-spacing:.05em}
.modalBox .row{display:flex;gap:10px}
.modalBox .row .btn{flex:1;padding:11px 0;font-size:12px}

/* 结算 */
#screen-end{align-items:center;justify-content:center;text-align:center}
.result{width:100%;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.result .mini{font-size:11px;letter-spacing:.4em;color:var(--gold-3);margin-bottom:14px}
.result h2{
  margin:0 0 10px;font-size:clamp(25px,6.6vw,34px);font-weight:700;letter-spacing:.2em;text-indent:.2em;
  background:linear-gradient(178deg,#f6ecd4,#cfae6e 55%,#8f7442);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.result .line{margin:0 0 22px;color:var(--ink-dim);font-size:13px;letter-spacing:.14em;line-height:1.9}
.stars{display:flex;justify-content:center;gap:12px;margin:0 0 24px}
.stars i{width:13px;height:13px;display:block;transform:rotate(45deg);border:1px solid var(--gold-3);transition:.5s}
.stars i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 16px rgba(201,168,106,.8);transform:rotate(45deg) scale(1.1)}
.review{
  text-align:left;border:1px solid var(--line);border-radius:13px;padding:15px 16px;
  background:rgba(255,255,255,.02);margin-bottom:22px;max-height:34vh;overflow:auto;
}
.review h4{margin:0 0 9px;font-size:11px;letter-spacing:.28em;color:var(--gold-3);font-weight:400}
.review .item{padding:8px 0;border-top:1px solid rgba(201,168,106,.10);font-size:12.5px;line-height:1.8;color:var(--ink-dim)}
.review .item:first-of-type{border-top:0}
.review .item b{color:#e2d8c4;font-weight:400}
.review .item span{color:var(--gold-3)}
.review .empty{color:var(--jade);font-size:12.5px;letter-spacing:.08em}
.actions{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}

@media (max-width:430px){
  .matchgrid{gap:9px 22px}
  .opt{padding:11px 8px;font-size:12px}
  .slots,.pool{gap:7px}
  .slot{font-size:11px;min-height:46px}

/* ==========================================================
   三、工具
   ========================================================== */
const $ = (s)=>document.querySelector(s);
const $$ = (s)=>Array.from(document.querySelectorAll(s));
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function norm(s){
  return String(s||"").toLowerCase()
    .replace(/[\s《》〈〉「」“”"'‘’·,，。.、;；:：!！?？\-—_（）()\u3000]/g,"").trim();
}
function esc(s){
  return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

const SAVE_KEY = "qihuang.wendao.v2";
let save = {unlocked:1,best:{},drillKnown:{1:[],2:[],3:[]}};
try{
  const raw = localStorage.getItem(SAVE_KEY);
  if(raw){
    const o = JSON.parse(raw);
    if(o && typeof o === "object"){
      save = Object.assign(save,o);
      save.best = save.best || {};
      save.drillKnown = save.drillKnown || {1:[],2:[],3:[]};
    }
  }
}catch(e){}
function persist(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){}
}

let modalYesFn = null;
function ask(text, onYes){
  $("#modalText").textContent = text;
  modalYesFn = onYes;
  $("#modal").classList.add("on");
}
function closeModal(){ $("#modal").classList.remove("on"); modalYesFn = null; }
$("#modalNo").addEventListener("click", closeModal);
$("#modalYes").addEventListener("click", ()=>{ const f = modalYesFn; closeModal(); if(f) f(); });
$("#modal").addEventListener("click", (e)=>{ if(e.target.id === "modal") closeModal(); });

function toast(msg, kind, dur){
  const t = $("#toast");
  t.className = "toast" + (kind ? " "+kind : "");
  t.innerHTML = msg;
  requestAnimationFrame(()=>t.classList.add("show"));
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.classList.remove("show"); }, dur || 1500);
}
function show(name){
  $$(".screen").forEach(s=>s.classList.remove("active"));
  $("#screen-"+name).classList.add("active");
}
function veil(title, kicker){
  const v = document.createElement("div");
  v.className = "veil";
  v.innerHTML = `<div class="veil-in"><span>${kicker}</span><b>${title}</b><i></i></div>`;
  document.body.appendChild(v);
  setTimeout(()=>{ v.classList.add("out"); }, 620);
  setTimeout(()=>{ v.remove(); }, 1400);
}

function renderLevels(){
  const box = $("#levelList");
  box.innerHTML = "";
  LEVELS.forEach((lv)=>{
    const locked = lv.id > save.unlocked;
    const best = save.best[lv.id] || 0;
    const el = document.createElement("div");
    el.className = "level" + (locked ? " locked" : "");
    let stars = "";
    for(let i=0;i<3;i++) stars += `<i class="${i<best?"on":""}"></i>`;
    el.innerHTML = `
      <div class="head">
        <span class="num">卷${["一","二","三"][lv.id-1]}</span>
        <h3>${lv.name.split(" · ")[1]}</h3>
        <span class="tag">${locked ? "未解锁" : "入卷 ›"}</span>
      </div>
      <p class="meta">${esc(lv.sub)}<br><em>${esc(lv.desc)}</em></p>
      <div class="stars">${stars}</div>
    `;
    if(!locked) el.addEventListener("click", ()=>startLevel(lv.id));
    else el.addEventListener("click", ()=>toast("前一卷通关，方可解锁","",1600));
    box.appendChild(el);
  });

  const txt = (save.best[1] && save.best[2] && save.best[3])
    ? "三卷俱通 · 可为医"
    : (save.best[1] ? (save.best[2] ? "卷二已过 · 可挑战贯通" : "已通卷一 · 续读明清") : "尚未入门 —— 先从卷一始");
  $("#progressText").textContent = txt;
}

function renderDrills(){
  const box = $("#drillList");
  box.innerHTML = "";
  [1,2,3].forEach(t=>{
    const items = KB.filter(k=>t === 3 ? true : k.t === t);
    const known = (save.drillKnown[t] || []).filter(id=>items.some(k=>k.id === id)).length;
    const pct = items.length ? Math.round(known/items.length*100) : 0;
    const el = document.createElement("div");
    el.className = "level";
    el.innerHTML = `
      <div class="head">
        <span class="num">卷${["一","二","三"][t-1]}</span>
        <h3>${["肇基","集成","贯通"][t-1]}</h3>
        <span class="tag">练 习 ›</span>
      </div>
      <p class="meta">共 ${items.length} 条 · 已掌握 <em>${known}</em> 条</p>
      <div class="bar" style="margin:10px 0 0;height:2px"><i style="width:${pct}%"></i></div>
    `;
    el.addEventListener("click", ()=>startDrill(t));
    box.appendChild(el);
  });
}

/* ---------- 背诵 ---------- */
const MEM = {tier:1};
function renderMem(){
  const segs = $("#memSegs");
  segs.innerHTML = [1,2,3].map(t=>
    `<button data-t="${t}" class="${MEM.tier===t?"on":""}">卷${["一","二","三"][t-1]}</button>`
  ).join("");
  segs.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{ MEM.tier = Number(b.dataset.t); renderMem(); });
  });

  const items = KB.filter(k=>MEM.tier === 3 ? true : k.t === MEM.tier);
  let html = "", lastEra = null;
  items.forEach(k=>{
    if(k.era !== lastEra){
      html += `<div class="memEra">${esc(k.era)}</div>`;
      lastEra = k.era;
    }
    const name = k.book || k.author;
    const person = k.author
      ? [k.author, k.zi ? "字"+k.zi : "", k.hao ? "号"+k.hao : ""].filter(Boolean).join(" · ")
      : "";
    html += `<div class="memItem">
      <div class="b">${esc(name)}</div>
      ${person ? `<div class="p">${esc(person)}</div>` : ""}
      <div class="s">${esc(k.status)}</div>
      ${k.note ? `<div class="z">${esc(k.note)}</div>` : ""}
    </div>`;
  });
  $("#memList").innerHTML = html;
}

function pickQuestions(pool, n){

  const out = [];
  ["match","sequence","fill","choice"].forEach(type=>{
    if(out.length >= n) return;
    const i = rest.findIndex(q=>q.type === type);
    if(i >= 0) out.push(rest.splice(i,1)[0]);
  });
  while(out.length < n && rest.length){
    out.push(rest.splice(Math.floor(Math.random()*rest.length),1)[0]);
  }
  return shuffle(out).slice(0,n);
}

function startLevel(id){
  const lv = LEVELS.find(l=>l.id === id);
  S.level = id;
  S.list = pickQuestions(lv.pool, TOTAL_Q);
  S.idx = 0;
  S.hearts = MAX_HEARTS;
  S.wrong = [];
  S.locked = false;
  $("#stageName").textContent = lv.name;
  show("play");
  renderHearts();
  renderQuestion();
  veil(lv.name.split(" · ")[1], "第 " + ["一","二","三"][id-1] + " 卷");
}

function renderHearts(){
  const h = $("#hearts");
  h.innerHTML = "";
  for(let i=0;i<MAX_HEARTS;i++){
    const d = document.createElement("i");
    if(i >= S.hearts) d.className = "lost";
    h.appendChild(d);
  }
}

function updateProgress(){
  $("#stageSub").textContent = `第 ${Math.min(S.idx+1,TOTAL_Q)} / ${TOTAL_Q} 题`;
  $("#barFill").style.width = `${(S.idx/TOTAL_Q)*100}%`;
}

function loseHeart(){
  S.hearts--;
  renderHearts();
  if(S.hearts <= 0){ endGame(false); return true; }
  return false;
}

function nextQuestion(){
  if(S.idx >= S.list.length - 1){ S.idx = S.list.length; endGame(true); return; }
  S.idx++;
  renderQuestion();
}

function renderQuestion(){
  if(S.idx >= S.list.length){ endGame(true); return; }
  S.locked = false;
  updateProgress();
  const q = S.list[S.idx];
  const box = $("#qbox");
  box.innerHTML = "";
  const tag = document.createElement("div");
  tag.className = "qtag";
  tag.textContent = q.tag || "答题";
  box.appendChild(tag);

  const TIPS = {match:"先点左侧一项，再点右侧对应项", sequence:"按先后顺序，依次点选卡片落位"};

  if(q.type !== "fill"){
    const h = document.createElement("h2");
    h.className = "qtitle";
    h.textContent = q.prompt;
    box.appendChild(h);
    if(TIPS[q.type]){
      const d = document.createElement("p");
      d.className = "qdesc";
      d.textContent = TIPS[q.type];
      box.appendChild(d);
    }
  }

  if(q.type === "match") renderMatch(q, box);
  else if(q.type === "sequence") renderSequence(q, box);
  else if(q.type === "fill") renderFill(q, box);
  else renderChoice(q, box);
}

/* ---------- 连线 ---------- */
function renderMatch(q, box){
  const pairs = shuffle(q.pairs).slice(0, Math.min(4, q.pairs.length));
  const leftOrder = shuffle(pairs.map((_,i)=>i));
  const rightOrder = shuffle(pairs.map((_,i)=>i));
  const total = pairs.length;

  const wrap = document.createElement("div");
  wrap.className = "matchwrap";
  const grid = document.createElement("div");
  grid.className = "matchgrid";
  grid.id = "matchGrid";
  grid.innerHTML = `<svg id="matchSvg"></svg>`;
  const colL = document.createElement("div");
  colL.style.cssText = "display:flex;flex-direction:column;gap:11px";
  const colR = document.createElement("div");
  colR.style.cssText = "display:flex;flex-direction:column;gap:11px";

  leftOrder.forEach((idx)=>{
    const b = document.createElement("div");
    b.className = "opt"; b.dataset.side = "l"; b.dataset.i = idx;
    b.textContent = pairs[idx].l;
    colL.appendChild(b);
  });
  rightOrder.forEach((idx)=>{
    const b = document.createElement("div");
    b.className = "opt"; b.dataset.side = "r"; b.dataset.i = idx;
    b.textContent = pairs[idx].r;
    colR.appendChild(b);
  });
  grid.appendChild(colL);
  grid.appendChild(colR);
  wrap.appendChild(grid);
  box.appendChild(wrap);

  let selL = null, matched = 0;
  const donePairs = [];

  function drawLines(){
    const svg = $("#matchSvg");
    if(!svg) return;
    const g = $("#matchGrid").getBoundingClientRect();
    svg.setAttribute("viewBox", `0 0 ${g.width} ${g.height}`);
    svg.innerHTML = "";
    donePairs.forEach(([li])=>{
      const a = grid.querySelector(`[data-side="l"][data-i="${li}"]`);
      const b = grid.querySelector(`[data-side="r"][data-i="${li}"]`);
      if(!a || !b) return;
      const ar = a.getBoundingClientRect(), br = b.getBoundingClientRect();
      const x1 = ar.right - g.left, y1 = ar.top + ar.height/2 - g.top;
      const x2 = br.left - g.left, y2 = br.top + br.height/2 - g.top;
      const mx = (x1+x2)/2;
      const p = document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("d", `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
      svg.appendChild(p);
    });
  }
  const onResize = ()=>{ if(document.body.contains(grid)) drawLines(); else window.removeEventListener("resize", onResize); };
  window.addEventListener("resize", onResize);

  grid.addEventListener("click", (e)=>{
    if(S.locked) return;
    const t = e.target.closest(".opt");
    if(!t || t.classList.contains("done")) return;
    const side = t.dataset.side;

    if(side === "l"){
      if(selL) selL.classList.remove("sel");
      selL = t; t.classList.add("sel");
      return;
    }
    if(!selL){
      t.classList.add("bad");
      setTimeout(()=>t.classList.remove("bad"), 430);
      return;
    }
    const li = Number(selL.dataset.i), ri = Number(t.dataset.i);
    if(li === ri){
      selL.classList.remove("sel");
      selL.classList.add("done");
      t.classList.add("done");
      donePairs.push([li]);
      selL = null;
      matched++;
      drawLines();
      if(matched === total){
        S.locked = true;
        setTimeout(()=>{
          toast(`<b>${total}</b> 对，全部连上了`, "good", 1100);
          setTimeout(nextQuestion, 700);
        }, 340);
      }
    }else{
      t.classList.add("bad");
      selL.classList.add("bad");
      const a = selL;
      setTimeout(()=>{ t.classList.remove("bad"); a.classList.remove("bad"); a.classList.remove("sel"); }, 440);
      selL = null;
      const dead = loseHeart();
      if(!dead) toast("这一对不上，再想想", "bad", 1300);
    }
  });
}

/* ---------- 排序 ---------- */
function renderSequence(q, box){
  const answer = q.items;
  const pool = shuffle(answer);
  const n = answer.length;

  const wrap = document.createElement("div");
  wrap.className = "seqwrap";
  const slots = document.createElement("div");
  slots.className = "slots";
  const poolEl = document.createElement("div");
  poolEl.className = "pool";
  wrap.appendChild(slots); wrap.appendChild(poolEl);
  box.appendChild(wrap);

  const placed = new Array(n).fill(null);

  function paint(){
    slots.innerHTML = "";
    for(let i=0;i<n;i++){
      const s = document.createElement("div");
      s.className = "slot" + (placed[i] ? " filled" : "");
      if(placed[i]){
        s.innerHTML = `<span class="n">${i+1}</span>${esc(placed[i])}`;
        s.addEventListener("click", ()=>{
          if(S.locked) return;
          placed[i] = null;
          paint();
        });
      }else{
        s.innerHTML = `<span class="n">${i+1}</span>`;
      }
      slots.appendChild(s);
    }
    poolEl.innerHTML = "";
    pool.forEach((it)=>{
      const used = placed.includes(it);
      const b = document.createElement("div");
      b.className = "opt" + (used ? " done" : "");
      b.textContent = it;
      if(!used){
        b.addEventListener("click", ()=>{
          if(S.locked) return;
          if(placed.includes(it)) return;
          const k = placed.indexOf(null);
          if(k < 0) return;
          placed[k] = it;
          paint();
          if(placed.every(Boolean)) check();
        });
      }
      poolEl.appendChild(b);
    });
  }

  function check(){
    if(placed.some(v=>!v)) return;
    const ok = placed.every((v,i)=>v === answer[i]);
    if(ok){
      S.locked = true;
      toast("年代排对了", "good", 1100);
      setTimeout(nextQuestion, 800);
    }else{
      const firstBad = placed.findIndex((v,i)=>v !== answer[i]);
      const cur = slots.children[firstBad];
      if(cur){ cur.style.borderColor = "rgba(168,52,42,.85)"; cur.style.background = "rgba(168,52,42,.12)"; cur.style.color = "#e5a49c"; }
      S.wrong.push({prompt:"排序：「" + answer.join(" → ") + "」", ans:q.why || "", why:""});
      const dead = loseHeart();
      if(!dead){
        toast("第 <b>"+(firstBad+1)+"</b> 位不对，再排一次", "bad", 1500);
        setTimeout(()=>{ placed.fill(null); paint(); }, 950);
      }
    }
  }

  paint();
}

/* ---------- 填空 ---------- */
function renderFill(q, box){
  const wrap = document.createElement("div");
  wrap.className = "fillwrap";
  const promptHtml = esc(q.prompt).replace(/_{3,}/g, "<u></u>");
  wrap.innerHTML = `
    <div class="fillline">${promptHtml}</div>
    <input id="fillInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="写下答案" />
    <button class="btn" id="fillGo">落 笔</button>
  `;
  box.appendChild(wrap);
  const input = $("#fillInput");
  const go = $("#fillGo");

  function submit(){
    if(S.locked) return;
    const v = norm(input.value);
    if(!v){ input.focus(); return; }
    const ok = q.answer.some(a=>norm(a) === v);
    if(ok){
      S.locked = true;
      input.style.borderColor = "rgba(122,165,147,.8)";
      input.style.color = "#cfe6da";
      toast("答对了 —— " + q.answer[0], "good", 1200);
      setTimeout(nextQuestion, 950);
    }else{
      input.style.borderColor = "rgba(168,52,42,.85)";
      setTimeout(()=>{ input.style.borderColor = ""; }, 700);
      S.wrong.push({prompt:q.prompt, ans:q.answer[0], why:""});
      const dead = loseHeart();
      if(!dead){
        toast("还差一点，再想" + (q.hint ? "（" + esc(q.hint) + "）" : ""), "bad", 1300);
        input.select();
      }
    }
  }
  go.addEventListener("click", submit);
  input.addEventListener("keydown", (e)=>{ if(e.key === "Enter") submit(); });
  setTimeout(()=>{ if(window.innerWidth > 760) input.focus(); }, 300);
}

/* ---------- 选择 ---------- */
function renderChoice(q, box){
  const wrap = document.createElement("div");
  wrap.className = "choices";
  const keys = ["甲","乙","丙","丁","戊","己"];
  q.options.forEach((op,i)=>{
    const b = document.createElement("div");
    b.className = "opt";
    b.innerHTML = `<span class="k">${keys[i]}</span><span>${esc(op)}</span>`;
    b.addEventListener("click", ()=>{
      if(S.locked) return;
      if(i === q.answer){
        b.classList.add("ok");
        S.locked = true;
        toast(q.why ? esc(q.why) : "答对了", "good", q.why ? 1900 : 1100);
        setTimeout(nextQuestion, q.why ? 1650 : 900);
      }else{
        b.classList.add("bad");
        S.wrong.push({prompt:q.prompt, ans:q.options[q.answer], why:q.why||""});
        const dead = loseHeart();
        if(!dead){
          toast("不对。正解是「" + esc(q.options[q.answer]) + "」", "bad", 1700);
          setTimeout(()=>b.classList.remove("bad"), 600);
          S.locked = true;
          setTimeout(nextQuestion, 1700);
        }
      }
    });
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
}

/* ---------- 闯关结算 ---------- */
function endGame(passed){
  $("#barFill").style.width = "100%";
  const lv = LEVELS.find(l=>l.id === S.level);

  if(!passed){
    $("#endMini").textContent = "卷 " + ["一","二","三"][S.level-1];
    $("#endTitle").textContent = "元气散尽";
    $("#endLine").textContent = "别急，先回到卷首，把这几页再念一遍。";
    $("#endStars").innerHTML = "";
  }else{
    const stars = S.hearts === MAX_HEARTS ? 3 : (S.hearts >= 2 ? 2 : 1);
    save.best[S.level] = Math.max(save.best[S.level]||0, stars);
    if(S.level === save.unlocked && save.unlocked < 3) save.unlocked = S.level + 1;
    persist();
    $("#endMini").textContent = "卷 " + ["一","二","三"][S.level-1];
    $("#endTitle").textContent = stars === 3 ? "通 关" : "过 卷";
    $("#endLine").textContent = stars === 3
      ? `满元气通过 · ${lv.name.split(" · ")[1]}`
      : `剩余元气 ${S.hearts} · 可再刷满星`;
    $("#endStars").innerHTML = [0,1,2].map(i=>`<i class="${i<stars?"on":""}"></i>`).join("");
  }

  const rv = $("#review");
  if(S.wrong.length){
    rv.innerHTML = `<h4>错 处 记 下</h4>` + S.wrong.map(w=>
      `<div class="item"><b>${esc(w.prompt)}</b><br>正解：<span>${esc(w.ans)}</span>${w.why?`<br>${esc(w.why)}`:""}</div>`
    ).join("");
  }else if(passed){
    rv.innerHTML = `<h4>错 处 记 下</h4><div class="empty">一题未错，心手相应。</div>`;
  }else{
    rv.innerHTML = "";
  }

  const acts = $("#endActions");
  acts.innerHTML = "";
  const again = document.createElement("button");
  again.className = "btn"; again.textContent = "再 来 一 卷";
  again.onclick = ()=>startLevel(S.level);
  acts.appendChild(again);
  if(passed && S.level < 3 && save.unlocked > S.level){
    const nx = document.createElement("button");
    nx.className = "btn"; nx.textContent = "下 一 卷";
    nx.onclick = ()=>startLevel(S.level+1);
    acts.appendChild(nx);
  }
  const home = document.createElement("button");
  home.className = "btn ghost"; home.textContent = "回 卷 首";
  home.onclick = ()=>{ renderLevels(); renderDrills(); show("home"); };
  acts.appendChild(home);

  show("end");
}

/* ==========================================================
   八、训练
   ========================================================== */
const D = {tier:1, queue:[], retry:[], idx:0, known:0, hinted:false, locked:false, cur:null};

function startDrill(tier){
  D.tier = tier;
  D.queue = shuffle(KB.filter(k=>tier === 3 ? true : k.t === tier));
  D.retry = [];
  D.idx = 0;
  D.known = 0;
  D.locked = false;
  $("#drillName").textContent = "训练 · 卷" + ["一","二","三"][tier-1];
  show("drill");
  renderDrill();
  veil(["肇基","集成","贯通"][tier-1], "训 练");
}

function buildOptions(ans, field, tier){
  const same = [], all = [];
  KB.forEach(k=>{
    const v = k[field];
    if(!v || v === ans) return;
    if(!all.includes(v)) all.push(v);
    if(k.t === tier && !same.includes(v)) same.push(v);
  });
  let pick = shuffle(same).slice(0,3);
  if(pick.length < 3){
    const rest = shuffle(all.filter(v=>!pick.includes(v)));
    pick = pick.concat(rest.slice(0, 3-pick.length));
  }
  const options = shuffle([ans].concat(pick));
  return {options, answer: options.indexOf(ans)};
}

function makeDrillQ(item){
  /* 核心方向：书↔人、书↔地位、人↔地位；字号/号作补充 */
  const core = [];
  if(item.book && item.author) core.push("b2a","a2b");
  if(item.book && item.status) core.push("b2s");
  if(item.author && item.status) core.push("a2s");
  if(!core.length) return null;

  let dir = core[Math.floor(Math.random()*core.length)];
  const extras = [];
  if(item.author && item.zi) extras.push("a2z");
  if(item.author && item.hao) extras.push("a2h");
  if(extras.length && Math.random() < 0.34) dir = extras[Math.floor(Math.random()*extras.length)];

  let ask, field, hint;
  if(dir === "b2a"){
    ask = `${item.book}的作者是？`;
    field = "author";
    hint = `${item.era} · 姓「${item.author[0]}」`;
  }else if(dir === "a2b"){
    ask = `${item.author}的代表著作是？`;
    field = "book";
    hint = `${item.era} · ${item.status}`;
  }else if(dir === "b2s"){
    ask = `${item.book}在中医学史上的地位是？`;
    field = "status";
    hint = (item.author ? item.author + " · " : "") + (item.note || "");
  }else if(dir === "a2s"){
    ask = `${item.author}的主张是？`;
    field = "status";
    hint = `${item.era} · ${item.note || ""}`;
  }else if(dir === "a2z"){
    ask = `${item.author}，字？`;
    field = "zi";
    hint = `${item.era} · ${item.hao ? "号" + item.hao : item.status}`;
  }else{
    ask = `${item.author}，号？`;
    field = "hao";
    hint = `${item.era} · 字${item.zi}`;
  }

  const built = buildOptions(item[field], field, item.t);
  return {ask, hint, item, options: built.options, answer: built.answer, field};
}

function addRetry(item){
  if(!D.retry.some(k=>k.id === item.id)) D.retry.push(item);
}
function markKnown(tier, item){
  const arr = save.drillKnown[tier] || (save.drillKnown[tier] = []);
  if(!arr.includes(item.id)){ arr.push(item.id); persist(); }
}

function renderDrill(){
  if(D.idx >= D.queue.length){ endDrill(); return; }
  D.locked = false;
  D.hinted = false;

  const item = D.queue[D.idx];
  const q = makeDrillQ(item);
  if(!q){ D.idx++; renderDrill(); return; }
  D.cur = q;

  $("#drillSub").textContent = `第 ${D.idx+1} / ${D.queue.length} 条`;
  $("#drillBar").style.width = `${(D.idx/D.queue.length)*100}%`;
  $("#drillScore").textContent = `✓ ${D.known}`;

  const box = $("#drillBox");
  box.innerHTML = "";
  const tag = document.createElement("div");
  tag.className = "qtag";
  tag.textContent = "训练 · 先想，再点";
  box.appendChild(tag);

  const h = document.createElement("h2");
  h.className = "qtitle";
  h.textContent = q.ask;
  box.appendChild(h);

  const hintRow = document.createElement("div");
  hintRow.className = "hintRow";
  hintRow.innerHTML = `<button class="btn ghost mini" id="hintBtn">看 提 示</button><span class="hintText" id="hintText"></span>`;
  box.appendChild(hintRow);

  const wrap = document.createElement("div");
  wrap.className = "choices";
  const keys = ["甲","乙","丙","丁","戊","己"];
  q.options.forEach((op,i)=>{
    const b = document.createElement("div");
    b.className = "opt";
    b.innerHTML = `<span class="k">${keys[i]}</span><span>${esc(op)}</span>`;
    b.addEventListener("click", ()=>answerDrill(b, i, wrap));
    wrap.appendChild(b);
  });
  box.appendChild(wrap);

  $("#hintBtn").addEventListener("click", ()=>{
    if(D.locked) return;
    D.hinted = true;
    const ht = $("#hintText");
    ht.textContent = q.hint || item.status;
    addRetry(item);
    $("#hintBtn").style.display = "none";
  });
}

function answerDrill(el, i, wrap){
  if(D.locked) return;
  const q = D.cur;
  if(i === q.answer){
    el.classList.add("ok");
    D.locked = true;
    if(!D.hinted){
      D.known++;
      markKnown(D.tier, q.item);
      toast("答对了", "good", 800);
    }else{
      addRetry(q.item);
      toast("对了，但看过提示 —— 这条末尾再考一遍", "", 1300);
    }
    $("#drillScore").textContent = `✓ ${D.known}`;
    setTimeout(()=>{ D.idx++; renderDrill(); }, 900);
  }else{
    el.classList.add("bad");
    D.locked = true;
    addRetry(q.item);
    const opts = Array.from(wrap.querySelectorAll(".opt"));
    if(opts[q.answer]) opts[q.answer].classList.add("ok");
    toast("正解：" + esc(q.options[q.answer]), "bad", 1600);
    setTimeout(()=>{ D.idx++; renderDrill(); }, 1750);
  }
}

function endDrill(){
  const total = D.queue.length;
  const retry = D.retry.slice();
  const title = "训练 · 卷" + ["一","二","三"][D.tier-1];

  $("#endMini").textContent = title;
  $("#endTitle").textContent = retry.length === 0 ? "过 了" : "记 下";
  $("#endLine").textContent = `本轮 ${total} 条 · 一次答对 ${D.known} 条 · 待重考 ${retry.length} 条`;
  $("#endStars").innerHTML = "";

  const rv = $("#review");
  if(retry.length){
    rv.innerHTML = `<h4>待 重 考</h4>` + retry.map(k=>{
      const name = k.book || k.author;
      const person = k.author ? k.author + (k.zi ? " · 字"+k.zi : "") : "";
      return `<div class="item"><b>${esc(name)}</b>${person ? `<br><span>${esc(person)}</span>` : ""}<br>${esc(k.status)}</div>`;
    }).join("");
  }else{
    rv.innerHTML = `<h4>待 重 考</h4><div class="empty">一条不剩，这一卷过关了。</div>`;
  }

  const acts = $("#endActions");
  acts.innerHTML = "";
  if(retry.length){
    const again = document.createElement("button");
    again.className = "btn";
    again.textContent = `再 考 一 轮（${retry.length}）`;
    again.onclick = ()=>{
      D.queue = shuffle(retry);
      D.retry = [];
      D.idx = 0;
      D.known = 0;
      show("drill");
      renderDrill();
    };
    acts.appendChild(again);
  }
  const re = document.createElement("button");
  re.className = "btn" + (retry.length ? " ghost" : "");
  re.textContent = "重 练 一 遍";
  re.onclick = ()=>startDrill(D.tier);
  acts.appendChild(re);

  const home = document.createElement("button");
  home.className = "btn ghost"; home.textContent = "回 卷 首";
  home.onclick = ()=>{ renderLevels(); renderDrills(); renderMem(); show("home"); };
  acts.appendChild(home);

  show("end");
}

   九、绑定
   ========================================================== */

$("#drillBack").addEventListener("click", ()=>{

$("#btnReset").addEventListener("click", ()=>{
  ask("清空所有通关进度与训练记录？", ()=>{
    save = {unlocked:1,best:{},drillKnown:{1:[],2:[],3:[]}};
    persist();
    renderLevels(); renderDrills(); renderMem();
    toast("进度已清空","",1200);
  });
});

renderLevels();
renderDrills();
renderMem();

/* 预览入口：index.html#play1 / #play2 / #play3 */
(function(){
  const h = location.hash || "";
  if(h.indexOf("#play") === 0){
    const n = Number(h.replace("#play","")) || 1;
    if(n >= 1 && n <= 3) startLevel(n);
  }
  if(h === "#drilltab") document.querySelector('#tabs button[data-tab="drill"]').click();
  if(h === "#memtab") document.querySelector('#tabs button[data-tab="mem"]').click();
  if(h === "#train1") startDrill(1);
  if(h === "#train2") startDrill(2);
})();

</script>
