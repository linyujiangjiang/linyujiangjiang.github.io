<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>杏林问诊 · 四诊辨证</title>
<style>
  :root{
    --ink:#2a2219;
    --ink2:#4c4033;
    --ink3:#7a6a51;
    --edge:#8b7350;
    --edge2:#b8a075;
    --zhu:#a83024;
    --zhu-l:#c9503a;
    --gold:#c9a25c;
    --jade:#4a6b5e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html.nofx *,html.nofx *::before{animation:none!important;transition:none!important}
  html,body{height:100%;overflow:hidden;background:#0d0b08;touch-action:manipulation;
    font-family:"KaiTi","STKaiti","Kaiti SC","Songti SC","SimSun",serif;
    -webkit-font-smoothing:antialiased;user-select:none}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center center;overflow:hidden;background:#000}

  /* ---------- 场景 ---------- */
  .scene{position:absolute;inset:0}
  .scene img{position:absolute;inset:0;width:100%;height:100%;display:block;
    image-rendering:pixelated;-webkit-user-drag:none}
  #patient{opacity:0;transition:opacity .5s ease;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
  #patient.in{opacity:1}
  /* 立绘：站在诊桌后，被桌面层挡住腰部 */
  #portrait{position:absolute;left:748px;top:4px;width:673px;height:970px;
    opacity:0;transition:opacity .55s ease;pointer-events:none;
    filter:drop-shadow(0 16px 28px rgba(18,12,6,.42))}
  #portrait.in{opacity:1}
  #hot{position:absolute;inset:0;width:100%;height:100%}
  .hot{fill:rgba(255,225,150,0);cursor:pointer;transition:fill .12s}
  .hot:hover{fill:rgba(255,215,130,.14)}
  .hot.on{stroke:#f0cf8c;stroke-width:.8;stroke-dasharray:2 1.6;
    fill:rgba(255,215,130,.07)}
  /* 脉枕在桌面上，不像"身上的一部分"，给它一点常驻的呼吸提示 */
  .hot[data-part="pulse"]:not(.on):not(:hover):not(.done){
    stroke:rgba(240,207,140,.55);stroke-width:.4;stroke-dasharray:2.4 2.4;
    animation:pulseHint 2.8s ease-in-out infinite}
  @keyframes pulseHint{0%,100%{stroke-opacity:.18}50%{stroke-opacity:.85}}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse 62% 66% at 50% 46%,
        rgba(0,0,0,0) 40%, rgba(12,8,4,.46) 82%, rgba(12,8,4,.66) 100%),
      linear-gradient(180deg, rgba(12,8,4,.30) 0%, rgba(12,8,4,0) 26%,
        rgba(12,8,4,0) 62%, rgba(12,8,4,.42) 100%);
  }

  /* ---------- 纸面 ---------- */
  .paper{
    background:linear-gradient(178deg,#f6efdc 0%,#eee2c6 46%,#e2d3b0 100%);
    border:3px solid var(--edge);
    box-shadow:inset 0 0 0 3px rgba(255,250,235,.6),
               inset 0 0 0 5px rgba(160,135,95,.2),
               0 16px 40px rgba(0,0,0,.6);
  }

  /* ---------- 顶栏 ---------- */
  #topbar{position:absolute;left:0;top:0;width:1200px;height:520px;padding:34px 0 0 62px;
    pointer-events:none;
    background:
      radial-gradient(ellipse 880px 400px at 40px 0px,
        rgba(10,8,5,.93) 0%, rgba(10,8,5,.80) 32%,
        rgba(10,8,5,.44) 58%, rgba(10,8,5,.12) 80%, rgba(10,8,5,0) 100%)}
  #topbar .brand{font-size:41px;letter-spacing:.3em;color:#f7edd5;
    text-shadow:0 3px 14px rgba(0,0,0,.8)}
  #topbar .brand em{font-style:normal;color:var(--gold);font-size:24px;
    letter-spacing:.22em;margin-left:16px;vertical-align:3px;opacity:.95}
  #topbar .who{margin-top:16px;font-size:23px;letter-spacing:.1em;color:#e9ddc4}
  #topbar .who b{font-weight:normal;color:#ffe9b8}
  #topbar .idx{display:inline-block;font-size:17px;letter-spacing:.22em;color:#150f09;
    background:linear-gradient(180deg,#e2c384,#c9a25c);padding:3px 12px 3px 14px;
    margin-right:16px;vertical-align:3px}
  #topbar .chief{margin-top:7px;font-size:20px;color:#bfb096;letter-spacing:.05em}

  /* ---------- 医案 ---------- */
  #casebook{position:absolute;right:54px;top:52px;width:474px;height:888px;
    padding:26px 24px 22px;display:flex;flex-direction:column}
  .cb-head{display:flex;align-items:center;gap:16px}
  .cb-head h2{font-size:30px;letter-spacing:.42em;color:var(--ink);font-weight:normal}
  #four{margin-left:auto;display:flex;gap:7px}
  .seal{width:42px;height:42px;display:flex;align-items:center;justify-content:center;
    font-size:23px;color:#b7a687;border:2px solid rgba(150,125,90,.45);
    transition:all .32s}
  .seal.on{color:#fff3dc;border-color:var(--zhu);background:var(--zhu);
    box-shadow:0 0 16px rgba(200,80,50,.5)}
  .cb-sub{margin-top:14px;font-size:18px;color:var(--ink3);letter-spacing:.04em;
    line-height:1.5;padding-bottom:12px;border-bottom:2px solid rgba(150,125,90,.28)}
  #tags{flex:1;overflow-y:auto;margin-top:14px;padding-right:6px}
  #tags::-webkit-scrollbar{width:6px}
  #tags::-webkit-scrollbar-thumb{background:rgba(150,125,90,.4)}
  .grp{margin-bottom:13px}
  .grp-h{font-size:19px;color:var(--zhu);letter-spacing:.26em;margin-bottom:6px;
    display:flex;align-items:center;gap:9px}
  .grp-h span{font-size:14px;letter-spacing:.08em;color:var(--ink3)}
  .grp-h:after{content:'';flex:1;height:1px;background:rgba(140,115,80,.28)}
  .tag{font-size:20px;line-height:1.46;color:var(--ink2);padding:2px 0 2px 20px;
    position:relative;letter-spacing:.02em;animation:tagIn .4s ease both}
  .tag.new{animation:tagIn .4s ease both, tagGlow 1.5s ease both}
  @keyframes tagGlow{
    0%{background:rgba(200,150,60,.34)}
    60%{background:rgba(200,150,60,.16)}
    100%{background:transparent}}
  .tag:before{content:'';position:absolute;left:4px;top:11px;width:7px;height:7px;
    background:var(--gold);transform:rotate(45deg)}
  @keyframes tagIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  .empty{font-size:19px;color:#a9987c;letter-spacing:.1em;padding:16px 0;
    line-height:1.8}
  #dxbtn{margin-top:14px;height:68px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;
    background:linear-gradient(180deg,#53766a,#3a554d);border:2px solid #2b403a;
    color:#f3ecdc;font-size:27px;letter-spacing:.42em;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.1),0 6px 16px rgba(0,0,0,.3);
    transition:all .16s}
  #dxbtn:hover{filter:brightness(1.14)}
  #dxbtn.warn{background:linear-gradient(180deg,#8a6a3e,#6b4f2c);border-color:#4f3a1e}

  /* ---------- 对话 ---------- */
  #dialogue{position:absolute;left:86px;bottom:50px;width:918px;
    padding:18px 28px 16px;min-height:132px;max-height:470px;display:none;
    flex-direction:column}
  #dialogue.show{display:flex;animation:dlgIn .3s ease both}
  @keyframes dlgIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .d-head{display:flex;align-items:center;gap:16px;margin-bottom:8px}
  #d-who{font-size:20px;letter-spacing:.26em;color:var(--zhu)}
  #skipbtn{margin-left:auto;padding:6px 18px;font-size:18px;letter-spacing:.2em;
    cursor:pointer;color:#4c4033;background:rgba(255,250,236,.65);
    border:2px solid var(--edge2);font-family:inherit;transition:all .15s;line-height:1.2}
  #skipbtn:hover{background:rgba(255,250,236,.98);border-color:#8b7350}
  #askbtn{margin-left:8px;padding:6px 20px;font-size:19px;letter-spacing:.2em;
    cursor:pointer;color:#fff0d4;background:linear-gradient(180deg,#b84632,#99301f);
    border:2px solid #76201a;font-family:inherit;
    box-shadow:0 3px 10px rgba(0,0,0,.25);transition:all .15s}
  #askbtn:hover{filter:brightness(1.15)}
  #askbtn.on{background:linear-gradient(180deg,#6b5a44,#52442f);border-color:#3e3222}
  #d-text{font-size:26px;line-height:1.66;color:var(--ink);letter-spacing:.02em;
    min-height:60px;white-space:pre-wrap}
  #d-text .narr{color:#7d6c54}
  #d-text .me{color:#3d5a52}
  #d-hint{font-size:18px;color:var(--zhu);letter-spacing:.16em;opacity:0;
    align-self:flex-end;margin-top:2px}
  #d-hint.on{animation:blink 1.5s infinite}
  @keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}

  /* ---------- 问诊列表 ---------- */
  #q-list{display:none;overflow-y:auto;max-height:330px;padding:4px 2px}
  #dialogue.asking #q-list{display:block}
  #dialogue.asking #d-text,#dialogue.asking #d-hint,
  #dialogue.asking #d-who{display:none}
  #q-list::-webkit-scrollbar{width:6px}
  #q-list::-webkit-scrollbar-thumb{background:rgba(150,125,90,.4)}
  #q-list .q{font-size:23px;color:var(--ink2);padding:9px 14px;cursor:pointer;
    border-left:3px solid transparent;transition:all .14s;letter-spacing:.02em;
    display:flex;align-items:center}
  #q-list .q:hover{background:rgba(180,150,100,.2);border-left-color:var(--zhu)}
  #q-list .q.used{color:#a4957a}
  #q-list .q .mk{margin-left:auto;font-size:15px;color:#a4957a;letter-spacing:.1em}

  /* ---------- 舌象 ---------- */
  #tonguecard{position:absolute;left:86px;bottom:296px;width:250px;padding:14px 14px 12px;
    display:none;text-align:center;z-index:15}
  #tonguecard.show{display:block;animation:dlgIn .3s ease both}
  #tonguecard .cap{font-size:19px;color:var(--zhu);letter-spacing:.3em;
    margin-bottom:4px}
  #tonguecard svg{width:82%;height:auto;display:block;margin:0 auto}
  #tonguecard .desc{font-size:17px;color:var(--ink3);margin-top:4px;line-height:1.45}

  /* ---------- 弹层 ---------- */
  #modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(8,6,4,.66);z-index:60}
  #modal.show{display:flex}
  .sheet{width:1180px;max-height:940px;overflow-y:auto;padding:44px 52px;
    position:relative;animation:sheetIn .34s cubic-bezier(.2,.9,.3,1) both}
  .sheet::-webkit-scrollbar{width:8px}
  .sheet::-webkit-scrollbar-thumb{background:rgba(150,125,90,.4)}
  @keyframes sheetIn{from{opacity:0;transform:translateY(26px) scale(.97)}
    to{opacity:1;transform:none}}
  .sheet h3{font-size:35px;letter-spacing:.34em;color:var(--ink);font-weight:normal;
    text-align:center}
  .sheet .sub{text-align:center;font-size:20px;color:var(--ink3);margin-top:12px;
    letter-spacing:.08em}
  .opts{margin-top:32px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .opt{padding:22px 26px;cursor:pointer;background:rgba(255,250,236,.55);
    border:2px solid var(--edge2);transition:all .16s}
  .opt:hover{border-color:var(--zhu);background:rgba(255,246,228,.9);
    transform:translateY(-2px);box-shadow:0 10px 22px rgba(120,90,50,.22)}
  .opt b{display:block;font-size:27px;color:var(--ink);letter-spacing:.12em;
    font-weight:normal}
  .opt i{display:block;font-size:17px;color:var(--ink3);margin-top:6px;
    font-style:normal;letter-spacing:.03em}
  .opt.pick{border-color:var(--zhu);background:rgba(255,240,220,.95);
    box-shadow:0 0 0 3px rgba(169,48,36,.16)}
  .opt.pick b{color:var(--zhu)}
  .result{margin-top:26px;font-size:21px;line-height:1.8;color:var(--ink2)}
  .result .k{color:var(--zhu);letter-spacing:.14em;margin-top:20px;font-size:22px}
  .result ul{margin:8px 0 0 24px}
  .result li{margin:7px 0}
  .result li b{color:var(--ink);font-weight:normal;letter-spacing:.04em}
  .verdict{text-align:center;font-size:44px;letter-spacing:.34em}
  .verdict.ok{color:var(--jade)}
  .verdict.no{color:var(--zhu)}
  .rx{margin-top:22px;padding:20px 26px;background:rgba(255,251,240,.6);
    border-left:5px solid var(--jade);font-size:23px;line-height:1.8}
  .rx b{color:var(--jade);letter-spacing:.16em;font-weight:normal;margin-right:12px}
  .actions{margin-top:30px;display:flex;gap:18px;justify-content:center}
  .btn{padding:15px 42px;font-size:24px;letter-spacing:.24em;cursor:pointer;
    border:2px solid var(--edge);background:rgba(255,250,236,.6);color:var(--ink2);
    font-family:inherit;transition:all .15s}
  .btn:hover{background:rgba(255,250,236,.95);border-color:var(--zhu)}
  .btn.primary{background:var(--zhu);border-color:#7d2318;color:#ffeacb}
  .btn.primary:hover{filter:brightness(1.1)}

  /* ---------- 提示 ---------- */
  #toast{position:absolute;left:50%;top:34px;transform:translateX(-50%) translateY(-18px);
    padding:14px 36px;font-size:22px;letter-spacing:.14em;color:#fff2d8;
    background:rgba(38,28,18,.9);border:2px solid var(--gold);opacity:0;
    transition:all .3s;pointer-events:none;z-index:80;white-space:nowrap}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .tip{position:absolute;z-index:50;padding:7px 20px;font-size:20px;
    letter-spacing:.14em;background:rgba(28,22,14,.92);color:#ffe9bc;
    border:1px solid var(--gold);pointer-events:none;white-space:nowrap;
    transform:translateX(-50%)}


  /* ================= 手机横屏：整个舞台等比缩，但界面字号放大一圈 ================= */
  @media (max-height: 560px){
    #topbar{padding:22px 0 0 30px}
    #topbar .brand{font-size:40px;letter-spacing:.2em}
    #topbar .brand em{font-size:26px}
    #topbar .who{font-size:26px;margin-top:10px}
    #topbar .idx{font-size:20px;padding:3px 12px;margin-right:12px}
    #topbar .chief{font-size:24px;margin-top:4px}
    #backbtn{font-size:22px;padding:7px 18px;margin-left:18px}
    /* 医案面板：缩窄，字放大 */
    #casebook{right:14px;top:12px;width:380px;height:calc(100% - 24px);padding:18px 18px 14px}
    #casebook h2{font-size:30px}
    .cb-sub{font-size:22px;margin-top:8px}
    #tags{margin-top:10px}
    .grp-h{font-size:24px}
    .grp-h span{font-size:18px}
    .tag{font-size:26px;line-height:1.4;padding:1px 0 1px 24px}
    .tag:before{top:14px;width:9px;height:9px}
    .empty{font-size:24px;line-height:1.6}
    .seal{width:52px;height:52px;font-size:27px}
    #dxbtn{height:74px;font-size:30px;letter-spacing:.3em}
    /* 对话框 */
    #dialogue{left:14px;bottom:12px;width:1120px;padding:18px 24px 16px;min-height:190px}
    .d-head{margin-bottom:8px}
    #d-who{font-size:24px}
    #skipbtn,#askbtn{font-size:22px;padding:7px 20px}
    #d-text{font-size:32px;line-height:1.55;min-height:96px}
    #d-hint{font-size:22px}
    #q-list .q{font-size:28px;padding:8px 12px}
    #tonguecard{width:250px;padding:10px}
    #tonguecard .cap{font-size:20px}
    #tonguecard .desc{font-size:17px}
    /* 弹层 */
    .sheet{width:92vw;max-height:96vh;padding:20px 24px}
    .sheet h3{font-size:38px}
    .sheet .sub{font-size:24px}
    .opts{gap:16px;margin-top:18px}
    .opt{padding:16px 18px}
    .opt b{font-size:30px}
    .opt i{font-size:20px}
    .result{font-size:24px;line-height:1.65}
    .result .k{font-size:26px;margin-top:12px}
    .verdict{font-size:40px}
    .rx{font-size:24px;padding:14px 16px}
    .btn{padding:12px 30px;font-size:26px}
    /* 候诊卡：手机上压矮，整张能塞进一屏 */
    .picks{gap:10px;margin-top:10px}
    .pcard{width:330px}
    .pimg{height:126px}
    .pinfo{padding:7px 10px 9px}
    .pinfo b{font-size:24px}
    .pinfo i{font-size:16px;margin-top:2px}
    .pinfo p{font-size:16px;min-height:0;line-height:1.3;margin-top:3px}
    .pdone{font-size:16px;margin-top:4px;padding-top:4px}
    /* 存档槽 */
    .slot{padding:12px 14px}
    .slot-h b{font-size:24px}
    .slot-h span{font-size:22px}
    .mini{font-size:21px;padding:5px 14px}
    .setrow .k{font-size:24px}
    .setrow .v{font-size:22px}
    .credit{font-size:17px}
    #toast{font-size:26px;padding:14px 30px}
    #menuFoot{font-size:26px;bottom:20px;left:30px}
    #menuVer{font-size:18px;left:30px;bottom:4px}
  }


  /* ================= 主菜单 ================= */
  #menu{position:absolute;inset:0;opacity:1;transition:opacity .45s ease}
  #menu.off{opacity:0;pointer-events:none}
  #menu .menubg{position:absolute;inset:0;width:100%;height:100%;
    image-rendering:pixelated;display:block}
  #menu .menudesk{position:absolute;inset:0;width:100%;height:100%;
    image-rendering:pixelated;display:block;pointer-events:none}
  #doctor{position:absolute;left:1000px;bottom:0;width:686px;height:880px;
    pointer-events:none;filter:drop-shadow(0 12px 30px rgba(8,5,3,.5))}
  #menu:after{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 66% 70% at 46% 44%,
      rgba(0,0,0,0) 52%, rgba(10,7,4,.42) 100%)}

  .drawer-hot{position:absolute;left:36px;width:696px;cursor:pointer;
    transition:background .18s ease, box-shadow .18s ease}
  .drawer-hot:hover{
    background:linear-gradient(90deg,
      rgba(255,214,140,.04) 0%, rgba(255,205,120,.22) 46%, rgba(255,214,140,.04) 100%);
    box-shadow:inset 0 0 0 2px rgba(245,205,130,.42),
               inset 0 0 70px rgba(255,190,90,.16)}

  #scrollPane{position:absolute;left:774px;top:186px;width:168px;height:450px;
    overflow:hidden;pointer-events:none}
  #scrollPane .scrollPaper{position:absolute;inset:0;width:100%;height:100%;
    display:block;opacity:0;transition:opacity .26s ease;
    image-rendering:pixelated}
  #scrollPane.on .scrollPaper{opacity:1}
  #scrollText{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;writing-mode:vertical-rl;text-orientation:upright;
    font-family:"STZhongsong","SimSun","Songti SC",serif;
    font-weight:700;font-size:66px;line-height:1.12;letter-spacing:.04em;
    color:#3a3128;opacity:0;transition:opacity .26s ease;white-space:nowrap;
    padding-top:8px}
  #scrollPane.on #scrollText{opacity:1}
  #scrollText.big{font-size:82px;padding-top:0}

  #menuFoot{position:absolute;left:64px;bottom:34px;text-align:left;
    font-size:21px;letter-spacing:.38em;color:#d8c8a4;
    text-shadow:0 2px 12px rgba(0,0,0,1),0 0 26px rgba(0,0,0,.9);pointer-events:none}
  #menuVer{position:absolute;left:64px;bottom:12px;font-size:15px;
    letter-spacing:.2em;color:#a8967a;
    text-shadow:0 2px 10px rgba(0,0,0,1);pointer-events:none}

  /* 设置里的音量条 / 存档槽 */
  .setrow{display:flex;align-items:center;gap:18px;margin-top:30px;padding:0 6px}
  .setrow .k{font-size:21px;letter-spacing:.16em;color:var(--ink2);white-space:nowrap}
  .setrow .v{width:52px;text-align:right;font-size:19px;color:var(--ink3)}
  .setrow input[type=range]{flex:1;-webkit-appearance:none;height:6px;
    background:linear-gradient(90deg,#b8a075,#8b7350);outline:none}
  .setrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
    width:22px;height:22px;background:#a83024;border:2px solid #7d2318;
    box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}
  .slots{margin-top:22px;display:flex;flex-direction:column;gap:12px}
  .slot{padding:14px 18px;background:rgba(255,250,236,.5);
    border:2px solid var(--edge2);display:flex;align-items:center;gap:16px}
  .slot-h{flex:1;display:flex;align-items:baseline;gap:14px;min-width:0}
  .slot-h b{font-size:20px;letter-spacing:.16em;color:var(--zhu);font-weight:normal;
    white-space:nowrap}
  .slot-h span{font-size:18px;color:var(--ink2);letter-spacing:.03em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot-h .dim{color:#a9987c}
  .slot-b{display:flex;gap:8px}
  .mini{padding:5px 14px;font-size:17px;letter-spacing:.1em;cursor:pointer;
    font-family:inherit;color:var(--ink2);background:rgba(255,255,255,.6);
    border:2px solid var(--edge2);transition:all .14s}
  .mini:hover{background:#fff;border-color:var(--zhu);color:var(--zhu)}
  .mini.warn:hover{border-color:#a83024;color:#a83024}
  #backbtn{margin-left:26px;pointer-events:auto;cursor:pointer;font-family:inherit;

/* ---------------- 打字机（打完停下等点击） ---------------- */
let typing = null, pendingNext = null, skipping = false;

function say(who, text, onDone){
  clearInterval(typing); typing = null;
  pendingNext = null;
  dlg.classList.add('show');
  $('#d-who').textContent = who;
  $('#askbtn').classList.remove('on');
  const el = $('#d-text');
  el.innerHTML = '';
  const span = document.createElement('span');
  span.className = who === '旁白' ? 'narr' : (who === '医者' ? 'me' : '');
  el.appendChild(span);
  const hint = $('#d-hint');
  hint.classList.remove('on');
  const raw = text;
  const finish = ()=>{
    clearInterval(typing); typing = null;
    span.textContent = raw;
    if(onDone) onDone();
    if(!skipping) hint.classList.toggle('on', !!pendingNext);
  };
  S.typingSkip = finish;
  if(FAST || skipping){ finish(); return; }
  let i = 0;
  typing = setInterval(()=>{
    i += 1; span.textContent = raw.slice(0, i);
    if(i >= raw.length){ clearInterval(typing); typing = null; finish(); }
  }, typeSpeed);
}

/* 跳过：把这一组话一口气放完 */
function skipGroup(){
  if(!pendingNext && !typing) return;
  skipping = true;
  $('#d-hint').classList.remove('on');
  if(typing && S.typingSkip) S.typingSkip();
  const pump = ()=>{
    if(!pendingNext){ skipping = false; return; }
    const f = pendingNext; pendingNext = null; f();
    setTimeout(pump, 0);
  };
  setTimeout(pump, 0);
}
$('#skipbtn').addEventListener('click', e=>{ e.stopPropagation(); skipGroup(); });
dlg.addEventListener('click', e=>{
  if(e.target.closest('#askbtn') || e.target.closest('#q-list')) return;
  if($('#dialogue').classList.contains('asking')) return;
  if(typing){ S.typingSkip(); return; }        // 正在打字：先看完整
  if(pendingNext){ const f = pendingNext; pendingNext = null; f(); }
});

  if(S.tags.some(t=>t.text === text)) return;

    box.innerHTML = '<div class="empty">尚无所得。<br>可点病人面、目、舌、胸腹，再看腕后脉枕。</div>';

  let html = '';
  SRC_ORDER.forEach(src=>{

    if(!list.length) return;
    html += `<div class="grp"><div class="grp-h">${src}<span>${
      {望:'望诊',闻:'闻诊',问:'问诊',切:'切诊'}[src]}</span></div>`;
    list.forEach(t=>{ html += `<div class="tag">${t.text}</div>`; });

  if(fresh){

    if(last){
      last.classList.add('new');
      last.scrollIntoView({block:'nearest'});

  }
}

/* ---------------- 舌象（像素块绘制） ---------------- */
function tongueSVG(t){
  const CELL = 3, W = 62, H = 68;
  const cx = 31, cy = 34, rx = 25, ry = 30;
  const bodyMap = {'淡红':'#d98b84','淡白':'#e5b0a3','红':'#cf6a62','绛':'#b4504a','紫暗':'#9a6a7a','淡胖':'#dda49a'};
  const coatMap = {'薄白':'#f7f2e4','白':'#f7f2e4','黄':'#e9d292','白腻':'#f1ead4','黄腻':'#e2c274','少苔':'#faf6ee'};
  const body = bodyMap[t.body] || '#d98b84';
  const coat = coatMap[t.coat] || '#f7f2e4';
  const thick = (t.coat.indexOf('腻') >= 0 || t.coat.indexOf('厚') >= 0) ? 1 : 0.74;
  const toRGB = h => h[0] === '#'
    ? [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]
    : h.replace(/[^0-9,.]/g,'').split(',').map(Number);
  const mix = (a,b,k)=>{
    const A = toRGB(a), B = toRGB(b);
    return 'rgb(' + Math.round(A[0]+(B[0]-A[0])*k) + ','
                  + Math.round(A[1]+(B[1]-A[1])*k) + ','
                  + Math.round(A[2]+(B[2]-A[2])*k) + ')';
  };
  const darkest = mix(body,'#4a2321',.50);
  const dark    = mix(body,'#5a2c2a',.26);
  const edge    = mix(body,'#5a2c2a',.12);
  const coatFull= mix(coat, body, 0.18);
  const out = [];
  for(let y=0; y<H; y++){
    let run = null, runX = 0;
    const flush = (xEnd)=>{
      if(run) out.push(`<rect x="${runX*CELL}" y="${y*CELL}" width="${(xEnd-runX)*CELL}" height="${CELL}" fill="${run}"/>`);
    };
    for(let x=0; x<=W; x++){
      let col = null;
      if(x < W){
        const ax = x+0.5, ay = y+0.5;
        const d = ((ax-cx)/rx)**2 + ((ay-cy)/ry)**2;
        if(d <= 1){
          if(d > 0.94) col = darkest;
          else if(d > 0.86) col = dark;
          else if(d > 0.79) col = edge;
          else col = mix(body, coatFull, thick);
          // 舌正中浅裂纹
          if(Math.abs(ax-cx) < 0.8 && ay > cy-ry*0.34 && ay < cy+ry*0.30) col = dark;
        }
      }
      if(col !== run){ flush(x); run = col; runX = x; }
    }
    flush(W);
  }
  // 舌面高光
  out.push(`<rect x="${(cx-10)*CELL}" y="${(cy-13)*CELL}" width="${12*CELL}" height="${3*CELL}" fill="#ffffff" opacity=".16"/>`);
  return `<svg viewBox="0 0 ${W*CELL} ${H*CELL}" shape-rendering="crispEdges">${out.join('')}</svg>`;
}

/* ---------------- 诊察 ---------------- */
let tongueToken = 0;

function examine(part){
  if(S.mode !== 'exam') return;
  const p = S.cur.exam[part];
  if(!p) return;
  setAsking(false);
  tongueToken++;
  $('#tonguecard').classList.remove('show');
  hideTip();
  if(S.found[part]){
    const got = S.tags.filter(t=>p.tags.includes(t.text)).map(t=>t.text).join('、');
    say('旁白', `这一处已经诊过了：${got}。`);
    return;
  }
  S.found[part] = true;
  const hr = document.querySelector(`.hot[data-part="${part}"]`);
  if(hr) hr.classList.add('done');

  // 症状立刻记进医案——不等对话点完，免得中途去点别处就丢了
  p.tags.forEach(t=>addTag(p.src, t));

  // 舌象稍等一下再弹，别抢在旁白前头
  if(p.tongue){
    const my = tongueToken;
    setTimeout(()=>{ if(my === tongueToken) showTongue(p.tongue); }, 420);
  }
  playLines(p.lines);
}

function playLines(lines, done){
  const nameOf = { p:S.cur.name, narr:'旁白', me:'医者' };
  if(FAST){
    const [who, txt] = lines[lines.length-1];
    say(nameOf[who] || who, txt, ()=>{ if(done) done(); });
    return;
  }
  let i = 0;
  const step = ()=>{
    if(i >= lines.length){ if(done) done(); return; }
    const [who, txt] = lines[i++];
    const isLast = i >= lines.length;
    say(nameOf[who] || who, txt, ()=>{
      if(isLast){ if(done) done(); }
      else pendingNext = step;
    });
  };
  step();
}

        <b>${o.name}</b><i>${o.sub}</i></div>`).join('')}
    </div>
    <div class="actions"><button class="btn" id="m-close">先不辨，再诊诊</button></div>`;
  $('#m-close').onclick = ()=> $('#modal').classList.remove('show');
  $('#sheet').querySelectorAll('.opt').forEach(el=>{
    el.onclick = ()=> judge(el.dataset.id);
  });
}

function judge(id){
  const c = S.cur;
  const v = $('#sheet');
  const opt = c.dx.options.find(o=>o.id === id);
  if(id === c.dx.answer){
    const r = c.dx.right;
    v.innerHTML = `
      <div class="verdict ok">辨 证 已 明</div>
      <div class="sub">${r.title}</div>
      <div class="result">
        <div class="k">辨证要点</div>
        <ul>${r.points.map(([a,b])=>`<li><b>${a}</b>　${b}</li>`).join('')}</ul>
        <div class="k">鉴别之处</div>
        <ul>${r.diff.map(([a,b])=>`<li><b>${a}</b>　${b}</li>`).join('')}</ul>
        <div style="margin-top:16px;color:#7a6748;font-size:20px">${r.rule}</div>
      </div>
      <div class="rx">
        <div><b>治法</b>${r.treat}</div>
        <div><b>方药</b>${r.formula}</div>
      </div>
      <div class="actions">
        <button class="btn primary" id="m-next">下一位病人</button>
      </div>`;
    S.mode = 'done';
    S.log.push({ name:S.cur.name, dx:r.title });
    saveNow();
    $('#m-next').onclick = ()=>{
      $('#modal').classList.remove('show');
      if(S.log.length >= CASES.length) showEnd();
      else showPicker();
    };
  }else{
    v.innerHTML = `
      <div class="verdict no">未 中 要 领</div>
      <div class="sub">你辨为：${opt.name}</div>
      <div class="result">${c.dx.wrong[id] || ''}</div>
      <div class="result" style="color:#8a7758;margin-top:18px">
        再回过头看：恶寒与发热孰重、有汗无汗、脉之浮紧浮缓，这三处最要紧。
      </div>
      <div class="actions">
        <button class="btn" id="m-again">退回去再看</button>
        <button class="btn primary" id="m-back">重新辨证</button>
      </div>`;
    $('#m-again').onclick = ()=> $('#modal').classList.remove('show');
    $('#m-back').onclick = ()=> openDx();
  }
}

/* ---------------- toast ---------------- */
let toastTimer = null;
function toast(t){
  const el = $('#toast');
  el.textContent = t; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('on'), 2200);
}

/* ---------------- 收诊 ---------------- */
function showEnd(){
  $('#modal').classList.add('show');
  $('#sheet').innerHTML = `
    <h3>三 诊 已 毕</h3>
    <div class="sub">表寒、中虚、气郁——一门四诊，看出三个路数</div>
    <div class="result">
      <ul>${S.log.map(l=>`<li><b>${l.name}</b>　${l.dx}</li>`).join('')}</ul>
      <div style="margin-top:26px;color:#7a6748;font-size:20px;line-height:1.9">
        证从四诊来：面色舌象看虚实，脉象定表里寒热，问诊补细节，闻诊辨声气。<br>
        同一味「虚」，是气虚还是阳虚；同一处「热」，是表热还是里热——都要几诊合看，不能凭一处断。
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="m-restart">再诊一轮</button>
    </div>`;
  $('#m-restart').onclick = ()=>{
    $('#modal').classList.remove('show');
    S.log = []; startCase(0);
  };
}

/* ---------------- 开始 ---------------- */
function startCase(i){
  S.ci = i; S.cur = CASES[i];
  S.tags = []; S.found = {}; S.asked = {}; S.mode = 'exam';
  $('#modal').classList.remove('show');
  const c = S.cur;
  // 人物：有立绘就用立绘，没有就用像素小人
  const po = $('#portrait'), pt = $('#patient');
  if(c.portrait){
    po.src = c.portrait;
    po.classList.remove('in'); pt.classList.remove('in');
    pt.style.visibility = 'hidden';
    if(FAST) po.classList.add('in');
    else requestAnimationFrame(()=> setTimeout(()=> po.classList.add('in'), 60));
  }else{
    po.classList.remove('in');
    pt.style.visibility = '';
    pt.src = c.img;
    if(FAST) pt.classList.add('in');
    else requestAnimationFrame(()=> setTimeout(()=> pt.classList.add('in'), 60));
  }
  applyHot(c.hot);
  $('#t-who').innerHTML =
    `<span class="idx">第${['一','二','三','四','五'][i] || (i+1)}诊</span>`
    + `${c.name}　${c.sex} · ${c.age}岁 · ${c.job}`;
  $('#t-chief').textContent = '主诉：' + c.chief;
  $('#cb-sub').textContent = `${c.name}，${c.sex}，${c.age}岁，${c.job}。`;
  $('#tonguecard').classList.remove('show');
  document.querySelectorAll('.seal').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.hot').forEach(e=>e.classList.remove('done'));
  renderTags();
  setAsking(false);
  playLines(c.greet);
  if(i === 0 && !S.guided){
    S.guided = true;
    setTimeout(()=>{ if(!FAST) toast('点病人身上各处：面、目、口、胸腹、腕后脉枕'); }, 1400);
  }
  saveNow();
}

/* ================= 主菜单 ================= */
const SAVE_KEY = 'tcm_saves_v2';
const MENU_ITEMS = [
  { act:'start',    text:'开始游戏' },
  { act:'cont',     text:'继续游戏' },
  { act:'case',     text:'医案' },
  { act:'settings', text:'设置' },
  { act:'save',     text:'存档' },
  { act:'quit',     text:'退出游戏' },
];
const menuEl = $('#menu'), gameEl = $('#game');
const scrollPane = $('#scrollPane'), scrollText = $('#scrollText');

function buildMenu(){
  const top = 132, rowH = 102;   // 百子柜六层抽屉（原生 rows = 22 + i*17，高 16，×6）
  MENU_ITEMS.forEach((it, i)=>{
    const d = document.createElement('div');
    d.className = 'drawer-hot';
    d.dataset.act = it.act;
    d.style.top = (top + i * rowH) + 'px';
    d.style.height = rowH + 'px';
    d.addEventListener('mouseenter', ()=> hintScroll(it.text));
    d.addEventListener('mouseleave', ()=> hintScroll(null));
    d.addEventListener('click', ()=> doMenu(it.act));
    menuEl.insertBefore(d, scrollPane);
  });
}
function hintScroll(text){
  if(text === null){ scrollPane.classList.remove('on'); return; }
  scrollPane.classList.add('on');
  if(scrollText.textContent !== text){
    scrollText.textContent = text;
    scrollText.classList.toggle('big', text.length <= 2);
  }
}
function doMenu(act){
  startBgm();
  if(act === 'start'){ S.log = []; showPicker(); }
  else if(act === 'cont'){
    const s = loadSave();
    if(!s){ toast('还没有存下的医案'); return; }
    enterGame(Math.min(s.ci || 0, CASES.length - 1), false);
  }
  else if(act === 'case')     showArchive();
  else if(act === 'settings') showSettings();
  else if(act === 'save')     showSave();
  else if(act === 'quit')     $('#shutter').classList.add('on');
}
function enterGame(ci, fresh){
  startBgm();
  menuEl.classList.add('off');
  gameEl.classList.add('on');
  if(fresh){ S.log = []; }
  startCase(ci || 0);
}
function backToMenu(){
  gameEl.classList.remove('on');
  menuEl.classList.remove('off');
  $('#modal').classList.remove('show');
  $('#dialogue').classList.remove('show');
  $('#tonguecard').classList.remove('show');
  hintScroll(null);
}

/* ---- 存档（4 个槽：0 号自动，1~3 手动） ---- */
const SLOT_N = 4;
function readSlots(){
  try{
    const a = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if(Array.isArray(a)){
      const out = a.slice(0, SLOT_N);
      while(out.length < SLOT_N) out.push(null);
      return out;
    }
  }catch(e){}
  return new Array(SLOT_N).fill(null);
}
function writeSlots(a){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(a)); }catch(e){}
}
function snap(){ return { ci:S.ci, log:S.log, at:Date.now() }; }
function saveNow(){                       // 自动写 0 号槽
  const a = readSlots();
  a[0] = snap();
  writeSlots(a);
}
function saveToSlot(i){
  const a = readSlots();
  a[i] = snap();
  writeSlots(a);
}
function clearSlot(i){
  const a = readSlots();
  a[i] = null;
  writeSlots(a);
}
function latestSlot(){
  let best = null;
  readSlots().forEach(s=>{ if(s && (!best || s.at > best.at)) best = s; });
  return best;
}
function loadSave(){ return latestSlot(); }

/* ---- 菜单里的几个弹层 ---- */
function sheetClose(){ $('#modal').classList.remove('show'); }

/* ---- 候诊：这几位在等着，先看哪个 ---- */
function showPicker(){
  const done = {};
  S.log.forEach(l=>{ done[l.name] = l.dx; });
  const left = CASES.filter(c=>!done[c.name]).length;
  const cards = CASES.map((c, i)=>{
    const isDone = !!done[c.name];
    const src = c.portrait || c.img;
    return `<div class="pcard ${isDone ? 'done' : ''}" data-i="${i}">
      <div class="pimg"><img src="${src}" alt=""></div>
      <div class="pinfo">
        <b>${c.name}</b>
        <i>${c.sex} · ${c.age}岁 · ${c.job}</i>
        <p>${c.chief}</p>
        ${isDone ? `<span class="pdone">已断 · ${done[c.name]}</span>` : ''}
      </div>
    </div>`;
  }).join('');
  $('#modal').classList.add('show');
  $('#sheet').innerHTML = `
    <h3>候 诊</h3>
    <div class="sub">${left ? `还有 ${left} 位在等着——先请哪一位进来？` : '都看完了'}</div>
    <div class="picks">${cards}</div>
    <div class="actions" style="margin-top:24px">
      <button class="btn" id="m-close">回门厅</button>
    </div>`;
  $('#m-close').onclick = ()=>{ sheetClose(); backToMenu(); };
  $('#sheet').querySelectorAll('.pcard:not(.done)').forEach(el=>{
    el.onclick = ()=>{
      const i = +el.dataset.i;
      sheetClose();
      enterGame(i, false);
    };
  });
}

function showArchive(){
  const s = loadSave();
  const log = (s && s.log) || S.log || [];
  $('#modal').classList.add('show');
  $('#sheet').innerHTML = `
    <h3>医 案</h3>
    <div class="sub">诊过的病人，断出的证</div>
    <div class="result">
      ${log.length
        ? '<ul>' + log.map(l=>`<li><b>${l.name}</b>　${l.dx}</li>`).join('') + '</ul>'
        : '<div style="text-align:center;color:#8a7758;padding:34px 0;font-size:21px">还没有断过案。先坐下接诊吧。</div>'}
    </div>
    <div class="actions"><button class="btn" id="m-close">合 上</button></div>`;
  $('#m-close').onclick = sheetClose;
}

function showSettings(){
  $('#modal').classList.add('show');
  const cur = typeSpeed;
  $('#sheet').innerHTML = `
    <h3>设 置</h3>
    <div class="sub">声音 · 文字快慢</div>
    <div class="setrow">
      <span class="k">背景音乐</span>
      <input id="vol" type="range" min="0" max="100" value="${Math.round(bgmVol*100)}">
      <span class="v" id="volv">${Math.round(bgmVol*100)}</span>
    </div>
    <div class="opts" style="grid-template-columns:1fr 1fr 1fr;margin-top:22px">
      <div class="opt ${cur <= 12 ? 'pick' : ''}" data-sp="10"><b>快</b><i>一眼扫过</i></div>
      <div class="opt ${cur > 12 && cur <= 24 ? 'pick' : ''}" data-sp="22"><b>常</b><i>默认</i></div>
      <div class="opt ${cur > 24 ? 'pick' : ''}" data-sp="40"><b>慢</b><i>慢慢看</i></div>
    </div>
    <div class="actions" style="gap:24px">
      <button class="btn" id="m-clear">清掉全部存档</button>
      <button class="btn primary" id="m-close">好</button>
    </div>
    <div class="credit">音乐 Shenyang · Kevin MacLeod (incompetech.com) · CC BY 4.0</div>`;
  const vol = $('#vol');
  vol.oninput = ()=>{
    bgmVol = +vol.value / 100;
    applyBgm();
    $('#volv').textContent = vol.value;
    try{ localStorage.setItem('tcm_vol', String(bgmVol)); }catch(e){}
  };
  $('#sheet').querySelectorAll('.opt').forEach(el=>{
    el.onclick = ()=>{
      typeSpeed = +el.dataset.sp;
      $('#sheet').querySelectorAll('.opt').forEach(o=>o.classList.remove('pick'));
      el.classList.add('pick');
    };
  });
  $('#m-clear').onclick = ()=>{
    writeSlots(new Array(SLOT_N).fill(null));
    toast('存档已清');
  };
  $('#m-close').onclick = sheetClose;
}

function showSave(){
  const a = readSlots();
  const CN = ['一','二','三','四','五'];
  const inGame = gameEl.classList.contains('on');
  const txt = (s)=>{
    const who = CASES[s.ci] ? CASES[s.ci].name : '';
    const when = new Date(s.at).toLocaleString('zh-CN',{hour12:false, month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
    return `第${CN[s.ci] || (s.ci+1)}诊 · ${who}　已断${(s.log||[]).length}例　${when}`;
  };
  const rows = a.map((s, i)=>{
    const label = i === 0 ? '自动' : `存档 ${i}`;
    return `<div class="slot">
      <div class="slot-h"><b>${label}</b>${s ? `<span>${txt(s)}</span>` : '<span class="dim">空</span>'}</div>
      <div class="slot-b">
        ${s ? `<button class="mini" data-load="${i}">读</button>` : ''}
        ${!inGame || i === 0 ? '' : `<button class="mini" data-save="${i}">存入</button>`}
        ${s ? `<button class="mini warn" data-del="${i}">删</button>` : ''}
      </div>
    </div>`;
  }).join('');
  $('#modal').classList.add('show');
  $('#sheet').innerHTML = `
    <h3>存 档</h3>
    <div class="sub">0 号自动存，1~3 随便存</div>
    <div class="slots">${rows}</div>
    <div class="actions"><button class="btn" id="m-close">合 上</button></div>`;
  $('#m-close').onclick = sheetClose;
  $('#sheet').querySelectorAll('[data-load]').forEach(b=>{
    b.onclick = ()=>{
      const s = readSlots()[+b.dataset.load];
      if(!s) return;
      sheetClose();
      enterGame(s.ci, false);
    };
  });
  $('#sheet').querySelectorAll('[data-save]').forEach(b=>{
    b.onclick = ()=>{
      saveToSlot(+b.dataset.save);
      toast('已存入 ' + b.dataset.save + ' 号');
      showSave();
    };
  });
  $('#sheet').querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = ()=>{
      clearSlot(+b.dataset.del);
      showSave();
    };
  });
}

/* ---- 退出幕 ---- */
$('#shutter').addEventListener('click', ()=>{
  $('#shutter').classList.remove('on');
  backToMenu();
});

/* ---- 回门厅按钮 ---- */
$('#backbtn').addEventListener('click', e=>{ e.stopPropagation(); backToMenu(); });

/* ---- 快捷键：S 存档 / 空格 跳过 / Esc 回菜单 ---- */
addEventListener('keydown', e=>{
  if((e.key === 's' || e.key === 'S') && gameEl.classList.contains('on')
     && !$('#modal').classList.contains('show')){
    e.preventDefault(); showSave(); return;
  }
  if(e.key === ' ' && gameEl.classList.contains('on')){
    e.preventDefault(); skipGroup(); return;
  }
  if(e.key !== 'Escape') return;
  if($('#modal').classList.contains('show')){ sheetClose(); return; }
  if(gameEl.classList.contains('on')) backToMenu();
});

buildMenu();
if(/[?&]play=1/.test(location.search) && !gameEl.classList.contains('on')) enterGame(0, true);

/* 调试/自动化测试钩子（不影响玩法） */
window.__DBG = {
  typing: ()=> !!typing,
  pending: ()=> !!pendingNext,
  state: ()=> ({ tags:S.tags.length, found:Object.keys(S.found),
                 asked:Object.keys(S.asked), mode:S.mode, ci:S.ci }),
};

/* ---------------- 截图/调试钩子 ---------------- */
function allExam(){
  ['face','eyes','mouth','neck','pulse'].forEach(k=>{
    S.found[k] = true;
    S.cur.exam[k].tags.forEach(t=>addTag(S.cur.exam[k].src, t));
    if(S.cur.exam[k].tongue) showTongue(S.cur.exam[k].tongue);
  });
}
function runShot(){
  if(SHOT === 'pick'){ S.log = []; showPicker(); return; }
  if(SHOT === 'case2'){ startCase(1); }
  else if(SHOT === 'case3'){ startCase(2); }
  else if(SHOT === 'ask'){ $('#askbtn').click(); }
  if(SHOT === 'exam'){ allExam(); say(S.cur.name, '大夫，您看我这……'); }
  if(SHOT === 'tongue'){
    S.found.mouth = true;
    S.cur.exam.mouth.tags.forEach(t=>addTag('望', t));
    showTongue(S.cur.exam.mouth.tongue);
    say('旁白', '舌质淡红，舌苔薄白，舌面润润的，像蒙了一层清水。');
  }
  if(SHOT === 'dx'){
    allExam();
    [0,1,2].forEach(i=>{ S.asked[i] = true;
      S.cur.asks[i].tags.forEach(t=>addTag('问', t)); });
    openDx();
  }
  if(SHOT === 'right'){ S.mode = 'exam'; allExam(); openDx(); judge('a'); }
  if(SHOT === 'wrong'){ S.mode = 'exam'; allExam(); openDx(); judge('b'); }
  if(SHOT === 'flow'){
    S.mode = 'exam'; allExam(); openDx(); judge('a');
    setTimeout(()=>{ const b = document.getElementById('m-next'); if(b) b.click(); }, 30);
  }
  if(SHOT === 'clicktest'){
    setTimeout(()=>{
      const out = document.createElement('div');
      out.id = 'testout';
      const a = $('#d-text').textContent, hintA = $('#d-hint').classList.contains('on');
      dlg.click();                       // 第一句已打完 → 应进第二句
      const mid = $('#d-text').textContent;
      const out2 = document.createElement('div');
      out.textContent = 'A=' + a + ' |hintA=' + hintA + ' |afterClick=' + mid;
      document.body.appendChild(out);
      setTimeout(()=>{
        const b = $('#d-text').textContent;
        out2.id = 'testout2';
        out2.textContent = 'B=' + b + ' |hintB=' + $('#d-hint').classList.contains('on');
        document.body.appendChild(out2);
      }, 1800);
    }, 2400);
  }
}
if(SHOT){
  if(SHOT !== 'menu' && SHOT !== 'pick' && !gameEl.classList.contains('on')) enterGame(0, true);
  if(document.readyState === 'complete') runShot();
  else addEventListener('load', runShot);
}
</script>
