<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>岐黄问道 · 两个小游戏</title>
<style>
  :root{--ink:#14120f;--gold:#d6b26e;--paper:#efe9dd;--dim:#9a9082;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 18%,#2a241c 0%,var(--ink) 55%);color:var(--paper);font-family:"KaiTi","STKaiti","Songti SC",serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 22px 64px;}
  .seal{width:64px;height:64px;border:2px solid #a5342c;color:#c7503f;display:grid;place-items:center;font-size:26px;letter-spacing:2px;border-radius:6px;margin-bottom:22px;}
  h1{font-size:clamp(34px,7vw,54px);letter-spacing:.16em;margin:0 0 10px;color:var(--gold);font-weight:400;}
  .sub{color:var(--dim);letter-spacing:.28em;font-size:14px;margin-bottom:44px;}
  .wrap{width:min(760px,100%);display:grid;gap:18px;grid-template-columns:1fr;}
  @media(min-width:760px){.wrap{grid-template-columns:1fr 1fr;}}
  .card{border:1px solid rgba(214,178,110,.28);border-radius:14px;padding:24px 22px;background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:10px;}
  .card h2{margin:0;font-size:24px;font-weight:400;color:var(--paper);letter-spacing:.08em;}
  .card p{margin:0;color:var(--dim);font-size:14px;line-height:1.7;}
  .btn{align-self:flex-start;margin-top:8px;padding:9px 22px;border-radius:8px;border:1px solid rgba(214,178,110,.6);color:var(--gold);text-decoration:none;font-size:15px;letter-spacing:.12em;transition:.2s;}
  .btn:hover{background:rgba(214,178,110,.12);}
  .foot{margin-top:46px;color:#6f675c;font-size:12.5px;letter-spacing:.12em;line-height:2;text-align:center;}
  .hr{width:120px;height:1px;background:rgba(214,178,110,.35);margin:34px 0 0;}
</style>
</head>
<body>
  <div class="seal">岐黄</div>
  <h1>岐黄问道</h1>
  <div class="sub">中医典籍 · 背诵闯关</div>
  <div class="wrap">
    <div class="card">
      <h2>岐黄问道</h2>
      <p>三卷闯关：先秦两汉 → 明清温病 → 近代汇通。连线、排序、填空、选择四种题型，答错一轮再来。</p>
      <a class="btn" href="./qihuang/index.html">开始闯关</a>
    </div>
    <div class="card">
      <h2>阴阳 · 黑白粒子</h2>
      <p>黑的是阴，白的是阳。六条规律逐条开关，补阴泻阳，看阴阳消长怎么变。</p>
      <a class="btn" href="./qihuang/yinyang.html">进来看粒子</a>
    </div>
  </div>
  <div class="hr"></div>
  <div class="foot">两个单文件网页 · 不用安装 · 不用联网<br>手机请用浏览器打开（竖屏效果最好）<br>作者：林希夏酱</div>
</body>
</html>
